  <script>
    // Mock-only boot, not product code. ?tone=light|dark stands in for the device
    // preference (the 052/063/074/085 preview convention). ?appearance=app turns on
    // Follow GitHub app theme through the product's own bootstrap slot, and the
    // bundle supplies 085's observed GitHub app variables. Every network call is
    // refused before any product code runs.
    (() => {
      const params = new URLSearchParams(location.search);
      const root = document.documentElement;
      const QUERY = '(prefers-color-scheme: dark)';
      const real = window.matchMedia.bind(window);
      const device = real(QUERY);
      const asked = params.get('tone');
      let forced = asked === 'dark' ? true : asked === 'light' ? false : null;
      const listeners = new Set();
      const list = {
        media: QUERY, onchange: null,
        get matches() { return forced ?? device.matches; },
        addEventListener(type, listener) { if (type === 'change') listeners.add(listener); },
        removeEventListener(type, listener) { listeners.delete(listener); },
        addListener(listener) { listeners.add(listener); },
        removeListener(listener) { listeners.delete(listener); },
        dispatchEvent() { return false; },
      };
      const notify = () => listeners.forEach(listener => listener({ matches: list.matches, media: QUERY }));
      device.addEventListener('change', () => { if (forced === null) notify(); });
      window.matchMedia = query => (String(query).replace(/\s+/g, ' ').trim() === QUERY ? list : real(query));
      window.__mockSetTone = tone => { forced = tone === 'dark'; notify(); };
      const app = params.get('appearance') === 'app';
      const tone = list.matches ? 'dark' : 'light';
      root.dataset.mockTone = tone;
      if (app) { root.setAttribute('data-theme-tone', tone); root.setAttribute('data-theme-source', 'github-app-fixture'); }
      const boot = document.createElement('script');
      boot.type = 'application/json';
      boot.id = 'dude-canvas-bootstrap';
      boot.textContent = JSON.stringify({ followAppTheme: app, preferenceError: null });
      document.head.append(boot);
      window.fetch = () => Promise.reject(new TypeError('This mock makes no network requests.'));
    })();
  </script>
  <!--
    ==========================================================================
    CANONICAL 067 PROPOSAL, ROUND 1 (exploring, NOT approved): Work Type
    Presentation. Canvas shows what each work item is trying to do (intent),
    what kind of work it is (domain), and how far it has got (stage), and the
    details replace "Lifecycle and progress" with one read-only progress
    report. No product UI source may change until the user explicitly
    approves this exact file.
    Primary artifact (preview_path):
      .dude/specs/067-work-type-presentation/design/work-type-presentation.html
    Owner: .dude/ideas/067-work-type-presentation.md
    Spec: .dude/specs/067-work-type-presentation/spec.md (Mock Scenario Matrix
    M1 to M14; Scope And Surfaces holds the Architect's capability envelope).
    ==========================================================================

    BUILT ON TODAY'S CANVAS, NOT A NEW SYSTEM
      The product view is React and Fluent UI v9 (@fluentui/react-components
      9.74.7, react 19.2.8), bundled with the scoped esbuild 0.28.2 in
      scripts/dude-canvas-ui. source/styles.js and source/theme.js are
      verbatim copies of the product files:
        styles.js  f13a5970b1bfa31b215720b5a3d7fb726739c1c5a3e38d8a715374748a756c1b
        theme.js   5c1a341cce6e8643b6503ecb56d61c15d843171ead58becd0c4b0ed462c3f25f
      source/work-type-presentation.jsx recomposes the affected surfaces from
        app.jsx        7c7e439df57de98a21df675d8f44cf042aaff96de1040a91f9b428b32d0b6644
        needs-you.jsx  b19a080165a7156e7c68e484559e33b1d82d199dda684370c38a442a0bc3f5ef
      with the same classes, components, and markup. Continuity: 052's desktop
      workspace; 062's single search with Working on and Clear, the expandable
      rail, the compact list below 620px of list width, and the docked task
      detail at 1080px and wider; 057's capture and response behavior; and
      085's ordinary and app-following light and dark appearance (theme.js
      unchanged). Navigation keeps its destinations and order.

    WHAT 067 CHANGES (proposal; every word is provisional until approval)
      1. Wording. Rail and Overview entry "New idea" becomes "New work item";
         Needs you "Save as idea" becomes "Save as work item". The details
         eyebrow is "Work item" for every record. No record is called an idea
         or a feature because of its lifecycle. Orientation strings change:
         "This feature is still an idea." -> "This work item is captured but
         not defined yet."; "This idea is resolved." -> "This work item is
         closed."; "This idea has no task definitions." -> "No tasks are
         recorded for this work item." Stage words Idea, Verified, and
         Completed without a package give way to Captured, Completed, Closed.
      2. List rows (M1, M2). The Name cell gains one secondary line with the
         recorded intent and domain, such as "Fix · Code", or "Unrecognized
         intent · Design", or "Classification unavailable". Not set shows
         nothing in the row. Status shows the stage from the shared rule, with
         any existing note beneath it (Next by recorded dependencies, Recorded
         for later, Waiting on a declared dependency). No new column, filter,
         or sort; search matches the same fields as today. Each row's
         accessible name says number, title, intent and domain (including Not
         set), stage, progress, and path.
      3. Details header. "Work item" eyebrow, the numbered title, then three
         plain label/value pairs: Intent, Domain, Stage. Not set, Unrecognized,
         and Unavailable read as words in regular weight, never by color.
         Under the path: "Ask Dude in chat to set or change the intent or
         domain. Changing them doesn't change the stage or start any work."
         There is no edit control. Respond to request appears only for a
         current request for this exact record. Review design, and the
         "No current owner-qualified preview request" line, appear only for a
         design definition or a current preview request (FR-003).
      4. Progress report (replaces "Lifecycle and progress"). The ruled
         label/value rows of 074's About sheet, one row per evidenced part,
         each naming its source: Stage (with any note), Current phase or
         Current phases (recorded headings), Phase "Not exposed" for tracked
         work, Design status (with "Checkpoint reached" for Proposed or
         Approved), Required gate "Design approval" (the only gate), Waiting
         for you "<kind> from <owner>" for each current request ("It adds no
         gate and doesn't change the stage."), and Requests "Status partial"
         or "Status unavailable" with the reason, never None. Parts without
         evidence become one sentence, for example "No current phase, design
         status, or required gate is recorded." Then today's counts, bar, and
         recorded-state disclaimer, as counts only. Completed and Closed add
         one sentence each: not a verification, review, or release result;
         closing doesn't mean implemented. Recorded blockers now name the
         blocker class (Plan gap) above the reason (M7).
      5. New work item (M12). Under the description, two optional Fluent
         Dropdown fields side by side, Intent (Not set, Create, Fix, Maintain,
         Explore) and Domain (Not set, Code, Design, Writing, Video, Other),
         both starting at Not set, plus one hint line. Submit, Save, Cancel,
         destinations, and locking keep today's meaning; locking stays keyed
         to the text. Statuses: Responding, Awaiting capture delivery,
         Delivery uncertain (no resend; text and choices kept), Not sent
         (refused value, retryable), Work item saved with "Recorded: Intent X
         · Domain Y" from the read-back, plus "Existing intent kept" (notice)
         or "Domain not recorded" (warning) when the record differs, and
         Waiting for the joined agent. Every status keeps the draft.
      6. Needs you. "Save as work item" opens "Text to save" and "Save this
         text" (was "Intent to retain" and "Capture this intent", renamed so
         "intent" keeps one meaning). It sends no intent or domain.
      7. Captured description. The details dock's "Captured intent" and
         "What you wanted to do" become "Captured description", for the same
         reason.
      Unchanged: search, Show, Working on and Clear, the rail, the compact
      list, the task inspector and dock, Next step, Tasks, Activity, Sources
      and freshness, the status bar, and both appearance modes.

    CAPABILITY ENVELOPE (spec, Scope And Surfaces)
      Existing and live here: search and Show, Working on and Clear, the
      expandable rail, row selection into Now, task inspection and filters,
      Respond to request (opens Needs you on that request), and capture with
      Submit, Save, and Cancel. Added by 067 and live here: the two optional
      capture fields, read-only intent, domain, and stage, the progress
      report, and the chat instruction. Labeled fixture transitions: Submit
      and Save run a simulated owner (Responding, Awaiting capture delivery,
      then the strip's Next capture result); Save this text does the same.
      Mock actions that report in the strip instead of acting: Refresh (data
      is frozen) and Review design (Review is unchanged and not in this
      file). Settings and the response forms in Needs you are unchanged and
      shown as dashed "Mock note" boxes, not as controls.

    MOCK-ONLY CHROME (the strip above the window, never product UI)
      Scenario (?scenario=M1 ... M14b, M12-<state>, S1 blank workspace, S2
      Save as work item, S3 this repository), Data (fixtures, repository,
      blank), Request feed (requests, idle, partial, unavailable), Capture
      state (the nine M12 states), Next capture result, Appearance
      (?appearance=app reloads with Follow GitHub app theme on), and Tone
      (?tone=light|dark, live). ?controls=hide collapses the strip to one
      line. The strip's last line reports fixture transitions and mock
      actions.

    DATA AND PROVENANCE
      This repository: source/repository-snapshot.json, generated read-only
      with the product's own projection readers (readWorkIndex and
      readNowProjection). bd was injected as a missing executable, so no
      Beads command ran. 91 records; no ledger carries work_intent or
      work_domain, so every real record reads Not set and shows no
      classification line. Full detail was captured for 066, 067, 078, 085
      (app theme), and 087; other real records show their header and
      progress report from list data, with dashed notes where rows or
      activity were not captured.
      Fixtures: source/fixtures.json. Records 901 to 913, four requests,
      four feeds, nine capture presets, and the scenarios, each traced to the
      spec's matrix, user stories, edge cases, or plan. None is a record of
      this repository. Request and source revisions are "fixture-..." labels,
      not hashes.
      App-following appearance: 085's observed GitHub app variables
      (2026-10-15), documented-contract keys only.

    OPEN POINTS FOR THE APPROVAL ROUND
      a. The plan's progress contract carries checkpoints only for Proposed
         and Approved; the spec asks details to show the recorded design
         status, including Exploring. This mock's report carries `design`.
      b. Renames in 6 and 7 avoid two meanings of "intent"; approval can
         revert them.
      c. Single-value rows read "Fix" or "Code" alone; the vocabularies do
         not overlap, and the accessible name names both fields.
      d. Details say "No tasks are recorded yet." where today's section
         showed "0 of 0 tasks"; the list's Progress column keeps today's text.
      e. Classified rows grow by one line; unclassified rows, including every
         record in this repository today, keep their current height.

    RUNTIME ASSETS (2): this file and work-type-presentation.js
      (868935 bytes, SHA256 f3cd9c04d34dc16d810cd7b03651ad5b1fc1bc414e91ff2ba8d5a65d11213bd0).
      Supporting: work-type-presentation.js.LEGAL.txt (45 bundled packages,

    RENDER EVIDENCE (screenshots/, not competing artifacts)
      Captured in headless Microsoft Edge over a CDP pipe, one frame per
