  <!--
    Inline empty-data icon. The browser otherwise requests /favicon.ico and logs
    a 404. This declaration is a data URL, so it keeps the prototype's
    external-resource-free constraint intact: nothing is fetched.
  -->
  <link rel="icon" href="data:,">
  <script>
    /*
      PRE-PAINT RESOLUTION — host colour scheme and query-parameter overrides.

      A real build reads the host's theme and hands FluentProvider either
      webLightTheme or webDarkTheme. The prototype does the same thing with the
      only signal a standalone page has: prefers-color-scheme. The class is set
      on <html> here, in <head>, so the token block below resolves the correct
      theme in the first style pass instead of flashing light.

      The prototype also accepts query parameters so a reviewer can link
      straight to a fixture:

        ?state=current|chooser|blocked|stale|empty|malformed|mismatch
        ?theme=light|dark
        ?controls=open|closed

      ?theme is applied here, before first paint, for the same reason. Nothing
      is persisted: there is no storage and no cookie. The host preference is
      the default for this page load and an explicit choice overrides it for
      the rest of the page's lifetime only.
    */
    (function () {
      try {
        var query = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (query && query.matches) {
          document.documentElement.classList.add('proto-host-dark');
        }
      } catch (error) {
        /* No matchMedia: the light default in the token block stands. */
      }
      try {
        var theme = new URLSearchParams(window.location.search).get('theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-proto-theme', theme);
        }
      } catch (error) {
        /* No URLSearchParams: the host preference stands. */
      }
    }());
  </script>

    WHAT THIS IS
      A standalone, self-contained interactive HTML prototype of the read-only
      I1 "Now" workspace. It is NOT React product source. It exists so the
      responsive composition, Fluent anatomy, and every source-backed state can
      be inspected and corrected before any product code is written.

      No network, no CDN, no webfont, no fetch, no build step, no logo.
      Every icon is inline SVG. Segoe UI is requested first and falls back to
      the platform UI font, exactly as FluentProvider behaves off Windows.

    WHAT IT IS NOT
      Not Needs You. Not Sharpie/Review. Not a dashboard. Not a command list.
      Nothing here mutates Dude state, sends a message, runs a command, answers
      a question, approves, or stops work.

    --------------------------------------------------------------------------
    RESPONSIVE ARCHITECTURE — full available width, never a centred shell
    --------------------------------------------------------------------------
    The product workspace has NO max-width. It fills the host canvas. Only
    prose is bounded, by --layout-measure-prose (68ch), inside fluid regions.

    Page padding is a constant 16px per side at every width, so:

        main width  ==  viewport width - 32     at EVERY width

    There is no width at which <main> loses room to a rail. That is the direct
    fix for the reported 759->760 (719->404) and 1079->1080 (723->444)
    compressions: neither boundary exists any more, and no replacement
    boundary takes width away from main.

    Composition is expressed with CONTAINER queries, not viewport media
    queries, because every threshold is about how much room a region actually
    has, not about a device class. Fluent UI v9 supports container queries in
    Griffel, so this is implementable as authored.

      WORKSPACE container (.dw-main, container-name: workspace)
        below 928px    one column:
                       identity strip -> next step -> lifecycle/progress ->
                       attention -> freshness -> evidence.
                       The context sections below the fold use
                       repeat(auto-fit, minmax(280px, 1fr)), so they fill the
                       full width in 1, 2, or 3 columns with no breakpoint and
                       without ever compressing the primary work region.

        >= 928px       two regions: [ work | context ].
                       work    = minmax(600px, 1fr)
                       context = minmax(300px, 340px)
                       column gap 24px.
                       Derivation: 600 + 24 + 300 = 924 minimum honest fit;
                       928 is taken for 4px of slack, which is viewport 960.
                       The context column carries the condensed lifecycle and
                       progress FIRST, so lifecycle/progress is genuinely
                       side-by-side with the next step, then attention,
                       freshness, and evidence.

      FOCAL container (.dw-focal, container-name: focal)
        >= 968px       the focal surface itself recomposes into
                       [ headline + detail | current phase + why ].
                       A container query measures the CONTENT box, so this is
                       the room inside the card's 20px padding and 4px accent.
                       Honest minimum fit is 490 (prose measure) + 24 + 260 =
                       774; 968 is taken instead so the headline column lands
                       at 607px rather than at its 490px floor. In one-column
                       composition the focal content box never reaches 968, so
                       this first applies at viewport 1409 - very wide canvases
                       use their width instead of stretching one line of prose.

      LIFECYCLE container (.dw-life, container-name: life)
        >= 488px       the four-step stepper lays out horizontally.
                       Below that it is a vertical list, never a horizontal
                       scroller. In one-column composition the lifecycle
                       container is the full main width, so this is viewport
                       520 - the same boundary as the previous revision.
                       In two-region composition the lifecycle sits in the
                       300-340px context column and stays vertical, which is
                       the condensed form the critique asked for.

      The default theme is the host's, read once per page load from
      prefers-color-scheme and applied in <head> before the first paint, the
      way a real build hands FluentProvider webLightTheme or webDarkTheme.
      ?theme= overrides it before first paint; the prototype Switch overrides
      it for the rest of the page lifetime. Nothing is stored.

    FOCUS ACROSS RERENDER
      Every update replaces innerHTML, so the focused node is destroyed. Focus
      intent is captured before the update and restored afterwards: Refresh
      returns to the rebuilt Refresh button, chooser selection closes the
      popover and lands on the selected feature's heading, and Escape returns
      focus to the trigger. Focus never falls to <body>, and it is never taken
      for a background change the user did not ask for.

      --colorPaletteRedBorder1: #6e3033;
      --colorPaletteRedBorder2: #d13438;

      --colorPaletteGreenForeground1: #54b054;
      --colorPaletteGreenBackground1: #123312;
      --colorPaletteGreenBorder1: #218121;
      --colorPaletteGreenBorder2: #107c10;

      --colorPaletteYellowForeground1: #c8cc00;
      --colorPaletteYellowBackground1: #333100;
      --colorPaletteYellowBorder1: #817400;

      --colorStrokeFocus2: #ffffff;

      --shadow4: 0 0 2px rgba(0, 0, 0, 0.24), 0 2px 4px rgba(0, 0, 0, 0.28);
      --shadow8: 0 0 2px rgba(0, 0, 0, 0.24), 0 4px 8px rgba(0, 0, 0, 0.28);
      --shadow16: 0 0 2px rgba(0, 0, 0, 0.24), 0 8px 16px rgba(0, 0, 0, 0.28);
    }

    /* ====================================================================
       Base. No min-height:100vh anywhere: the page is exactly as tall as its
       content, so the host never gets a second nested scrollbar.
       ==================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: var(--spacingVerticalNone);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightRegular);
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground3);
    }

    /* Fluent's 2px focus indicator, never removed or thinned. */
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    summary:focus-visible,
    [tabindex]:focus-visible,
    [data-proto-focus="visible"] {
      outline: var(--strokeWidthThick) solid var(--colorStrokeFocus2);
      outline-offset: var(--spacingHorizontalXXS);
      border-radius: var(--borderRadiusMedium);
    }

    .u-visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: var(--spacingVerticalNone);
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .u-icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    /* Fluent <Divider> — decorative rule, never an interactive boundary. */
    .fui-divider {
      height: var(--strokeWidthThin);
      margin: var(--spacingVerticalNone);
      border: 0;
      background-color: var(--colorNeutralStroke2);
    }

    /* ====================================================================
       Prototype drawer — OUTSIDE the product, collapsed by default.
       Collapsed height is one 28px control plus 2x6px padding = 40px, so the
       product begins ~40 CSS px from the top of the viewport.
       ==================================================================== */
    .proto {
      color: var(--colorNeutralForeground2);
      background-color: var(--colorNeutralBackground4);
      border-bottom: var(--strokeWidthThin) dashed var(--colorNeutralStrokeAccessible);
    }

    .proto-rail {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalS);
      padding: var(--spacingVerticalSNudge) var(--spacingHorizontalL);
    }

    .proto-toggle {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      min-height: var(--button-height-compact);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalS);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
      cursor: pointer;
    }

    .proto-toggle:hover { background-color: var(--colorNeutralBackground1Hover); }

    .proto-toggle .fui-chevron {
      width: var(--icon-size-12);
      height: var(--icon-size-12);
    }

    .proto-toggle[aria-expanded="true"] .fui-chevron { transform: rotate(90deg); }

    .proto-now {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
      overflow-wrap: anywhere;
    }

    .proto-panel {
      display: grid;
      gap: var(--spacingVerticalS);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalL) var(--spacingVerticalS);
    }

    .proto-panel[hidden] { display: none; }

    .proto-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-width: 0;
    }

    .proto-group-label {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground2);
    }

    .proto-hint {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
    }

    .proto-hint code {
      font-family: var(--fontFamilyMonospace);
      color: var(--colorNeutralForeground2);
    }

    /* Fluent Switch anatomy */
    .fui-switch {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-height: var(--button-height-compact);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalXS);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground1);
      background: none;
      border: none;
      border-radius: var(--borderRadiusMedium);
      cursor: pointer;
    }

    .fui-switch-track {
      position: relative;
      flex: 0 0 auto;
      width: 40px;
      height: var(--spacingVerticalXXL);
      border-radius: var(--borderRadiusCircular);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      transition: background-color var(--durationFaster) ease, border-color var(--durationFaster) ease;
    }

    .fui-switch[aria-checked="true"] .fui-switch-track {
      background-color: var(--colorBrandBackground);
      /*
        The outer boundary of a selected control must stay >= 3:1 against the
        surface behind it. In the dark theme the brand FILL is only 2.9:1
        against the prototype drawer, so the boundary uses the compound brand
        stroke, which Fluent ships for exactly this purpose.
      */
      border-color: var(--colorCompoundBrandStroke);
    }

    .fui-switch-thumb {
      position: absolute;
      top: var(--spacingVerticalXS);
      left: var(--spacingHorizontalXS);
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      border-radius: var(--borderRadiusCircular);
      background-color: var(--colorNeutralStrokeAccessible);
      transition: transform var(--durationFaster) ease, background-color var(--durationFaster) ease;
    }

    .fui-switch[aria-checked="true"] .fui-switch-thumb {
      background-color: var(--colorNeutralForegroundOnBrand);
      transform: translateX(var(--spacingHorizontalL));
    }

    /* Fluent RadioGroup rendered as compact selectable chips */
    .fui-radiogroup {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacingHorizontalXS);
    }

    .fui-radio {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      min-height: var(--button-height-compact);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalMNudge);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
      cursor: pointer;
      transition: background-color var(--durationFaster) ease;
    }

    .fui-radio:hover { background-color: var(--colorNeutralBackground1Hover); }

    .fui-radio[aria-checked="true"] {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorBrandBackground);
      border-color: var(--colorCompoundBrandStroke);
    }

    .fui-radio-mark {
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      opacity: 0;
    }

    .fui-radio[aria-checked="true"] .fui-radio-mark { opacity: 1; }

    /* ====================================================================
       Product shell — fluid, no max-width.
       #app carries the only page gutter, so main == viewport - 32 at every
       width and no boundary can ever take width away from it.
       ==================================================================== */
    .fui-provider {
      display: block;
      padding: var(--spacingVerticalM) var(--layout-page-pad) var(--spacingVerticalXXXL);
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground3);
    }

    /* ---------- Product header: present at EVERY width ---------- */
    .dw-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacingHorizontalS);
      padding-bottom: var(--spacingVerticalM);
    }

    /* Type ramp: Subtitle2 */
    .dw-product {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase400);
      line-height: var(--lineHeightBase400);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .dw-product-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-size-24);
      height: var(--icon-size-24);
      border-radius: var(--borderRadiusMedium);
      color: var(--colorBrandForeground1);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    .dw-product-sub {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightRegular);
      color: var(--colorNeutralForeground3);
    }

    /* ---------- Fluent Button ---------- */
    .fui-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacingHorizontalS);
      min-height: var(--button-height-medium);
      min-width: var(--button-height-medium);
      padding: var(--spacingVerticalXS) var(--spacingHorizontalM);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      border-radius: var(--borderRadiusMedium);
      text-decoration: none;
      cursor: pointer;
      transition: background-color var(--durationFaster) ease, border-color var(--durationFaster) ease;
    }

    .fui-button-secondary {
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground1);
      /* Interactive boundary: accessible stroke, not stock Stroke1. */
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
    }

    .fui-button-secondary:hover { background-color: var(--colorNeutralBackground1Hover); }

    /*
      TWO DISTINCT UNAVAILABLE TREATMENTS, chosen by why the control is
      unavailable. Neither relies on a border colour as its only cue.

      aria-disabled="true"  Temporarily busy (Refresh, while one read runs).
                            It MUST stay focusable, or keyboard focus is
                            destroyed in the middle of the user's own action.
                            It is therefore still an interactive component, so
                            its required boundary keeps
                            --colorNeutralStrokeAccessible (>= 3:1 in both
                            themes) and the state is carried by the visible
                            label plus aria-busy.

      :disabled             Genuinely inert (nothing to choose). Removed from
                            the tab order, so no focus indicator can ever land
                            on it, and its label states the reason in words.
                            Only here is the stock Fluent disabled stroke used:
                            WCAG 1.4.11 exempts inactive components, and the
                            control is not reachable by any input method.
    */
    .fui-button[aria-disabled="true"] {
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground3);
      border-color: var(--colorNeutralStrokeAccessible);
      cursor: progress;
    }

    .fui-button:disabled {
      color: var(--colorNeutralForegroundDisabled);
      background-color: var(--colorNeutralBackgroundDisabled);
      border-color: var(--colorNeutralStrokeDisabled);
      cursor: not-allowed;
    }

    .fui-button:disabled:hover { background-color: var(--colorNeutralBackgroundDisabled); }

    .fui-button-icon {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
    }

    /* ---------- Fluent Popover ---------- */
    .dw-popover-anchor { position: relative; }

    .fui-popover-surface {
      position: absolute;
      z-index: 10;
      top: calc(100% + var(--spacingVerticalXS));
      right: 0;
      width: min(420px, calc(100vw - var(--spacingHorizontalXXXL)));
      display: grid;
      gap: var(--spacingVerticalS);
      padding: var(--spacingVerticalM);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      border-radius: var(--borderRadiusMedium);
      /* Elevation kept: Fluent Popover semantics justify it. */
      box-shadow: var(--shadow16);
    }

    .fui-popover-surface[hidden] { display: none; }

    /* ====================================================================
       WORKSPACE — the only structural composition in the product.
       .dw-main is the query container; it is always the full page width.
       ==================================================================== */
    .dw-main {
      container-type: inline-size;
      container-name: workspace;
      display: block;
      min-width: 0;
    }

    .dw-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingVerticalL);
      min-width: 0;
    }

    .dw-idbar { grid-column: 1 / -1; }

    .dw-work,
    .dw-context {
      display: grid;
      gap: var(--spacingVerticalL);
      align-content: start;
      min-width: 0;
    }

    /*
      Two-region composition.
      600 (work floor) + 24 (gap) + 300 (context floor) = 924 honest fit.
      928 is taken for slack, which is viewport 960.
      At and above it the attention, freshness, and evidence content LEAVES the
      work column, which is why the work column can settle at its 600px floor
      without losing anything it still has to show.
    */
    @container workspace (min-width: 928px) {
      .dw-workspace {
        grid-template-columns:
          minmax(var(--layout-work-min), 1fr)
          minmax(var(--layout-context-min), var(--layout-context-max));
        column-gap: var(--spacingHorizontalXXL);
      }

      .dw-context {
        padding-left: var(--spacingHorizontalXXL);
        border-left: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      }
    }

    /* ---------- Compact identity strip ---------- */
    .dw-idbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalXS) var(--spacingHorizontalM);
      padding-bottom: var(--spacingVerticalM);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    /* Type ramp: Body1Strong — deliberately smaller than the next-step headline */
    .dw-feature-title {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .dw-idbar-note {
      flex: 1 1 100%;
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
    }

    /* Plain-language trust chip. No lane, package, or task vocabulary. */
    .dw-trust {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .dw-trust svg {
      flex: 0 0 auto;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      color: var(--colorPaletteGreenForeground1);
    }

    .dw-trust.is-caution svg { color: var(--colorPaletteYellowForeground1); }
    .dw-trust.is-error svg { color: var(--colorPaletteRedForeground1); }

    /* ---------- Fluent Badge ---------- */
    .fui-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      min-height: var(--badge-size-large);
      padding: var(--spacingVerticalXXS) var(--spacingHorizontalS);
      border-radius: var(--borderRadiusCircular);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
    }

    .fui-badge-glyph {
      flex: 0 0 auto;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
    }

    .fui-badge-brand {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorBrandBackground);
      /*
        The badge sits directly on the page surface now that identity is a flat
        strip. In the dark theme the brand FILL is only 2.8:1 against that
        surface, so the boundary uses the compound brand stroke, which Fluent
        ships for exactly this purpose.
      */
      border: var(--strokeWidthThin) solid var(--colorCompoundBrandStroke);
    }

    .fui-badge-outline {
      color: var(--colorNeutralForeground2);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
    }

    .fui-badge-danger {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorPaletteRedBorder2);
      border: var(--strokeWidthThin) solid var(--colorPaletteRedBorder2);
    }

    .fui-badge-subtle {
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground2);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    /* ====================================================================
       NEXT STEP — the focal surface. It leads, and it is the one place in the
       product where elevation is kept.
       ==================================================================== */
    .dw-focal {
      container-type: inline-size;
      container-name: focal;
      display: grid;
      gap: var(--spacingVerticalM);
      padding: var(--spacingVerticalXL) var(--spacingHorizontalXL);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      /* Brand accent edge: the one focal signal on the page. */
      border-left: var(--strokeWidthThickest) solid var(--colorCompoundBrandStroke);
      border-radius: var(--borderRadiusMedium);
      box-shadow: var(--shadow4);
      min-width: 0;
    }

    .dw-focal.is-unavailable {
      border-left-color: var(--colorNeutralStrokeAccessible);
      box-shadow: none;
    }

    /* Type ramp: Caption1Strong */
    .dw-eyebrow {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorBrandForeground1);
    }

    .dw-focal.is-unavailable .dw-eyebrow { color: var(--colorNeutralForeground3); }

    .dw-eyebrow svg {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
    }

    .dw-focal-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--spacingVerticalM);
      align-items: start;
      min-width: 0;
    }

    .dw-focal-lead,
    .dw-focal-support {
      display: grid;
      gap: var(--spacingVerticalS);
      align-content: start;
      min-width: 0;
    }

    /*
      The focal surface recomposes only once, and only where the step is worth
      it. A container query measures the CONTENT box, so this threshold is the
      room actually available inside the card's 20px padding and 4px accent.

      Honest minimum fit: 490 (68ch prose measure, rounded up) + 24 (gap) + 260
      (supporting column) = 774. The threshold is deliberately set higher, at
      968, so the headline column lands at 607px rather than at its 490px
      floor. In one-column composition the focal content box never reaches 968,
      so this never fires there; it first applies at viewport 1409, where the
      supporting phase and why text move out of the headline column.
    */
    @container focal (min-width: 968px) {
      .dw-focal-grid {
        grid-template-columns:
          minmax(var(--layout-headline-min), 1.8fr)
          minmax(var(--layout-support-min), 1fr);
        column-gap: var(--spacingHorizontalXXL);
      }
      .dw-focal-support {
        padding-left: var(--spacingHorizontalXXL);
        border-left: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      }
    }

    /* Type ramp: Title2 — the largest type in the product, by design. */
    .dw-headline {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase600);
      line-height: var(--lineHeightBase600);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .dw-focal.is-unavailable .dw-headline {
      font-size: var(--fontSizeBase500);
      line-height: var(--lineHeightBase500);
      color: var(--colorNeutralForeground2);
    }

    /* Type ramp: Body1 — bounded measure inside a fluid region */
    .dw-focal-detail {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground1);
    }

    /* Type ramp: Caption1Strong — subordinate supporting labels */
    .dw-support-label {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorNeutralForeground3);
    }

    .dw-support-value {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground2);
    }

    .dw-support-text {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    /* ---------- Empty-state command ---------- */
    .dw-command {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalS);
    }

    .dw-command code {
      flex: 1 1 auto;
      min-width: 0;
      padding: var(--spacingVerticalS) var(--spacingHorizontalM);
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground2);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      border-radius: var(--borderRadiusMedium);
      overflow-wrap: anywhere;
    }

    /* ====================================================================
       Flat sections — identity, lifecycle, attention, freshness, evidence.
       No cards, no stacked shadows: a heading, a rule, and content.
       ==================================================================== */
    .dw-section {
      display: grid;
      gap: var(--spacingVerticalS);
      align-content: start;
      padding-top: var(--spacingVerticalM);
      border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      min-width: 0;
    }

    .dw-section-heading {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorNeutralForeground3);
    }

    /* Type ramp: Caption1 */
    .dw-caption {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
    }

    /*
      The context flow fills whatever width it is given with no threshold at
      all: one column inside the 300-340px context column, two or three
      columns when it sits under a full-width work region.
    */
    .dw-context-flow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--spacingVerticalL) var(--spacingHorizontalXXL);
      align-items: start;
      min-width: 0;
    }

    /* ====================================================================
       Lifecycle stepper + progress — condensed, supporting, never leading.
       ==================================================================== */
    .dw-life {
      container-type: inline-size;
      container-name: life;
    }

    .fui-stepper {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--spacingVerticalNone);
      margin: var(--spacingVerticalXS) var(--spacingHorizontalNone) var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    /* Narrow container: vertical stepper, never a horizontal scroller. */
    .fui-step {
      position: relative;
      display: grid;
      grid-template-columns: var(--badge-size-large) minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingVerticalNone) var(--spacingHorizontalM);
      padding-bottom: var(--spacingVerticalS);
      text-align: left;
    }

    .fui-step:last-child { padding-bottom: var(--spacingVerticalNone); }

    .fui-step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: var(--badge-size-large);
      bottom: var(--spacingVerticalXXS);
      left: calc(var(--badge-size-large) / 2 - var(--strokeWidthThin));
      width: var(--strokeWidthThick);
      border-radius: var(--borderRadiusCircular);
      background-color: var(--colorNeutralStroke1);
    }

    .fui-step.is-complete:not(:last-child)::after {
      background-color: var(--colorPaletteGreenBorder2);
    }

    .fui-step-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--badge-size-large);
      height: var(--badge-size-large);
      border-radius: var(--borderRadiusCircular);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
    }

    .fui-step-glyph {
      width: var(--icon-size-16);
      height: var(--icon-size-16);
    }

    .fui-step.is-complete .fui-step-badge {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorPaletteGreenBorder2);
      border-color: var(--colorPaletteGreenBorder2);
    }

    .fui-step.is-current .fui-step-badge {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorBrandBackground);
      border-color: var(--colorBrandBackground);
      box-shadow: 0 0 0 var(--strokeWidthThick) var(--colorNeutralBackground3), 0 0 0 var(--strokeWidthThicker) var(--colorCompoundBrandStroke);
    }

    .fui-step.is-unknown .fui-step-badge {
      border-style: dashed;
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground2);
    }

    /* Type ramp: Caption1 */
    .fui-step-label {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .fui-step.is-complete .fui-step-label {
      font-weight: var(--fontWeightSemibold);
      color: var(--colorPaletteGreenForeground1);
    }

    .fui-step.is-current .fui-step-label {
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .fui-step-state {
      display: block;
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightRegular);
      color: var(--colorNeutralForeground3);
    }

    /*
      4 steps x 112px of label ("Not started" is the widest) = 448 honest fit;
      488 is taken for slack. In one-column composition the lifecycle container
      is the full main width, so this is viewport 520.
    */
    @container life (min-width: 488px) {
      .fui-stepper { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .fui-step {
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
        gap: var(--spacingVerticalXS);
        padding-bottom: var(--spacingVerticalNone);
        text-align: center;
      }
      .fui-step:not(:last-child)::after {
        top: calc(var(--badge-size-large) / 2 - var(--strokeWidthThin));
        bottom: auto;
        left: calc(50% + (var(--badge-size-large) / 2) + var(--spacingHorizontalXS));
        right: calc(-50% + (var(--badge-size-large) / 2) + var(--spacingHorizontalXS));
        width: auto;
        height: var(--strokeWidthThick);
      }
    }

    /* ---------- Progress, tied to the stage, never a percentage ---------- */
    .dw-progress {
      display: grid;
      gap: var(--spacingVerticalS);
      margin-top: var(--spacingVerticalM);
    }

    /*
      Composed meter. Fluent's ProgressBar is single-value, so three
      proportional bars share one 4px track (--strokeWidthThickest is
      ProgressBar "large"). Segment growth is set from data.
    */
    .dw-meter {
      display: flex;
      gap: var(--spacingHorizontalXXS);
      height: var(--strokeWidthThickest);
      border-radius: var(--borderRadiusCircular);
      overflow: hidden;
    }

    .dw-meter-seg {
      flex-grow: var(--seg, 1);
      flex-basis: 0;
      min-width: var(--spacingHorizontalXXS);
      border-radius: var(--borderRadiusCircular);
    }

    .dw-meter-seg.is-done { background-color: var(--colorPaletteGreenBorder2); }
    .dw-meter-seg.is-doing { background-color: var(--colorBrandBackground); }
    .dw-meter-seg.is-open { background-color: var(--colorNeutralStroke1); }

    .dw-legend {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacingHorizontalXS) var(--spacingHorizontalL);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .dw-legend li {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .dw-legend svg {
      flex: 0 0 auto;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
    }

    .dw-legend .is-done svg { color: var(--colorPaletteGreenForeground1); }
    .dw-legend .is-doing svg { color: var(--colorBrandForeground1); }
    .dw-legend .is-open svg { color: var(--colorNeutralForeground3); }

    .dw-legend-count { font-weight: var(--fontWeightSemibold); color: var(--colorNeutralForeground1); }

    /* ====================================================================
       Attention — a calm compact summary when nothing needs the user, and
       real Fluent MessageBars only when something actually does.
       ==================================================================== */
    .dw-status-summary {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .dw-status-summary svg {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      color: var(--colorPaletteGreenForeground1);
    }

    .dw-status-facts {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacingHorizontalXS) var(--spacingHorizontalL);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .dw-status-facts li {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .dw-status-facts svg {
      flex: 0 0 auto;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      color: var(--colorNeutralForeground3);
    }

    /* ---------- Fluent MessageBar ---------- */
    .fui-attention {
      display: grid;
      gap: var(--spacingVerticalS);
    }

    .fui-messagebar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingHorizontalS);
      padding: var(--spacingVerticalS) var(--spacingHorizontalM);
      border-radius: var(--borderRadiusMedium);
      border: var(--strokeWidthThin) solid transparent;
    }

    .fui-messagebar-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .fui-icon {
      width: var(--icon-size-20);
      height: var(--icon-size-20);
    }

    /* Type ramp: Body1Strong */
    .fui-messagebar-title {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    /* Type ramp: Caption1 */
    .fui-messagebar-text {
      margin: var(--spacingVerticalXXS) var(--spacingHorizontalNone) var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .fui-messagebar-meta {
      margin: var(--spacingVerticalXS) var(--spacingHorizontalNone) var(--spacingVerticalNone);
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
      overflow-wrap: anywhere;
    }

    .fui-messagebar-warning {
      background-color: var(--colorPaletteYellowBackground1);
      border-color: var(--colorPaletteYellowBorder1);
    }
    .fui-messagebar-warning .fui-messagebar-icon { color: var(--colorPaletteYellowForeground1); }

    .fui-messagebar-error {
      background-color: var(--colorPaletteRedBackground1);
      border-color: var(--colorPaletteRedBorder1);
    }
    .fui-messagebar-error .fui-messagebar-icon { color: var(--colorPaletteRedForeground1); }
    .fui-messagebar-error .fui-messagebar-title { color: var(--colorPaletteRedForeground1); }

    .fui-messagebar-info {
      background-color: var(--colorNeutralBackground2);
      border-color: var(--colorNeutralStroke2);
    }
    .fui-messagebar-info .fui-messagebar-icon { color: var(--colorNeutralForeground3); }

    /* ---------- Freshness ---------- */
    .dw-freshness-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--spacingHorizontalS);
    }

    .dw-freshness-state {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      min-width: 0;
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .dw-freshness-state svg {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      color: var(--colorNeutralForeground3);
    }

    .dw-freshness-state.is-failed svg { color: var(--colorPaletteYellowForeground1); }

    /* ---------- Fluent Accordion-style disclosure (Evidence) ---------- */
    .fui-accordion { display: block; }

    .fui-accordion-header {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-height: var(--button-height-medium);
      padding: var(--spacingVerticalXS) var(--spacingHorizontalNone);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      border-radius: var(--borderRadiusMedium);
      cursor: pointer;
      list-style: none;
    }

    .fui-accordion-header::-webkit-details-marker { display: none; }

    .fui-chevron {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      color: var(--colorNeutralForeground3);
      transition: transform var(--durationFaster) ease;
    }

    .fui-accordion[open] > .fui-accordion-header .fui-chevron { transform: rotate(90deg); }

    .dw-evidence-body {
      display: grid;
      gap: var(--spacingVerticalM);
      padding: var(--spacingVerticalXS) var(--spacingHorizontalNone) var(--spacingVerticalS);
    }

    .dw-source-list {
      display: grid;
      gap: var(--spacingVerticalS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
    }

    .dw-source-list dt {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground3);
    }

    .dw-source-list dd {
      margin: var(--spacingVerticalNone);
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .dw-event {
      display: grid;
      gap: var(--spacingVerticalXS);
      padding-left: var(--spacingHorizontalM);
      border-left: var(--strokeWidthThick) solid var(--colorNeutralStroke1);
    }

    .dw-event-text {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground1);
    }

    .dw-event-source {
      margin: var(--spacingVerticalNone);
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
      overflow-wrap: anywhere;
    }

    /* ====================================================================
       CHOOSER — one Fluent Combobox/Listbox composite. ONE tab stop.
       Used both inside the header Popover and as the no-selection fixture.
       ==================================================================== */
    .dw-chooser {
      display: grid;
      gap: var(--spacingVerticalS);
      min-width: 0;
    }

    .dw-chooser-label {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground3);
    }

    /* Fluent SearchBox anatomy */
    .fui-searchbox {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-height: var(--button-height-medium);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalM);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      /* Fluent Input's compound brand underline */
      border-bottom: var(--strokeWidthThick) solid var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
    }

    .fui-searchbox:focus-within { border-bottom-color: var(--colorCompoundBrandStroke); }

    .fui-searchbox svg {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      color: var(--colorNeutralForeground3);
    }

    .fui-searchbox-input {
      flex: 1 1 auto;
      min-width: 0;
      padding: var(--spacingVerticalXS) var(--spacingHorizontalNone);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground1);
      background: none;
      border: none;
    }

    .fui-searchbox-input:focus { outline: none; }
    .fui-searchbox-input::placeholder { color: var(--colorNeutralForeground3); }

    /*
      Windowed scroller. The listbox holds at most WINDOW option elements at a
      time; the untenanted space above and below is expressed as padding on the
      listbox, so the scrollbar still describes all 53 rows. Row height is a
      layout constant so the window arithmetic is exact.
    */
    .dw-chooser-scroll {
      max-height: calc(var(--chooser-row) * 5);
      overflow-y: auto;
      overscroll-behavior: contain;
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
    }

    .dw-chooser-list {
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .dw-option {
      display: grid;
      align-content: center;
      gap: var(--spacingVerticalNone);
      height: var(--chooser-row);
      padding: var(--spacingVerticalM) var(--spacingHorizontalM);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      cursor: pointer;
      min-width: 0;
    }

    .dw-option:last-child { border-bottom: none; }
    .dw-option:hover { background-color: var(--colorNeutralBackground1Hover); }

    /*
      The active option is never colour-only: it carries a brand left edge, a
      background change, and the literal word "Highlighted" for assistive
      technology through aria-activedescendant plus aria-selected.
    */
    .dw-option.is-active {
      background-color: var(--colorNeutralBackground2);
      border-left: var(--strokeWidthThicker) solid var(--colorCompoundBrandStroke);
      padding-left: var(--spacingHorizontalMNudge);
    }

    .dw-option-title {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      min-width: 0;
    }

    .dw-option-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dw-option-title .fui-badge {
      flex: 0 0 auto;
      min-height: var(--spacingVerticalXL);
      padding: 0 var(--spacingHorizontalSNudge);
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
    }

    .dw-option-meta {
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dw-chooser-empty {
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalM) var(--spacingHorizontalM);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground2);
    }

    .dw-preview {
      display: grid;
      gap: var(--spacingVerticalXS);
      padding: var(--spacingVerticalM) var(--spacingHorizontalM);
      background-color: var(--colorNeutralBackground2);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      border-radius: var(--borderRadiusMedium);
    }

    .dw-preview-key {
      margin: var(--spacingVerticalNone);
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
      overflow-wrap: anywhere;
    }

    .dw-preview-title {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .dw-steps {
      display: grid;
      gap: var(--spacingVerticalXS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalNone) var(--spacingVerticalNone) var(--spacingHorizontalXL);
    }

    .dw-steps li {
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 1ms !important;
        animation-duration: 1ms !important;
      }
    }
  </style>
</head>

      p.identity.trust = { text: 'Project state verified', kind: 'ok' };
      p.focal = {
        eyebrow: 'Next step',
        headline: 'Inspect the contract mismatch before continuing',
        detail: 'This step is blocked. No later step is offered while a blocker stands against it.',
        unavailable: false,
        phase: 'Responsive Fluent Design And Approval',
        why: 'The feature definition does not match the active work tracker.',
        command: null
      };
      p.lifecycle.note = 'The current stage is blocked. The recorded blocker must clear before it can advance.';
      p.attention = {
        summary: null,
        bars: [{
          intent: 'error',
          icon: 'i-error',
          title: 'Blocked',
          text: 'The feature definition does not match the active work tracker.',
          meta: ['Category: Contract mismatch', 'Exact classification and source are in Evidence \u2192 Source details.']
        }],
        facts: ['0 unanswered questions']
      };
      /* FR-011: the exact classification code and source stay available, one
         disclosure away, instead of sitting in primary orientation. */
      p.evidence = {
        rows: LIGHTWEIGHT_SOURCES.concat([
          ['Blocker classification', 'contract-mismatch'],
          ['Technical reason', 'The projection contract differs from the current tracked authority.'],
          ['Blocker source', '.dude/specs/052-dude-canvas-ui/tasks.md']
        ]),
        event: LATEST_EVENT,
        eventNote: null
      };
      return p;
    };

    STATES.stale = function () {
      var p = STATES.current();
      p.identity.trust = { text: 'Showing the last verified read', kind: 'caution' };
      p.freshness = { state: 'failed', label: 'Refresh failed', detail: 'The task list changed while it was being read.' };
      p.attention = {

        }],

      p.evidence = {

          ['Refresh diagnostic', '.dude/specs/052-dude-canvas-ui/tasks.md — changed mid-read (read-conflict)']
        ]),

        eventNote: null

    };

    STATES.empty = function () {

        identity: null,

    STATES.malformed = function () {
