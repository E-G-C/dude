    /*
      TRACKING MISMATCH — the bare SC-003 acceptance case, and explicitly NOT a
      blocker. The tracked board is globally authoritative and holds no issue
      for this specification identity, so the feature stays selected and its
      definition facts stay visible while every execution fact is withheld.
    */
    STATES.mismatch = function () {
      var p = STATES.current();
      p.identity.stage = { text: 'Defined', kind: 'outline', icon: 'i-check' };
      p.identity.trust = { text: 'Project state verified', kind: 'ok' };
      p.focal = {
        eyebrow: 'Next step',
        headline: 'Next step unavailable',
        detail: 'This feature stays selected and its definition facts stay visible.',
        unavailable: true,
        phase: null,
        why: 'This feature is not available in the active work tracker. Choose another feature, or inspect tracking for this one.',
        command: null
      };
      p.lifecycle = { steps: steps('complete', 'complete', 'unknown', 'unknown'), note: 'The current stage is unavailable while this feature is not available in the active work tracker.' };
      p.progress = null;
      p.progressNote = 'Progress is unavailable. No other feature\u2019s work is attributed here.';
      p.attention = {
        summary: null,
        bars: [
          { intent: 'warning', icon: 'i-warning', title: 'Not available in the active work tracker', text: 'This feature is not available in the active work tracker.', meta: 'Choose another feature, or inspect tracking for this one.' },
          { intent: 'info', icon: 'i-info', title: 'Not a feature blocker', text: 'This is attention only. No blocker is recorded for this feature.' }
        ],
        facts: ['0 unanswered questions']
      };
      p.evidence = { rows: TRACKED_SOURCES, event: LATEST_EVENT, eventNote: null };
      return p;
    };

    /*
      CHOOSER — no feature is selected, nothing is preselected, and no recency,
      chronology, or lifecycle-number inference is made. The list is the real
      53-item inventory.
    */
    STATES.chooser = function () {
      return {
        mode: 'chooser',
        identity: null,
        focal: null,
        lifecycle: null,
        progress: null,
        progressNote: null,
        attention: null,
        instruction: {
          title: 'How this list works',
          steps: [
            'Type to narrow all 53 features by title, identifier, or stage.',
            'Arrow keys highlight a result; Home, End, Page Up, and Page Down move further.',
            'Press Enter to open the highlighted feature. Nothing opens until you do.',
            'Press Escape to clear the search.'
          ]
        },
        freshness: { state: 'current', label: 'Read just now', detail: 'The feature list was read completely.' },
        evidence: {
          rows: [
            ['Features', '53 idea files read'],
            ['Fields read', 'title, slug, status, spec_path'],
            ['Paths', 'Exact idea and specification paths are shown under the selected feature\u2019s Source details.'],
            ['Selection', 'No exact target was supplied and more than one feature is active, so a chooser is shown instead of a guess.']
          ],
          event: null,
          eventNote: 'No feature is selected, so no lifecycle event is attributed.'
        }
      };
    };

    /*
      ANOTHER FEATURE SELECTED — frontmatter only.
      Its task state was never loaded, so nothing beyond title, slug, status,
      and exact paths is shown or implied. The product says the next step is
      unavailable in plain language; the fact that task detail was not loaded
      is a secondary disclosure inside Source details.
    */
    function frontmatterProjection(f) {
      var stage = stageWord(f);
      var st = f.status === 'draft'
        ? steps('current', 'todo', 'todo', 'todo')
        : f.status === 'resolved'
          ? steps('complete', 'unknown', 'unknown', 'complete')
          : steps('complete', 'complete', 'unknown', 'unknown');
      var rows = [
        ['Idea', f.idea],
        ['Recorded status', f.status],
        ['Specification', f.spec ? f.spec : 'No specification path is recorded in this feature\u2019s frontmatter'],
        ['Tasks', 'Not loaded for this feature in this preview']
      ];
      return {
        mode: 'feature',
        identity: {
          title: f.title,
          note: null,
          stage: { text: stage, kind: 'outline', icon: f.status === 'draft' ? 'i-circle' : 'i-check' },
          trust: { text: 'Project state verified', kind: 'ok' }
        },
        focal: {
          eyebrow: 'Next step',
          headline: 'Next step unavailable',
          detail: null,
          unavailable: true,
          phase: null,
          why: 'Step detail for this feature was not read, so nothing is shown in its place.',
          command: null
        },
        lifecycle: { steps: st, note: 'Only the recorded status is known for this feature.' },
        progress: null,
        progressNote: 'Progress was not read for this feature.',
        attention: {
          summary: null,
          bars: [],
          facts: ['Questions and blockers were not read for this feature']
        },
        freshness: { state: 'current', label: 'Read just now', detail: 'Recorded title, slug, status, and paths were read.' },
        evidence: { rows: rows, event: null, eventNote: 'No lifecycle event was read for this feature.' }
      };
    }

    /* ---------------------------------------------------------------- */
    /* Rendering helpers                                                 */
    /* ---------------------------------------------------------------- */
    function esc(value) {
      return String(value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function icon(id, cls) {
      return '<svg class="' + cls + '" aria-hidden="true" focusable="false"><use href="#' + id + '"><\/use><\/svg>';
    }

    var STEP_WORD = { complete: 'Complete', current: 'Current', todo: 'Not started', unknown: 'Unavailable' };

    function stepper(list) {
      var items = list.map(function (s, i) {
        var glyph = s.state === 'complete' ? icon('i-check', 'fui-step-glyph')
          : s.state === 'unknown' ? icon('i-dash', 'fui-step-glyph')
          : String(i + 1);
        return '<li class="fui-step is-' + s.state + '"' + (s.state === 'current' ? ' aria-current="step"' : '') + '>' +
          '<span class="fui-step-badge" aria-hidden="true">' + glyph + '<\/span>' +
          '<span class="fui-step-label">' + esc(s.label) +
            '<span class="fui-step-state">' + STEP_WORD[s.state] + '<\/span>' +
          '<\/span><\/li>';
      }).join('');
      return '<ol class="fui-stepper">' + items + '<\/ol>';
    }

    function meter(p) {
      var legend =
        '<li class="is-done">' + icon('i-check', '') + '<span class="dw-legend-count">' + p.done + '<\/span> done<\/li>' +
        '<li class="is-doing">' + icon('i-half', '') + '<span class="dw-legend-count">' + p.doing + '<\/span> in progress<\/li>' +
        '<li class="is-open">' + icon('i-circle', '') + '<span class="dw-legend-count">' + p.open + '<\/span> open<\/li>';
      return '<div class="dw-progress">' +
        '<div class="dw-meter" aria-hidden="true">' +
          '<span class="dw-meter-seg is-done" style="--seg:' + p.done + '"><\/span>' +
          '<span class="dw-meter-seg is-doing" style="--seg:' + p.doing + '"><\/span>' +
          '<span class="dw-meter-seg is-open" style="--seg:' + p.open + '"><\/span>' +
        '<\/div>' +
        '<ul class="dw-legend">' + legend + '<\/ul>' +
        '<p class="dw-caption">' + esc(p.lede) + '<\/p>' +
      '<\/div>';
    }

    /* ---------------------------------------------------------------- */
    /* Chooser — ONE Fluent Combobox/Listbox composite, ONE tab stop     */
    /* ---------------------------------------------------------------- */
    /*
      53 features must never become 53 tab stops. The search input is the only
      tabbable node; the listbox is navigated with aria-activedescendant, which
      is the Fluent v9 Combobox/Listbox behaviour.

      Long-list behaviour is demonstrated with a real window: at most WINDOW
      option elements exist at any moment, and the space above and below is
      expressed as padding on the listbox so the scrollbar still describes the
      whole result set. ROW matches --chooser-row exactly, so the arithmetic is
      not an approximation.
    */
    function createChooser(host, opts) {
      var id = opts.id;
      var WINDOW = 12;
      var ROW = 60;

      var query = '';
      var active = -1;
      var lastKey = '';
      var filtered = IDEAS.slice();
      var suppressScroll = 0;

      host.innerHTML =
        '<div class="dw-chooser">' +
          '<label class="dw-chooser-label" for="' + id + '-input">Search features<\/label>' +
          '<div class="fui-searchbox">' + icon('i-search', '') +
            '<input class="fui-searchbox-input" id="' + id + '-input" type="text" role="combobox"' +
              ' aria-expanded="true" aria-controls="' + id + '-listbox" aria-autocomplete="list"' +
              ' aria-describedby="' + id + '-count ' + id + '-hint" autocomplete="off" spellcheck="false"' +
              ' placeholder="Search ' + IDEAS.length + ' features">' +
          '<\/div>' +
          '<p class="dw-caption" id="' + id + '-count" role="status" aria-live="polite"><\/p>' +
          '<div class="dw-chooser-scroll" id="' + id + '-scroll" tabindex="-1">' +
            '<ul class="dw-chooser-list" id="' + id + '-listbox" role="listbox" aria-label="Features"><\/ul>' +
            '<p class="dw-chooser-empty" id="' + id + '-empty" hidden><\/p>' +
          '<\/div>' +
          '<p class="dw-caption" id="' + id + '-hint">Arrow keys highlight a result. Enter opens the highlighted feature. Escape clears the search.<\/p>' +
        '<\/div>';

      var input = document.getElementById(id + '-input');
      var listbox = document.getElementById(id + '-listbox');
      var scroll = document.getElementById(id + '-scroll');
      var count = document.getElementById(id + '-count');
      var empty = document.getElementById(id + '-empty');

      function matches(f) {
        if (!query) { return true; }
        var hay = (featureKey(f) + ' ' + f.title + ' ' + f.slug + ' ' + f.status + ' ' + stageWord(f)).toLowerCase();
        return hay.indexOf(query.toLowerCase()) !== -1;
      }

      function optionHtml(f, index) {
        var isActive = index === active;
        var current = opts.currentNumber && opts.currentNumber() === f.n;
        return '<li class="dw-option' + (isActive ? ' is-active' : '') + '"' +
            ' id="' + id + '-opt-' + index + '" role="option"' +
            ' aria-selected="' + (isActive ? 'true' : 'false') + '" data-index="' + index + '">' +
          '<span class="dw-option-title">' +
            '<span class="dw-option-name">' + esc(f.title) + '<\/span>' +
            '<span class="fui-badge fui-badge-subtle">' + esc(stageWord(f)) + '<\/span>' +
            (current ? '<span class="fui-badge fui-badge-outline">Current<\/span>' : '') +
          '<\/span>' +
          '<span class="dw-option-meta">' + esc(featureKey(f)) + '<\/span>' +
        '<\/li>';
      }

      function paint() {
        var total = filtered.length;
        var maxStart = Math.max(0, total - WINDOW);
        var start = Math.floor(scroll.scrollTop / ROW) - 2;
        if (start < 0) { start = 0; }
        if (start > maxStart) { start = maxStart; }
        var end = Math.min(total, start + WINDOW);

        /* Scrolling the highlight out of the window drops the highlight
           rather than leaving aria-activedescendant pointing at nothing. */
        if (active >= 0 && (active < start || active >= end)) { active = -1; }

        var html = '';
        for (var i = start; i < end; i += 1) { html += optionHtml(filtered[i], i); }
        listbox.style.paddingTop = (start * ROW) + 'px';
        listbox.style.paddingBottom = ((total - end) * ROW) + 'px';
        listbox.innerHTML = html;

        empty.hidden = total !== 0;
        if (total === 0) { empty.textContent = 'No features match ' + JSON.stringify(query) + '.'; }

        input.setAttribute('aria-activedescendant', active >= 0 ? id + '-opt-' + active : '');
      }

      function updateCount() {
        count.textContent = !query
          ? IDEAS.length + ' features. Nothing is selected.'
          : filtered.length + ' of ' + IDEAS.length + ' features match ' + JSON.stringify(query) + '.';
      }

      function refilter() {
        filtered = IDEAS.filter(matches);
        active = -1;
        suppressScroll += 1;
        scroll.scrollTop = 0;
        paint();
        updateCount();
        if (opts.onActive) { opts.onActive(null); }
      }

      function ensureVisible() {
        var top = active * ROW;
        var bottom = top + ROW;
        var view = scroll.clientHeight;
        if (top < scroll.scrollTop) {
          suppressScroll += 1;
          scroll.scrollTop = top;
        } else if (bottom > scroll.scrollTop + view) {
          suppressScroll += 1;
          scroll.scrollTop = bottom - view;
        }
      }

      function setActive(index) {
        if (!filtered.length) { return; }
        if (index < 0) { index = 0; }
        if (index > filtered.length - 1) { index = filtered.length - 1; }
        active = index;
        ensureVisible();
        paint();
        if (opts.onActive) { opts.onActive(filtered[active]); }
      }

      function move(delta) {
        if (!filtered.length) { return; }
        if (active < 0) { setActive(delta > 0 ? 0 : filtered.length - 1); return; }
        setActive(active + delta);
      }

      function choose() {
        if (active < 0) {
          announce('Use the arrow keys to highlight a feature, then press Enter to open it.');
          return;
        }
        opts.onSelect(filtered[active], lastKey !== '');
      }

      input.addEventListener('input', function () {
        query = input.value.trim();
        refilter();
      });

      input.addEventListener('keydown', function (event) {
        lastKey = event.key;
        if (event.key === 'ArrowDown') { event.preventDefault(); move(1); return; }
        if (event.key === 'ArrowUp') { event.preventDefault(); move(-1); return; }
        if (event.key === 'PageDown') { event.preventDefault(); move(5); return; }
        if (event.key === 'PageUp') { event.preventDefault(); move(-5); return; }
        if (event.key === 'Home') { event.preventDefault(); setActive(0); return; }
        if (event.key === 'End') { event.preventDefault(); setActive(filtered.length - 1); return; }
        if (event.key === 'Enter') { event.preventDefault(); choose(); return; }
        if (event.key === 'Escape') {
          if (query) {
            event.preventDefault();
            event.stopPropagation();
            input.value = '';
            query = '';
            refilter();
            announce('Search cleared. ' + IDEAS.length + ' features.');
            return;
          }
          if (active >= 0) {
            event.preventDefault();
            event.stopPropagation();
            active = -1;
            paint();
            if (opts.onActive) { opts.onActive(null); }
          }
          /* Otherwise the document-level handler closes the popover and
             returns focus to its trigger. */
        }
      });

      scroll.addEventListener('scroll', function () {
        if (suppressScroll > 0) { suppressScroll -= 1; return; }
        paint();
      });

      listbox.addEventListener('mousedown', function (event) {
        /* Keep focus on the single tab stop instead of blurring to the list. */
        event.preventDefault();
      });

      listbox.addEventListener('click', function (event) {
        var node = event.target.closest ? event.target.closest('[data-index]') : null;
        if (!node) { return; }
        lastKey = '';
        opts.onSelect(filtered[Number(node.getAttribute('data-index'))], false);
      });

      paint();
      updateCount();

      return {
        focus: function () { input.focus(); },
        reset: function () {
          input.value = '';
          query = '';
          refilter();
        }
      };
    }

    /* ---------------------------------------------------------------- */
    /* Workspace rendering                                               */
    /* ---------------------------------------------------------------- */
    function identityHtml(p) {
      if (p.mode === 'chooser') {
        return '<div class="dw-idbar">' +
          '<h2 class="dw-feature-title" id="dw-feature-h" tabindex="-1">Choose a feature<\/h2>' +
          '<span class="dw-trust">' + icon('i-check', '') + 'Project state verified<\/span>' +
          '<p class="dw-idbar-note">No feature was supplied and more than one is active, so nothing is selected until you choose one.<\/p>' +
        '<\/div>';
      }
      if (!p.identity) { return ''; }
      var id = p.identity;
      var trustClass = id.trust.kind === 'ok' ? 'dw-trust'
        : id.trust.kind === 'caution' ? 'dw-trust is-caution' : 'dw-trust is-error';
      var trustIcon = id.trust.kind === 'ok' ? 'i-check'
        : id.trust.kind === 'caution' ? 'i-clock' : 'i-error';
      return '<div class="dw-idbar">' +
        '<h2 class="dw-feature-title" id="dw-feature-h" tabindex="-1">' + esc(id.title) + '<\/h2>' +
        '<span class="fui-badge fui-badge-' + id.stage.kind + '">' + icon(id.stage.icon, 'fui-badge-glyph') + esc(id.stage.text) + '<\/span>' +
        '<span class="' + trustClass + '">' + icon(trustIcon, '') + esc(id.trust.text) + '<\/span>' +
        (id.note ? '<p class="dw-idbar-note">' + esc(id.note) + '<\/p>' : '') +
      '<\/div>';
    }

    function focalHtml(p) {
      if (p.mode === 'chooser') {
        return '<section class="dw-focal" aria-labelledby="dw-focal-h">' +
          '<h2 class="dw-eyebrow" id="dw-focal-h" tabindex="-1">' + icon('i-search', '') + '<span>Select a feature<\/span><\/h2>' +
          '<div id="page-chooser"><\/div>' +
        '<\/section>';
      }
      var f = p.focal;
      var support = '';
      if (f.phase) {
        support += '<p class="dw-support-label">Current phase<\/p>' +
          '<p class="dw-support-value">' + esc(f.phase) + '<\/p>';
      }
      if (f.why) {
        support += '<p class="dw-support-label">Why<\/p>' +
          '<p class="dw-support-text">' + esc(f.why) + '<\/p>';
      }
      var command = f.command
        ? '<div class="dw-command">' +
            '<code>' + esc(f.command.text) + '<\/code>' +
            '<button type="button" class="fui-button fui-button-secondary" data-action="copy" data-copy="' + esc(f.command.text) + '">' +
              icon('i-copy', 'fui-button-icon') + 'Copy command<\/button>' +
          '<\/div>' +
          '<p class="dw-caption">' + esc(f.command.note) + '<\/p>'
        : '';

      return '<section class="dw-focal' + (f.unavailable ? ' is-unavailable' : '') + '" aria-labelledby="dw-focal-h">' +
        '<h2 class="dw-eyebrow" id="dw-focal-h" tabindex="-1">' + icon(f.unavailable ? 'i-dash' : 'i-arrow', '') + '<span>' + esc(f.eyebrow) + '<\/span><\/h2>' +
        '<div class="dw-focal-grid">' +
          '<div class="dw-focal-lead">' +
            '<p class="dw-headline">' + esc(f.headline) + '<\/p>' +
            (f.detail ? '<p class="dw-focal-detail">' + esc(f.detail) + '<\/p>' : '') +
            command +
          '<\/div>' +
          (support ? '<div class="dw-focal-support">' + support + '<\/div>' : '') +
        '<\/div>' +
      '<\/section>';
    }

    function attentionHtml(p) {
      if (!p.attention) { return ''; }
      var a = p.attention;
      var body = '';
      if (a.summary) {
        body += '<p class="dw-status-summary">' + icon('i-check', '') + esc(a.summary) + '<\/p>';
      }
      if (a.bars.length) {
        body += '<div class="fui-attention">' + a.bars.map(function (bar) {
          var metas = bar.meta == null ? [] : (Object.prototype.toString.call(bar.meta) === '[object Array]' ? bar.meta : [bar.meta]);
          return '<div class="fui-messagebar fui-messagebar-' + bar.intent + '">' +
            '<span class="fui-messagebar-icon">' + icon(bar.icon, 'fui-icon') + '<\/span>' +
            '<div><p class="fui-messagebar-title">' + esc(bar.title) + '<\/p>' +
            '<p class="fui-messagebar-text">' + esc(bar.text) + '<\/p>' +
            metas.map(function (m) { return '<p class="fui-messagebar-meta">' + esc(m) + '<\/p>'; }).join('') +
            '<\/div><\/div>';
        }).join('') + '<\/div>';
      }
      if (a.facts.length) {
        body += '<ul class="dw-status-facts">' + a.facts.map(function (fact) {
          return '<li>' + icon('i-check', '') + esc(fact) + '<\/li>';
        }).join('') + '<\/ul>';
      }
      return '<section class="dw-section" aria-labelledby="dw-attention-h">' +
        '<h2 class="dw-section-heading" id="dw-attention-h">Attention<\/h2>' + body +
      '<\/section>';
    }

    function contextHtml(p) {
      var out = '';

      if (p.lifecycle) {
        out += '<section class="dw-section dw-life" aria-labelledby="dw-life-h">' +
          '<h2 class="dw-section-heading" id="dw-life-h">Lifecycle<\/h2>' +
          (p.lifecycle.note ? '<p class="dw-caption">' + esc(p.lifecycle.note) + '<\/p>' : '') +
          stepper(p.lifecycle.steps) +
          (p.progress ? meter(p.progress) : '') +
          (p.progressNote ? '<p class="dw-caption">' + esc(p.progressNote) + '<\/p>' : '') +
        '<\/section>';
      }

      out += '<div class="dw-context-flow">';

      if (p.instruction) {
        out += '<section class="dw-section" aria-labelledby="dw-how-h">' +
          '<h2 class="dw-section-heading" id="dw-how-h">' + esc(p.instruction.title) + '<\/h2>' +
          '<ol class="dw-steps">' + p.instruction.steps.map(function (s) {
            return '<li>' + esc(s) + '<\/li>';
          }).join('') + '<\/ol>' +
          '<div id="chooser-preview"><\/div>' +
        '<\/section>';
      }

      out += attentionHtml(p);

      var fresh = p.freshness;
      out += '<section class="dw-section" aria-labelledby="dw-fresh-h">' +
        '<h2 class="dw-section-heading" id="dw-fresh-h">Freshness<\/h2>' +
        '<div class="dw-freshness-row">' +
          '<span class="dw-freshness-state' + (fresh.state === 'failed' ? ' is-failed' : '') + '" id="freshness-state">' +
            icon(fresh.state === 'failed' ? 'i-warning' : 'i-clock', '') +
            '<span id="freshness-label">' + esc(fresh.label) + '<\/span>' +
          '<\/span>' +
          '<button type="button" class="fui-button fui-button-secondary" data-action="refresh" id="refresh-button">' +
            icon('i-refresh', 'fui-button-icon') + 'Refresh<\/button>' +
        '<\/div>' +
        '<p class="dw-caption" id="freshness-detail">' + esc(fresh.detail) + '<\/p>' +
      '<\/section>';

      var rows = p.evidence.rows.map(function (row) {
        return '<dt>' + esc(row[0]) + '<\/dt><dd>' + esc(row[1]) + '<\/dd>';
      }).join('');

      out += '<section class="dw-section" aria-labelledby="dw-evidence-h">' +
        '<h2 class="dw-section-heading" id="dw-evidence-h">Evidence<\/h2>' +
        '<details class="fui-accordion">' +
          '<summary class="fui-accordion-header">' + icon('i-chevron', 'fui-chevron') + 'Source details<\/summary>' +
          '<div class="dw-evidence-body">' +
            '<dl class="dw-source-list">' + rows + '<\/dl>' +
            (p.evidence.event
              ? '<div class="dw-event"><p class="dw-event-text">' + esc(p.evidence.event.text) + '<\/p>' +
                '<p class="dw-event-source">' + esc(p.evidence.event.source) + '<\/p><\/div>'
              : '<p class="dw-caption">' + esc(p.evidence.eventNote) + '<\/p>') +
          '<\/div>' +
        '<\/details>' +
      '<\/section>';

      out += '<\/div>';
      return out;
    }

    /* ---------------------------------------------------------------- */
    /* Application state                                                 */
    /* ---------------------------------------------------------------- */
    var STATE_LABEL = {
      current: 'Current',
      chooser: 'Chooser',
      blocked: 'Blocked',
      stale: 'Stale',
      empty: 'Empty',
      malformed: 'Malformed',
      mismatch: 'Tracking mismatch'
    };

    var stateId = 'current';
    var selectedNumber = SELECTED;
    var busy = false;
    var pageChooser = null;

    function projection() {
      if (stateId === 'chooser') { return STATES.chooser(); }
      if (stateId === 'empty') { return STATES.empty(); }
      if (selectedNumber !== SELECTED) {
        var f = ideaByNumber(selectedNumber);
        if (f) { return frontmatterProjection(f); }
      }
      return STATES[stateId]();
    }

    function renderChooserPreview(f) {
      var host = document.getElementById('chooser-preview');
      if (!host) { return; }
      if (!f) { host.innerHTML = ''; return; }
      host.innerHTML = '<div class="dw-preview">' +
        '<p class="dw-preview-title">' + esc(f.title) + '<\/p>' +
        '<p class="dw-caption">Stage: ' + esc(stageWord(f)) + '<\/p>' +
        '<p class="dw-preview-key">' + esc(featureKey(f)) + '<\/p>' +
        '<p class="dw-caption">Highlighted only. Press Enter to open it.<\/p>' +
      '<\/div>';
    }

    function render() {
      var p = projection();
      document.getElementById('workspace').innerHTML =
        identityHtml(p) +
        '<div class="dw-work">' + focalHtml(p) + '<\/div>' +
        '<aside class="dw-context" aria-label="Lifecycle and context">' + contextHtml(p) + '<\/aside>';

      pageChooser = null;
      if (p.mode === 'chooser') {
        pageChooser = createChooser(document.getElementById('page-chooser'), {
          id: 'page',
          currentNumber: function () { return null; },
          onSelect: function (f, viaKeyboard) { selectFeature(f, viaKeyboard); },
          onActive: renderChooserPreview
        });
      }

      /*
        Nothing to choose => a real inert button: `disabled`, out of the tab
        order, and labelled with the reason in words. It is never left
        focusable behind a low-contrast border.
      */
      var noFeatures = p.mode === 'empty';
      var hadFocus = document.activeElement === changeButton;
      changeButton.removeAttribute('aria-disabled');
      changeButton.disabled = noFeatures;
      document.getElementById('change-feature-label').textContent =
        noFeatures ? 'No features to choose' : 'Change feature';
      if (noFeatures) {
        closePopover(false);
        if (hadFocus) { moveFocus(document.getElementById('dw-focal-h'), keyboardIntent); }
      }

      document.getElementById('proto-now').textContent =
        'Fixture: ' + STATE_LABEL[stateId] +
        (stateId !== 'chooser' && selectedNumber && selectedNumber !== SELECTED ? ' · feature ' + selectedNumber : '');
    }

    function announce(message) {
      document.getElementById('live-region').textContent = message;
    }

    function selectFeature(f, viaKeyboard) {
      if (!f) { return; }
      selectedNumber = f.n;
      /* Fixtures other than Current describe 052 only. */
      if (stateId === 'chooser' || (f.n !== SELECTED && stateId !== 'current')) {
        stateId = 'current';
        syncRadios();
      }
      closePopover(false);
      render();
      var target = document.getElementById('dw-feature-h') || document.getElementById('dw-focal-h');
      if (!target || !moveFocus(target, viaKeyboard || keyboardIntent)) {
        moveFocus(changeButton, viaKeyboard || keyboardIntent);
      }
      announce('Opened ' + f.title + '.');
    }

    /* ---------------------------------------------------------------- */
    /* Focus continuity across DOM replacement                           */
    /* ---------------------------------------------------------------- */
    /*
      Every product update replaces innerHTML, which destroys whatever node had
      focus and drops focus to <body>. A keyboard user would silently lose their
      place. So the prototype records what the user was doing and puts focus
      back on the equivalent node afterwards.

      Two rules keep this honest:
        - focus is only MOVED when the user's own action replaced the node they
          were using; background updates never steal it;
        - the ring is only made visible when the action was keyboard-driven.
    */
    var keyboardIntent = false;
    document.addEventListener('keydown', function () { keyboardIntent = true; }, true);
    document.addEventListener('mousedown', function () { keyboardIntent = false; }, true);
    document.addEventListener('touchstart', function () { keyboardIntent = false; }, true);

    function moveFocus(node, visible) {
      if (!node || node.disabled) { return false; }
      node.focus();
      if (document.activeElement !== node) { return false; }
      if (visible) {
        node.setAttribute('data-proto-focus', 'visible');
        var drop = function () {
          node.removeAttribute('data-proto-focus');
          node.removeEventListener('blur', drop);
        };
        node.addEventListener('blur', drop);
      }
      return true;
    }

    /* ---------------------------------------------------------------- */
    /* Prototype drawer                                                  */
    /* ---------------------------------------------------------------- */
    var protoToggle = document.getElementById('proto-toggle');
    var protoPanel = document.getElementById('proto-panel');

    function setDrawer(open) {
      protoPanel.hidden = !open;
      protoToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    protoToggle.addEventListener('click', function () {
      setDrawer(protoToggle.getAttribute('aria-expanded') !== 'true');
    });

    /* ---------------------------------------------------------------- */
    /* Theme (prototype control)                                         */
    /* ---------------------------------------------------------------- */
    var themeSwitch = document.getElementById('theme-switch');
    var themeStateLabel = document.getElementById('theme-state');
    var hostDarkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var themeChosenExplicitly = false;

    function queryTheme() {
      return document.documentElement.getAttribute('data-proto-theme');
    }

    function effectiveDark() {
      var forced = queryTheme();
      if (forced) { return forced === 'dark'; }
      return !!(hostDarkQuery && hostDarkQuery.matches);
    }

    /* Switch state only: the .theme-system rule is still painting the theme. */
    function syncThemeControl(dark) {
      themeSwitch.setAttribute('aria-checked', dark ? 'true' : 'false');
      themeStateLabel.textContent = dark ? 'Dark' : 'Light';
    }

    /* An explicit choice pins the theme for this page lifetime only. */
    function applyExplicitTheme(dark) {
      themeChosenExplicitly = true;
      ['app', 'proto-bar'].forEach(function (id) {
        var node = document.getElementById(id);
        node.classList.remove('theme-system');
        node.classList.toggle('theme-dark', dark);
        node.classList.toggle('theme-light', !dark);
      });
      syncThemeControl(dark);
    }

    themeSwitch.addEventListener('click', function () {
      var dark = themeSwitch.getAttribute('aria-checked') !== 'true';
      applyExplicitTheme(dark);
      announce(dark ? 'Dark theme.' : 'Light theme.');
    });

    if (hostDarkQuery) {
      var followHost = function () {
        document.documentElement.classList.toggle('proto-host-dark', hostDarkQuery.matches);
        if (!themeChosenExplicitly && !queryTheme()) { syncThemeControl(hostDarkQuery.matches); }
      };
      if (hostDarkQuery.addEventListener) {
        hostDarkQuery.addEventListener('change', followHost);
      } else if (hostDarkQuery.addListener) {
        hostDarkQuery.addListener(followHost);
      }
    }

    /* ---------------------------------------------------------------- */
    /* State radio group (prototype control)                             */
    /* ---------------------------------------------------------------- */
    var radios = Array.prototype.slice.call(document.querySelectorAll('#state-group [role="radio"]'));

    function syncRadios() {
      radios.forEach(function (r) {
        var on = r.getAttribute('data-state') === stateId;
        r.setAttribute('aria-checked', on ? 'true' : 'false');
        r.tabIndex = on ? 0 : -1;
      });
    }

    function selectState(next, focusIt) {
      stateId = next;
      selectedNumber = next === 'chooser' ? null : SELECTED;
      syncRadios();
      render();
      if (focusIt) {
        radios.filter(function (r) { return r.getAttribute('data-state') === stateId; })[0].focus();
      }
    }

    radios.forEach(function (radio, index) {
      radio.addEventListener('click', function () { selectState(radio.getAttribute('data-state'), false); });
      radio.addEventListener('keydown', function (event) {
        var delta = event.key === 'ArrowRight' || event.key === 'ArrowDown' ? 1
          : event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -1 : 0;
        if (!delta) { return; }
        event.preventDefault();
        var next = radios[(index + delta + radios.length) % radios.length];
        selectState(next.getAttribute('data-state'), true);
      });
    });

    /* ---------------------------------------------------------------- */
    /* Feature popover — the same chooser component, at every width       */
    /* ---------------------------------------------------------------- */
    var popover = document.getElementById('feature-popover');
    var changeButton = document.getElementById('change-feature');

    var popoverChooser = createChooser(document.getElementById('popover-chooser'), {
      id: 'pop',
      currentNumber: function () { return selectedNumber; },
      onSelect: function (f, viaKeyboard) { selectFeature(f, viaKeyboard); },
      onActive: null
    });

    function openPopover() {
      if (changeButton.disabled) { return; }
      popover.hidden = false;
      changeButton.setAttribute('aria-expanded', 'true');
      popoverChooser.reset();
      popoverChooser.focus();
    }

    function closePopover(returnFocus) {
      if (popover.hidden) { return; }
      popover.hidden = true;
      changeButton.setAttribute('aria-expanded', 'false');
      /* Escape and the toggle both hand focus back to the trigger. */
      if (returnFocus) { moveFocus(changeButton, keyboardIntent); }
    }

    changeButton.addEventListener('click', function () {
      if (popover.hidden) { openPopover(); } else { closePopover(true); }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { closePopover(true); }
    });

    document.addEventListener('click', function (event) {
      if (popover.hidden) { return; }
      if (popover.contains(event.target) || changeButton.contains(event.target)) { return; }
      closePopover(false);
    });

    /* ---------------------------------------------------------------- */
    /* Product controls: Refresh and copy                                */
    /* ---------------------------------------------------------------- */
    function refresh() {
      if (busy) { return; }
      busy = true;
      var button = document.getElementById('refresh-button');
      /*
        The button stays focusable while busy (aria-disabled, not disabled), so
        the keyboard user is not thrown out of their own action mid-read. The
        completed read replaces the whole context region, so focus intent is
        captured now and restored to the replacement node afterwards.
      */
      var hadFocus = document.activeElement === button;
      var showRing = hadFocus && keyboardIntent;
      button.setAttribute('aria-disabled', 'true');
      button.setAttribute('aria-busy', 'true');
      document.getElementById('freshness-label').textContent = 'Reading sources\u2026';
      document.getElementById('freshness-detail').textContent = 'The visible view stays in place until one complete read succeeds.';
      announce('Reading sources.');

      window.setTimeout(function () {
        busy = false;
        var swapped = stateId === 'stale';
        if (swapped) {
          /* A successful refresh swaps exactly one complete projection. */
          stateId = 'current';
          syncRadios();
        }
        render();
        if (hadFocus) { moveFocus(document.getElementById('refresh-button'), showRing); }
        announce(swapped
          ? 'Read just now. One complete view replaced the preserved one.'
          : 'Read just now.');
      }, 900);
    }

    function copyText(text, button) {
      var done = function (ok) {
        button.lastChild.nodeValue = ok ? 'Copied' : 'Copy failed';
        announce(ok ? 'Copied ' + text : 'Copy failed. Select the command text instead.');
        window.setTimeout(function () {
          if (button.isConnected) { button.lastChild.nodeValue = 'Copy command'; }
        }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        return;
      }
      try {
        var area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        done(document.execCommand('copy'));
        document.body.removeChild(area);
      } catch (error) {
        done(false);
      }
    }

    document.addEventListener('click', function (event) {
      var action = event.target.closest ? event.target.closest('[data-action]') : null;
      if (!action) { return; }
      if (action.getAttribute('aria-disabled') === 'true') { return; }
      if (action.getAttribute('data-action') === 'refresh') { refresh(); }
      if (action.getAttribute('data-action') === 'copy') { copyText(action.getAttribute('data-copy'), action); }
    });

    /* ---------------------------------------------------------------- */
    /* Boot — query parameters, then first render                        */
    /* ---------------------------------------------------------------- */
    (function boot() {
      var params;
      try { params = new URLSearchParams(window.location.search); } catch (error) { params = null; }
      if (params) {
        var wanted = params.get('state');
        if (wanted && STATES[wanted]) {
          stateId = wanted;
          selectedNumber = wanted === 'chooser' ? null : SELECTED;
        }
        if (params.get('controls') === 'open') { setDrawer(true); }
      }
      syncRadios();
      /* Host preference is the first-load default; the CSS already painted it. */
      syncThemeControl(effectiveDark());
      render();
    }());
  }());
  </script>
</body>
</html>
