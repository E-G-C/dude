    .fui-switch[aria-checked="true"] .fui-switch-track {
      background-color: var(--colorBrandBackground);
      border-color: var(--colorCompoundBrandStroke);
    }

    .fui-switch-thumb {
      position: absolute;
      top: var(--spacingVerticalXS);
      left: var(--spacingHorizontalXS);
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      border-radius: var(--borderRadiusCircular);
      background-color: var(--colorNeutralStrokeAccessible);
      transition: transform var(--durationFaster) ease, background-color var(--durationFaster) ease;
    }

    .fui-switch[aria-checked="true"] .fui-switch-thumb {
      background-color: var(--colorNeutralForegroundOnBrand);
      transform: translateX(var(--spacingHorizontalL));
    }

    /* Fluent RadioGroup rendered as compact selectable chips */
    .fui-radiogroup {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacingHorizontalXS);
    }

    .fui-radio {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      min-height: var(--button-height-compact);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalMNudge);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
      cursor: pointer;
      transition: background-color var(--durationFaster) ease;
    }

    .fui-radio:hover { background-color: var(--colorNeutralBackground1Hover); }

    .fui-radio[aria-checked="true"] {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorBrandBackground);
      border-color: var(--colorCompoundBrandStroke);
    }

    .fui-radio-mark {
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      opacity: 0;
    }

    .fui-radio[aria-checked="true"] .fui-radio-mark { opacity: 1; }

    /* ====================================================================
       APPLICATION WINDOW
       Persistent chrome top and bottom, docked regions with real edges.
       ==================================================================== */
    .shell {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-width: 0;
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground3);
    }

    /* ---------- Title / command bar ---------- */
    .shell-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-height: var(--shell-bar);
      padding: var(--spacingVerticalSNudge) var(--spacingHorizontalM);
      background-color: var(--colorNeutralBackground2);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    .shell-brand {
      display: flex;
      align-items: baseline;
      gap: var(--spacingHorizontalSNudge);
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      white-space: nowrap;
    }

    .shell-brand-mark {
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-size-20);
      height: var(--icon-size-20);
      border-radius: var(--borderRadiusSmall);
      color: var(--colorBrandForeground1);
    }

    .shell-brand-mark svg {
      width: var(--icon-size-16);
      height: var(--icon-size-16);
    }

    .shell-brand-sub {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightRegular);
      color: var(--colorNeutralForeground3);
    }

    .shell-bar-rule {
      flex: 0 0 auto;
      align-self: stretch;
      width: var(--strokeWidthThin);
      margin: var(--spacingVerticalNone) var(--spacingHorizontalXS);
      background-color: var(--colorNeutralStroke2);
    }

    /*
      THE ONE FEATURE-SELECTION SURFACE.

      Feature context is global window state, so it lives in the command bar
      and nowhere else. The slot has exactly two forms and never both at once,
      and the fork is INVENTORY, not whether a feature happens to be open:

        inventory available  a real Fluent Combobox. One tab stop. The first
                             click, or the first focus, opens the WHOLE list.
                             This is the same control whether nothing is
                             selected yet or `052-dude-canvas-ui` already is;
                             when one is, the field displays that identifier
                             and the matching row is the marked option.
        no inventory at all  a noninteractive identity chip. Only the empty
                             projection reaches this: zero features were found,
                             so there is nothing honest for a control to open.

      A resolved feature used to take the chip too, which is what made the
      selection look final and unchangeable. A window that can show a feature
      can also change which one it shows, so the control stays.

      There is no second selector anywhere in the window, and no button that
      opens a dialog that contains the real control.
    */
    .shell-context {
      position: relative;
      flex: 1 1 220px;
      min-width: 0;
      max-width: 420px;
    }

    /* Fluent <Field label="Feature" orientation="horizontal"> */
    .ctx-chooser {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-width: 0;
    }

    .ctx-chooser[hidden],
    .ctx-identity[hidden] { display: none; }

    .ctx-label {
      flex: 0 0 auto;
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorNeutralForeground3);
    }

    /*
      Under 720 the bar has to carry the brand, the control, and Refresh in
      360px, so the visible label collapses to its accessible form only. The
      <label for> association, and therefore the accessible name, is unchanged.
    */
    @media (max-width: 719px) {
      .ctx-label {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: var(--spacingVerticalNone);
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    }

    /* Fluent Combobox root: Input anatomy plus the expand icon. */
    .ctx-combobox {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-width: 0;
      min-height: var(--button-height-medium);
      box-sizing: border-box;
      padding: var(--spacingVerticalNone) var(--spacingHorizontalS);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      /* Fluent Input's compound brand underline */
      border-bottom: var(--strokeWidthThick) solid var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
      cursor: text;
    }

    .ctx-combobox:hover { background-color: var(--colorNeutralBackground1Hover); }

    /*
      Fluent splits the two indicators, and so does this: the compound brand
      underline follows ANY focus, and the 2px ring follows KEYBOARD focus
      only — which is what createCustomFocusIndicatorStyle emits as
      [data-fui-focus-visible]. The ring is drawn on the field root rather
      than the inner <input> so it wraps the whole control, including the
      expand glyph, the way a real Combobox does. Stock Fluent stops at the
      underline; the ring is added here deliberately, because a 2px underline
      on the bottom edge of a 32px field sitting in a command bar is easy to
      lose next to the bar's own divider.
    */
    .ctx-combobox:focus-within { border-bottom-color: var(--colorCompoundBrandStroke); }

    .ctx-combobox:has(.ctx-input:focus-visible) {
      outline: var(--strokeWidthThick) solid var(--colorStrokeFocus2);
      outline-offset: var(--spacingHorizontalXXS);
    }

    /*
      Fluent <Field validationState="error">. A refused selection is the one
      failure this control can report, and it is never colour alone: the
      boundary changes, `aria-invalid` is set on the input, the popup carries
      the sentence that names both features, and the live region says it out
      loud. It is cleared by the next keystroke, the next open, or the next
      successful selection — it is a report, not a mode.
    */
    .ctx-combobox:has(.ctx-input[aria-invalid="true"]) {
      border-color: var(--colorPaletteRedBorder2);
    }

    .ctx-input {
      flex: 1 1 auto;
      min-width: 0;
      padding: var(--spacingVerticalXS) var(--spacingHorizontalNone);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground1);
      background: none;
      border: none;
    }

    /* The ring belongs to the field root, not to the bare text node inside it. */
    .ctx-input:focus,
    .ctx-input:focus-visible { outline: none; }
    .ctx-input::placeholder { color: var(--colorNeutralForeground3); }

    /* Fluent's expandIcon slot: decoration inside the control, never a target. */
    .ctx-expand {
      flex: 0 0 auto;
      display: flex;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      color: var(--colorNeutralForeground3);
    }

    .ctx-expand svg {
      width: 100%;
      height: 100%;
      transform: rotate(90deg);
    }

    /*
      The identity chip. Same footprint as the control it replaces, deliberately
      inert: no cursor change, no hover, no caret, no handler.
    */
    .ctx-identity {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      width: 100%;
      box-sizing: border-box;
      min-height: var(--button-height-medium);
      padding: var(--spacingVerticalXXS) var(--spacingHorizontalS);
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
    }

    .ctx-icon {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      color: var(--colorNeutralForeground3);
    }

    .ctx-text {
      display: grid;
      min-width: 0;
    }

    .ctx-caption {
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorNeutralForeground3);
    }

    .ctx-name {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: inherit;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .shell-toolbar {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      margin-left: auto;
    }

    /* ---------- Activity rail ---------- */
    /*
      The docked regions fill the window: the last row takes the remaining
      height so a short document leaves the DOCK surface behind it, not a bare
      strip of page background. That is the difference between a window and a
      page that happens to be short.
    */
    .shell-body {
      display: grid;
      flex: 1 1 auto;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "rail" "work" "dock";
      grid-template-rows: auto auto minmax(0, 1fr);
      min-width: 0;
    }

    .shell-rail {
      grid-area: rail;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: var(--spacingHorizontalS);
      padding: var(--spacingVerticalS) var(--spacingHorizontalM);
      background-color: var(--colorNeutralBackground2);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    .rail-list {
      display: flex;
      flex-direction: row;
      gap: var(--spacingHorizontalXS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .rail-item { position: relative; display: flex; }

    .rail-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--rail-target);
      height: var(--rail-target);
      padding: var(--spacingVerticalNone);
      color: var(--colorNeutralForeground2);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
      cursor: pointer;
      transition: background-color var(--durationFaster) ease;
    }

    .rail-button:hover { background-color: var(--colorNeutralBackground1Hover); }

    .rail-button svg {
      width: var(--icon-size-16);
      height: var(--icon-size-16);
    }

    .rail-button[aria-current="page"] {
      color: var(--colorBrandForeground1);
      border-color: var(--colorCompoundBrandStroke);
      box-shadow: inset 0 calc(-1 * var(--strokeWidthThicker)) 0 0 var(--colorCompoundBrandStroke);
    }

    /*
      FUTURE SURFACE — genuinely inert. `disabled` removes it from the tab
      order, so WCAG 1.4.11 exempts its boundary; the dashed edge and the
      corner clock badge are therefore additional cues, never the only ones.
      The words "arrives in a later cycle" are in the accessible name.
    */
    .rail-button:disabled {
      color: var(--colorNeutralForegroundDisabled);
      background-color: var(--colorNeutralBackgroundDisabled);
      border-style: dashed;
      border-color: var(--colorNeutralStrokeDisabled);
      cursor: not-allowed;
    }

    .rail-button:disabled:hover { background-color: var(--colorNeutralBackgroundDisabled); }

    .rail-later {
      position: absolute;
      right: calc(-1 * var(--spacingHorizontalXXS));
      bottom: calc(-1 * var(--spacingVerticalXXS));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground2);
      border-radius: var(--borderRadiusCircular);
    }

    .rail-later svg {
      width: var(--icon-size-12);
      height: var(--icon-size-12);
    }

    /* ---------- Work surface ---------- */
    /*
      The work column is the WINDOW slot; .work-body is the DOCUMENT inside it.
      The slot inherits the neutral window surface and the document paints
      Background1 and sizes to its own content (align-content: start). So when
      the content is short, the leftover height below the document's closing
      rule is plain window background, exactly as an editor pane behaves — it
      is never a giant empty bordered region and no card is stretched to fill.
    */
    .shell-work {
      grid-area: work;
      display: block;
      min-width: 0;
      padding: var(--spacingVerticalNone);
      background-color: var(--colorNeutralBackground3);
    }

    .work-body {
      container-type: inline-size;
      container-name: work;
      display: grid;
      gap: var(--spacingVerticalNone);
      align-content: start;
      min-width: 0;
      background-color: var(--colorNeutralBackground1);
    }

    /* ---------- Details dock ---------- */
    .shell-dock {
      grid-area: dock;
      min-width: 0;
      background-color: var(--colorNeutralBackground2);
      border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    .dock-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--spacingVerticalNone) var(--spacingHorizontalXXL);
      align-items: start;
      min-width: 0;
      padding: var(--spacingVerticalNone) var(--shell-pad-tight) var(--spacingVerticalM);
    }

    /* ---------- Status bar ---------- */
    /*
      Ambient window furniture. NO interactive targets live here: see the
      density-vs-AA note at the top of this file. It wraps rather than
      truncates, so nothing is ever hidden at narrow widths.
    */
    .shell-status {
      position: sticky;
      bottom: 0;
      z-index: 15;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingVerticalXXS) var(--spacingHorizontalM);
      min-height: var(--shell-status);
      padding: var(--spacingVerticalXS) var(--spacingHorizontalM);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
      background-color: var(--colorNeutralBackground4);
      border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    .st-seg {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      min-width: 0;
    }

    .st-seg svg {
      flex: 0 0 auto;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      color: var(--colorNeutralForeground3);
    }

    .st-seg.is-ok svg { color: var(--colorPaletteGreenForeground1); }
    .st-seg.is-caution svg { color: var(--colorPaletteYellowForeground1); }
    .st-seg.is-error svg { color: var(--colorPaletteRedForeground1); }

    .st-strong { font-weight: var(--fontWeightSemibold); color: var(--colorNeutralForeground1); }

    .st-push { margin-left: auto; }

    /*
      Below the window composition the shell is a single column, so the status
      bar stops being window furniture and becomes the last row of the
      document: static, not sticky, so it can never sit over the dock while
      the page scrolls. The generic keyboard hint is dropped there too — it is
      the only status segment whose information is repeated verbatim beside
      the control it describes, so nothing is lost.
    */
    @media (max-width: 719px) {
      .shell-status { position: static; }
      .st-keys { display: none; }
    }

    .st-keys kbd {
      padding: 0 var(--spacingHorizontalXS);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      color: var(--colorNeutralForeground2);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke1);
      border-radius: var(--borderRadiusSmall);
    }

    /* ====================================================================
       WINDOW COMPOSITION
       Media queries, because the shell IS the window. Regions inside use
       container queries, because those thresholds are about region room.
       ==================================================================== */

    /* rail | work  (dock below) */
    @media (min-width: 720px) {
      .shell-body {
        grid-template-columns: var(--shell-rail) minmax(0, 1fr);
        grid-template-areas:
          "rail work"
          "rail dock";
        grid-template-rows: auto minmax(0, 1fr);
      }

      .shell-rail {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: var(--spacingVerticalS);
        padding: var(--spacingVerticalS) var(--spacingHorizontalS);
        border-bottom: none;
        border-right: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      }

      .rail-list { flex-direction: column; gap: var(--spacingVerticalXS); }

      .rail-button[aria-current="page"] {
        box-shadow: inset var(--strokeWidthThicker) 0 0 0 var(--colorCompoundBrandStroke);
      }
    }

    /* rail | work | dock */
    @media (min-width: 1080px) {
      .shell-body {
        grid-template-columns: var(--shell-rail) minmax(var(--shell-work-min), 1fr) minmax(var(--shell-dock-min), var(--shell-dock-max));
        grid-template-areas: "rail work dock";
        grid-template-rows: minmax(0, 1fr);
      }

      .shell-dock {
        border-top: none;
        border-left: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      }

      .dock-body {
        grid-template-columns: minmax(0, 1fr);
        padding: var(--spacingVerticalNone) var(--shell-pad-tight) var(--spacingVerticalXXL);
      }
    }

    /* ====================================================================
       Fluent Button — used in the command bar and inside content.
       ==================================================================== */
    .fui-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacingHorizontalSNudge);
      min-height: var(--button-height-compact);
      min-width: var(--button-height-compact);
      padding: var(--spacingVerticalXXS) var(--spacingHorizontalMNudge);
      font-family: var(--fontFamilyBase);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      border-radius: var(--borderRadiusMedium);
      text-decoration: none;
      cursor: pointer;
      transition: background-color var(--durationFaster) ease, border-color var(--durationFaster) ease;
    }

    .fui-button-secondary {
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground1);
      /* Interactive boundary: accessible stroke, not stock Stroke1. */
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
    }

    .fui-button-secondary:hover { background-color: var(--colorNeutralBackground1Hover); }

    /*
      TWO DISTINCT UNAVAILABLE TREATMENTS, chosen by why the control is
      unavailable, reused from fluent-responsive-workspace.html.

      aria-disabled="true"  Temporarily busy (Refresh, while one read runs).
                            It MUST stay focusable, or keyboard focus is
                            destroyed in the middle of the user's own action,
                            so it keeps the accessible boundary and carries the
                            state in its visible label plus aria-busy.

      :disabled             Genuinely inert. Removed from the tab order, states
                            its reason in words, and is exempt under 1.4.11 —
                            but never relies on the boundary as its only cue.
    */
    .fui-button[aria-disabled="true"] {
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground3);
      border-color: var(--colorNeutralStrokeAccessible);
      cursor: progress;
    }

    .fui-button:disabled {
      color: var(--colorNeutralForegroundDisabled);
      background-color: var(--colorNeutralBackgroundDisabled);
      border-color: var(--colorNeutralStrokeDisabled);
      cursor: not-allowed;
    }

    .fui-button-icon {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
    }

    /* ---------- Fluent Combobox listbox popup ---------- */
    /*
      The inline popup of the one feature Combobox. It is in the DOM tree next
      to its own control (Fluent's `inlinePopup`), not portalled to <body>, so
      the host page keeps one tree and one stacking context.

      WIDTH IS SPECIFIED, NOT INHERITED. The popup spans the whole Field —
      label and control — rather than the control alone. Fluent v9 positions a
      Combobox listbox with `matchTargetSize: 'width'` by default, which would
      anchor it to the input and make it 351.8px at 1440; a real build must
      therefore pass `positioning={{ matchTargetSize: undefined }}` and size
      the listbox to the Field to reproduce what is drawn here. Measured, at
      the longest identifier in the real inventory:
        Field width, as drawn ..... popup 420px, 0 of 50 rows ellipsized
        Fluent's default .......... popup 351.8px, 1 of 50 rows ellipsized
      The difference is one row and 68px, it is spent on the one thing a row
      carries, and below 720 the two are identical anyway: the visible label
      collapses there, so the Field and the control are the same box.
    */
    .fui-listbox-surface {
      position: absolute;
      z-index: 30;
      top: calc(100% + var(--spacingVerticalXS));
      left: 0;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      display: grid;
      gap: var(--spacingVerticalXS);
      padding: var(--spacingVerticalXS);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      border-radius: var(--borderRadiusMedium);
      /* Elevation kept: a Fluent Combobox popup justifies it. */
      box-shadow: var(--shadow16);
    }

    .fui-listbox-surface[hidden] { display: none; }

    /* ====================================================================
       Work surface content — dense rows separated by rules, not gaps.
       ==================================================================== */
    .work-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalXS) var(--spacingHorizontalS);
      padding: var(--spacingVerticalXS) var(--shell-pad);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      min-width: 0;
    }

    /* ---------- Breadcrumb ---------- */
    /*
      Fluent <Breadcrumb>. The trail is plain text, not links: this cycle has
      nowhere else to navigate, and a dead link is a promise the product cannot
      keep. The current item carries aria-current="page".
    */
    .crumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalXXS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
      min-width: 0;
    }

    .crumbs li { display: inline-flex; align-items: center; gap: var(--spacingHorizontalXXS); min-width: 0; }

    .crumbs svg {
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      color: var(--colorNeutralForeground4);
    }

    .crumb-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .crumbs [aria-current="page"] .crumb-text {
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground2);
    }

    /* ---------- Identity strip (Azure DevOps work-item header) ---------- */
    .work-identity {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalXS) var(--spacingHorizontalMNudge);
      padding: var(--spacingVerticalS) var(--shell-pad);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      min-width: 0;
    }

    /* Type ramp: Subtitle2 */
    .work-title {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase400);
      line-height: var(--lineHeightBase400);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .work-id {
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
      overflow-wrap: anywhere;
    }

    .work-note {
      flex: 1 1 100%;
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
    }

    /* ---------- Fluent Badge ---------- */
    .fui-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      min-height: var(--badge-size-medium);
      padding: 0 var(--spacingHorizontalS);
      border-radius: var(--borderRadiusCircular);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      white-space: nowrap;
    }

    .fui-badge-glyph {
      flex: 0 0 auto;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
    }

    /*
      The badge sits directly on a page surface. In the dark theme the brand
      FILL alone is only 2.8:1 against that surface, so the boundary uses the
      compound brand stroke, which Fluent ships for exactly this purpose.
    */
    .fui-badge-brand {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorBrandBackground);
      border: var(--strokeWidthThin) solid var(--colorCompoundBrandStroke);
    }

    .fui-badge-outline {
      color: var(--colorNeutralForeground2);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
    }

    /*
      The blocked stage badge is the one status chip that must survive a quick
      glance, so its rim uses the red FOREGROUND token rather than the fill
      itself: the fill alone is 2.95:1 against the dark window surface, and the
      foreground token measures 5.4:1 light / 6.3:1 dark.
    */
    .fui-badge-danger {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorPaletteRedBorder2);
      border: var(--strokeWidthThin) solid var(--colorPaletteRedForeground1);
    }

    /*
      Decorative chip. It is not a control, it is never the only carrier of a
      state, and its own label is the meaning, so its boundary is a decorative
      rule under WCAG 1.4.11 and uses stock Stroke2. The label itself is held
      to full text contrast.
    */
    .fui-badge-subtle {
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground2);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    /* ====================================================================
       NEXT STEP — the one elevated surface in the window, and the only place
       type is allowed to get big. Everything else stays dense.
       ==================================================================== */
    .work-region {
      padding: var(--spacingVerticalM) var(--shell-pad);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      min-width: 0;
    }

    .focal {
      display: grid;
      gap: var(--spacingVerticalS);
      padding: var(--spacingVerticalM) var(--spacingHorizontalL);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      border-left: var(--strokeWidthThickest) solid var(--colorCompoundBrandStroke);
      border-radius: var(--borderRadiusMedium);
      box-shadow: var(--shadow4);
      min-width: 0;
    }

    .focal.is-unavailable {
      border-left-color: var(--colorNeutralStrokeAccessible);
      box-shadow: none;
    }

    /* Type ramp: Caption1Strong */
    .focal-eyebrow {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorBrandForeground1);
    }

    .focal.is-unavailable .focal-eyebrow { color: var(--colorNeutralForeground3); }

    .focal-eyebrow svg {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
    }

    /* Type ramp: Title3 — the largest type in the window, by design. */
    .focal-headline {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-headline);
      font-size: var(--fontSizeBase500);
      line-height: var(--lineHeightBase500);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .focal.is-unavailable .focal-headline {
      font-size: var(--fontSizeBase400);
      line-height: var(--lineHeightBase400);
      color: var(--colorNeutralForeground2);
    }

    .focal-detail {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground1);
    }

    /*
      Below the focal text, the supporting facts sit in a dense two-column
      label/value grid at >= 560px of focal room, and stack below that.
    */
    .focal-facts {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--spacingVerticalS) var(--spacingHorizontalXXL);
      margin: var(--spacingVerticalNone);
      padding-top: var(--spacingVerticalS);
      border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    @container work (min-width: 560px) {
      .focal-facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    }

    .focal-fact { display: grid; gap: var(--spacingVerticalXXS); min-width: 0; }

    .fact-label {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorNeutralForeground3);
    }

    .fact-value {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    /* ---------- Empty-state command ---------- */
    .focal-command {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalS);
    }

    .focal-command code {
      flex: 1 1 auto;
      min-width: 0;
      padding: var(--spacingVerticalXS) var(--spacingHorizontalS);
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground1);
      background-color: var(--colorNeutralBackground2);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      border-radius: var(--borderRadiusMedium);
      overflow-wrap: anywhere;
    }

    /* ---------- Section headings ---------- */
    .region-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--spacingHorizontalS);
      margin: var(--spacingVerticalNone) var(--spacingHorizontalNone) var(--spacingVerticalS);
    }

    .region-title {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorNeutralForeground3);
    }

    .caption {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
    }

    /* ====================================================================
       Lifecycle pipeline + task meter. Denser than the responsive mock: the
       stepper is a horizontal pipeline of rules as soon as it has 440px, and
       the markers are 20px rather than 24px.
       ==================================================================== */
    .fui-stepper {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--spacingVerticalNone);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .fui-step {
      position: relative;
      display: grid;
      grid-template-columns: var(--badge-size-medium) minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingVerticalNone) var(--spacingHorizontalMNudge);
      padding-bottom: var(--spacingVerticalSNudge);
      text-align: left;
    }

    .fui-step:last-child { padding-bottom: var(--spacingVerticalNone); }

    .fui-step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: var(--badge-size-medium);
      bottom: var(--spacingVerticalXXS);
      left: calc(var(--badge-size-medium) / 2 - var(--strokeWidthThin));
      width: var(--strokeWidthThick);
      background-color: var(--colorNeutralStroke1);
    }

    .fui-step.is-complete:not(:last-child)::after { background-color: var(--colorPaletteGreenBorder2); }

    .fui-step-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--badge-size-medium);
      height: var(--badge-size-medium);
      border-radius: var(--borderRadiusCircular);
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
    }

    .fui-step-glyph { width: var(--icon-size-12); height: var(--icon-size-12); }

    .fui-step.is-complete .fui-step-badge {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorPaletteGreenBorder2);
      border-color: var(--colorPaletteGreenBorder2);
    }

    .fui-step.is-current .fui-step-badge {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorBrandBackground);
      border-color: var(--colorCompoundBrandStroke);
    }

    .fui-step.is-unknown .fui-step-badge {
      border-style: dashed;
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground2);
    }

    .fui-step-label {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .fui-step.is-complete .fui-step-label {
      font-weight: var(--fontWeightSemibold);
      color: var(--colorPaletteGreenForeground1);
    }

    .fui-step.is-current .fui-step-label {
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .fui-step-state {
      display: block;
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      font-weight: var(--fontWeightRegular);
      color: var(--colorNeutralForeground3);
    }

    /*
      4 steps x 100px of label ("Not started" is the widest at 12px) = 400
      honest fit; 440 is taken for slack. The lifecycle sits in the work
      column, so this is a container query on that region, not on the window.
    */
    @container work (min-width: 440px) {
      .fui-stepper { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .fui-step {
        grid-template-columns: minmax(0, 1fr);
        justify-items: start;
        gap: var(--spacingVerticalXS);
        padding-bottom: var(--spacingVerticalNone);
      }
      .fui-step:not(:last-child)::after {
        top: calc(var(--badge-size-medium) / 2 - var(--strokeWidthThin));
        bottom: auto;
        left: calc(var(--badge-size-medium) + var(--spacingHorizontalS));
        right: var(--spacingHorizontalS);
        width: auto;
        height: var(--strokeWidthThick);
      }
    }

    /* ---------- Progress, tied to the stage, never a percentage ---------- */
    .meter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingVerticalXS) var(--spacingHorizontalL);
      margin-top: var(--spacingVerticalM);
      padding-top: var(--spacingVerticalS);
      border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    /*
      Composed meter. Fluent's ProgressBar is single-value, so three
      proportional bars share one 4px track (--strokeWidthThickest is
      ProgressBar "large"). The bar is aria-hidden; the legend carries the text.
    */
    .meter {
      flex: 1 1 160px;
      display: flex;
      gap: var(--spacingHorizontalXXS);
      min-width: 120px;
      height: var(--strokeWidthThickest);
      border-radius: var(--borderRadiusCircular);
      overflow: hidden;
    }

    .meter-seg {
      flex-grow: var(--seg, 1);
      flex-basis: 0;
      min-width: var(--spacingHorizontalXXS);
      border-radius: var(--borderRadiusCircular);
    }

    .meter-seg.is-done { background-color: var(--colorPaletteGreenBorder2); }
    .meter-seg.is-doing { background-color: var(--colorBrandBackground); }
    .meter-seg.is-blocked { background-color: var(--colorPaletteRedBorder2); }
    .meter-seg.is-open { background-color: var(--colorNeutralStroke1); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacingHorizontalXS) var(--spacingHorizontalM);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .legend li {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .legend svg { flex: 0 0 auto; width: var(--icon-size-12); height: var(--icon-size-12); }
    .legend .is-done svg { color: var(--colorPaletteGreenForeground1); }
    .legend .is-doing svg { color: var(--colorBrandForeground1); }
    .legend .is-blocked svg { color: var(--colorPaletteRedForeground1); }
    .legend .is-open svg { color: var(--colorNeutralForeground3); }
    .legend-count { font-weight: var(--fontWeightSemibold); color: var(--colorNeutralForeground1); }

    /* ====================================================================
       PHASES — the real phase breakdown, one dense row per phase.

       WHY THIS EXISTS
         The lifecycle stepper says WHERE the feature is in four words. It
         cannot say how much of the current stage is actually behind it, so on
         a tall desktop window it left the column shallow. This region gives
         the stepper depth with the one structure the source file already has:
         its phases. Azure DevOps shows iteration progress this way, Jira shows
         epic progress this way, and both keep it as a SUMMARY.

       WHAT IT IS NOT
         Not the deferred Work board. There is no per-task row, no expander
         that reveals an individual actionable task, no task key, and nothing
         here can be claimed, started, assigned, run, or mutated. Exact task
         keys stay under Evidence -> Source details.

       LAYOUT CONSTANTS
         --phase-mark   20px   equals --badge-size-medium, so phase markers
                               sit on the same optical axis as the lifecycle
                               markers directly above them.
         --phase-dist  116px   distribution track. Decorative and aria-hidden;
                               the count text beside it carries the meaning.
         --phase-count 132px   "2 of 3 done · 1 in progress" at 12px Segoe UI
                               measures 128px; 132 is the honest fit.
         Wide row = 20 + 12 + 1fr + 16 + 116 + 16 + 132 = 312 of fixed width,
         so the name still has 328px inside the 640px work floor. Below 520px
         of work-column room the row stacks instead.
       ==================================================================== */
    .phases {
      --phase-mark: var(--badge-size-medium);
      --phase-dist: 116px;
      --phase-count: 132px;
      display: grid;
      gap: var(--spacingVerticalNone);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
      border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    .phase-row {
      display: grid;
      grid-template-columns: var(--phase-mark) minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingVerticalXS) var(--spacingHorizontalM);
      padding: var(--spacingVerticalMNudge) var(--spacingHorizontalS) var(--spacingVerticalMNudge) var(--spacingHorizontalS);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      min-width: 0;
    }

    /*
      The current phase is marked FOUR ways, so colour is never the carrier:
      a 3px inset accent edge (shape), a half-filled marker glyph (shape),
      a "Current phase" chip in words, and aria-current="step" for assistive
      technology. Removing every colour from this file would still leave the
      current phase unambiguous.
    */
    .phase-row.is-current {
      background-color: var(--colorNeutralBackground2);
      box-shadow: inset var(--strokeWidthThicker) 0 0 0 var(--colorCompoundBrandStroke);
    }

    .phase-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--phase-mark);
      height: var(--phase-mark);
      border-radius: var(--borderRadiusCircular);
      color: var(--colorNeutralForeground3);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
    }

    .phase-mark svg { width: var(--icon-size-12); height: var(--icon-size-12); }

    .phase-row.is-done .phase-mark {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorPaletteGreenBorder2);
      border-color: var(--colorPaletteGreenBorder2);
    }

    .phase-row.is-current .phase-mark {
      color: var(--colorNeutralForegroundOnBrand);
      background-color: var(--colorBrandBackground);
      border-color: var(--colorCompoundBrandStroke);
    }

    .phase-name {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-width: 0;
      grid-column: 2;
      grid-row: 1;
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground2);
      overflow-wrap: anywhere;
    }

    .phase-row.is-current .phase-name {
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .phase-now { font-size: var(--fontSizeBase100); }

    /*
      Stacked layout: name, then bar, then count, all in the content column.
      Without the explicit placement the bar would auto-flow into the 20px
      marker column and shrink to a stub.
    */
    .phase-dist {
      display: flex;
      gap: var(--spacingHorizontalXXS);
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      max-width: var(--phase-dist);
      height: var(--strokeWidthThickest);
      margin-top: var(--spacingVerticalSNudge);
      border-radius: var(--borderRadiusCircular);
      overflow: hidden;
    }

    .phase-seg {
      flex-grow: var(--seg, 1);
      flex-basis: 0;
      min-width: var(--spacingHorizontalXXS);
      border-radius: var(--borderRadiusCircular);
    }

    .phase-seg.is-done { background-color: var(--colorPaletteGreenBorder2); }
    .phase-seg.is-doing { background-color: var(--colorBrandBackground); }
    .phase-seg.is-blocked { background-color: var(--colorPaletteRedBorder2); }
    .phase-seg.is-open { background-color: var(--colorNeutralStroke1); }

    .phase-count {
      grid-column: 2;
      grid-row: 3;
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .phase-count-strong { font-weight: var(--fontWeightSemibold); color: var(--colorNeutralForeground1); }

    /* 20 + 12 + 328 + 16 + 116 + 16 + 132 = 640, the work-column floor. */
    @container work (min-width: 520px) {
      .phase-row {
        grid-template-columns: var(--phase-mark) minmax(0, 1fr) var(--phase-dist) var(--phase-count);
        align-items: center;
        gap: var(--spacingVerticalNone) var(--spacingHorizontalL);
      }
      .phase-name { grid-column: 2; grid-row: 1; }
      .phase-dist { grid-column: 3; grid-row: 1; margin-top: var(--spacingVerticalNone); }
      .phase-count { grid-column: 4; grid-row: 1; text-align: right; }
    }

    /* ====================================================================
       ACTIVITY — the recorded coordinator history as a vertical trail.

       This is the Azure DevOps "History" tab, the Jira "Activity" stream, and
       the VS Code "Timeline" view: the most natural use a lifecycle tool has
       for vertical room, and the reason a desktop window can be tall without
       being empty. It is a real ordered list, most recent first, so a screen
       reader hears "list, 5 items" rather than a wall of divs.

       Read-only by construction: an entry is text and a date. There is no
       author, no avatar, no clock time, and no control. Summaries are written
       for reading; the untruncated recorded text is in Source details.

       LAYOUT CONSTANT
         --trail-gutter 16px   node column. The 10px node centres in it and the
                               2px spine runs at its centre line, so the spine
                               is continuous from node to node.
       ==================================================================== */
    .trail {
      --trail-gutter: 16px;
      --trail-node: 10px;
      display: grid;
      gap: var(--spacingVerticalNone);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .trail li {
      position: relative;
      display: grid;
      grid-template-columns: var(--trail-gutter) minmax(0, 1fr);
      gap: var(--spacingVerticalXXS) var(--spacingHorizontalM);
      padding-bottom: var(--spacingVerticalL);
      min-width: 0;
    }

    .trail li:last-child { padding-bottom: var(--spacingVerticalNone); }

    /* The spine. Decorative rule, so stock Stroke2 is correct here. */
    .trail li:not(:last-child)::after {
      content: "";
      position: absolute;
      top: var(--trail-node);
      bottom: 0;
      left: calc(var(--trail-gutter) / 2 - var(--strokeWidthThin));
      width: var(--strokeWidthThick);
      background-color: var(--colorNeutralStroke2);
    }

    .trail-node {
      grid-row: 1 / span 2;
      position: relative;
      z-index: 1;
      justify-self: center;
      align-self: start;
      width: var(--trail-node);
      height: var(--trail-node);
      margin-top: var(--spacingVerticalXS);
      border-radius: var(--borderRadiusCircular);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThick) solid var(--colorNeutralStrokeAccessible);
    }

    .trail li:first-child .trail-node {
      background-color: var(--colorCompoundBrandStroke);
      border-color: var(--colorCompoundBrandStroke);
    }

    .trail-date {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorNeutralForeground3);
    }

    .trail-text {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground1);
    }

    /*
      A region footer's rule belongs to the region, so it spans the column
      while the caption inside it stays bounded to the prose measure. Putting
      the rule on the caption itself would stop it at 68ch and read as a
      broken divider rather than a closing edge.
    */
    .region-foot {
      margin-top: var(--spacingVerticalM);
      padding-top: var(--spacingVerticalS);
      border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
    }

    /* ====================================================================
       UNAVAILABLE REGION — one shared treatment for every region that has
       nothing true to show, so "we did not read this" never renders as an
       empty container. Dashed edge (shape) + em-dash glyph (shape) + the
       reason in words: no meaning rests on colour.
       ==================================================================== */
    .region-unavailable {
      display: grid;
      grid-template-columns: var(--icon-size-20) minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingVerticalNone) var(--spacingHorizontalM);
      padding: var(--spacingVerticalM) var(--spacingHorizontalL);
      background-color: var(--colorNeutralBackground2);
      border: var(--strokeWidthThin) dashed var(--colorNeutralStrokeAccessible);
      border-radius: var(--borderRadiusMedium);
    }

    .region-unavailable svg {
      width: var(--icon-size-20);
      height: var(--icon-size-20);
      color: var(--colorNeutralForeground3);
    }

    .region-unavailable p {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground2);
    }

    /* ====================================================================
       NOT-READ NOTICE — the composed centre for a feature whose detail was
       never loaded. It replaces what would otherwise be a void with a
       bounded, self-contained explanation: what is missing, why it is
       missing, and the one safe action that already exists in this window.
       It is content-sized. It is deliberately NOT a stretched full-height
       card, and it carries no mutating affordance.
       ==================================================================== */
    .work-region.is-notice {
      padding-block: var(--spacingVerticalXXXL);
      display: grid;
      justify-items: center;
    }

    .notice {
      display: grid;
      gap: var(--spacingVerticalM);
      width: 100%;
      max-width: var(--layout-measure-prose);
      padding: var(--spacingVerticalXL) var(--spacingHorizontalXXL);
      background-color: var(--colorNeutralBackground1);
      border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      border-radius: var(--borderRadiusLarge);
      box-shadow: var(--shadow4);
      min-width: 0;
    }

    .notice-head {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase400);
      line-height: var(--lineHeightBase400);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .notice-head svg {
      flex: 0 0 auto;
      width: var(--icon-size-20);
      height: var(--icon-size-20);
      color: var(--colorNeutralForeground3);
    }

    .notice p {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground2);
    }

    .notice-list {
      display: grid;
      gap: var(--spacingVerticalS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalM) var(--spacingHorizontalNone);
      border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      list-style: none;
    }

    .notice-list li {
      display: grid;
      grid-template-columns: var(--icon-size-16) minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingHorizontalS);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground2);
    }

    .notice-list svg {
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      margin-top: var(--spacingVerticalXS);
      color: var(--colorNeutralForeground3);
    }

    .notice-action {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacingHorizontalS);
    }

    /* ====================================================================
       Details dock — Azure DevOps / Jira properties column.
       Sections are separated by rules and headed by 12px uppercase labels.
       ==================================================================== */
    .dock-section {
      display: grid;
      gap: var(--spacingVerticalS);
      align-content: start;
      padding: var(--spacingVerticalM) var(--spacingHorizontalNone) var(--spacingVerticalM);
      border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
      min-width: 0;
    }

    .props {
      display: grid;
      grid-template-columns: minmax(0, 96px) minmax(0, 1fr);
      gap: var(--spacingVerticalSNudge) var(--spacingHorizontalM);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
    }

    .props dt {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
    }

    .props dd {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .surfaces {
      display: grid;
      gap: var(--spacingVerticalXS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .surfaces li {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
    }

    .surfaces svg { flex: 0 0 auto; width: var(--icon-size-12); height: var(--icon-size-12); }
    .surfaces .is-open { font-weight: var(--fontWeightSemibold); color: var(--colorNeutralForeground1); }
    .surfaces .is-open svg { color: var(--colorBrandForeground1); }

    .surface-when { margin-left: auto; font-size: var(--fontSizeBase100); line-height: var(--lineHeightBase100); }

    /* ---------- Attention ---------- */
    .status-summary {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .status-summary svg {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      color: var(--colorPaletteGreenForeground1);
    }

    .facts {
      display: grid;
      gap: var(--spacingVerticalXS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
      list-style: none;
    }

    .facts li {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .facts svg {
      flex: 0 0 auto;
      width: var(--icon-size-12);
      height: var(--icon-size-12);
      color: var(--colorNeutralForeground3);
    }

    /* ---------- Fluent MessageBar ---------- */
    .attention { display: grid; gap: var(--spacingVerticalS); }

    .fui-messagebar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingHorizontalS);
      padding: var(--spacingVerticalS) var(--spacingHorizontalMNudge);
      border-radius: var(--borderRadiusMedium);
      border: var(--strokeWidthThin) solid transparent;
    }

    .fui-messagebar-icon { display: inline-flex; align-items: center; justify-content: center; }
    .fui-icon { width: var(--icon-size-16); height: var(--icon-size-16); }

    .fui-messagebar-title {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
    }

    .fui-messagebar-text {
      margin: var(--spacingVerticalXXS) var(--spacingHorizontalNone) var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    .fui-messagebar-meta {
      margin: var(--spacingVerticalXS) var(--spacingHorizontalNone) var(--spacingVerticalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
      overflow-wrap: anywhere;
    }

    .fui-messagebar-warning {
      background-color: var(--colorPaletteYellowBackground1);
      border-color: var(--colorPaletteYellowBorder1);
    }
    .fui-messagebar-warning .fui-messagebar-icon { color: var(--colorPaletteYellowForeground1); }

    .fui-messagebar-error {
      background-color: var(--colorPaletteRedBackground1);
      border-color: var(--colorPaletteRedBorder1);
    }
    .fui-messagebar-error .fui-messagebar-icon { color: var(--colorPaletteRedForeground1); }
    .fui-messagebar-error .fui-messagebar-title { color: var(--colorPaletteRedForeground1); }

    .fui-messagebar-info {
      background-color: var(--colorNeutralBackground1);
      border-color: var(--colorNeutralStroke2);
    }
    .fui-messagebar-info .fui-messagebar-icon { color: var(--colorNeutralForeground3); }

    /* ---------- Evidence disclosure ---------- */
    .fui-accordion { display: block; }

    .fui-accordion-header {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalS);
      min-height: var(--button-height-compact);
      padding: var(--spacingVerticalXS) var(--spacingHorizontalNone);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground1);
      border-radius: var(--borderRadiusMedium);
      cursor: pointer;
      list-style: none;
    }

    .fui-accordion-header::-webkit-details-marker { display: none; }

    .fui-chevron {
      flex: 0 0 auto;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      color: var(--colorNeutralForeground3);
      transition: transform var(--durationFaster) ease;
    }

    .fui-accordion[open] > .fui-accordion-header .fui-chevron { transform: rotate(90deg); }

    .evidence-body {
      display: grid;
      gap: var(--spacingVerticalM);
      padding: var(--spacingVerticalXS) var(--spacingHorizontalNone) var(--spacingVerticalS);
    }

    .source-list {
      display: grid;
      gap: var(--spacingVerticalSNudge);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone);
    }

    .source-list dt {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      font-weight: var(--fontWeightSemibold);
      color: var(--colorNeutralForeground3);
    }

    .source-list dd {
      margin: var(--spacingVerticalNone);
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .event {
      display: grid;
      gap: var(--spacingVerticalXS);
      padding-left: var(--spacingHorizontalM);
      border-left: var(--strokeWidthThick) solid var(--colorNeutralStroke1);
    }

    .event-text {
      margin: var(--spacingVerticalNone);
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground1);
    }

    .event-source {
      margin: var(--spacingVerticalNone);
      font-family: var(--fontFamilyMonospace);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground3);
      overflow-wrap: anywhere;
    }

    /*
      Sub-headings inside the one Source details disclosure. Exact task keys
      and the untruncated recorded event text live here, and nowhere else.
    */
    .evidence-label {
      margin: var(--spacingVerticalNone);
      font-size: var(--fontSizeBase100);
      line-height: var(--lineHeightBase100);
      font-weight: var(--fontWeightSemibold);
      text-transform: uppercase;
      letter-spacing: var(--spacingHorizontalXXS);
      color: var(--colorNeutralForeground3);
    }

    .source-events {
      display: grid;
      gap: var(--spacingVerticalS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalNone) var(--spacingVerticalNone) var(--spacingHorizontalL);
    }

    .source-events li {
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground1);
      overflow-wrap: anywhere;
    }

    .source-events .event-date {
      font-family: var(--fontFamilyMonospace);
      color: var(--colorNeutralForeground3);
    }

    /* ====================================================================
       FEATURE LIST — the listbox of the one command-bar Combobox.
       ONE tab stop, one-line options, every option in the DOM.
       ==================================================================== */
    .chooser-count {
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalXXS) var(--spacingHorizontalS);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    /*
      Scroller. FIVE rows are visible, EIGHT on a tall window, and every
      remaining option is one scroll or one keystroke away: all of them are in
      the DOM, so the scrollbar and the filter both describe the whole list.
      Nothing is cut to the first rows.
    */
    .chooser-scroll {
      max-height: calc(var(--chooser-row) * 5);
      overflow-y: auto;
      overscroll-behavior: contain;
      background-color: var(--colorNeutralBackground1);
      border-radius: var(--borderRadiusMedium);
    }

    /*
      A tall window can afford three more rows without pushing anything else
      off screen, so the list takes them.
    */
    @media (min-height: 1000px) {
      .chooser-scroll { max-height: calc(var(--chooser-row) * 8); }
    }

    .chooser-list { margin: var(--spacingVerticalNone); padding: var(--spacingVerticalNone); list-style: none; }

    /*
      One line, one name. A choice in the real projection carries an idea path,
      a slug, and a specification path; the row shows the canonical identifier
      composed from that path — `052-dude-canvas-ui` — and nothing else, so a
      two-line row with a title, a stage badge, and a meta line would be three
      quarters empty chrome. Longer identifiers ellipsize rather than wrap: the
      row height is a contract, and the number that distinguishes them is at
      the start of the string, where truncation never reaches. Stock Fluent
      Option has no divider either: hover and the active edge carry the row.

      THE IDENTIFIER IS ITS OWN ELEMENT, and it has to be.
      The row is a flex container, because a 36px row centres its content with
      align-items. A bare text node inside a flex container is wrapped by the
      engine in an ANONYMOUS flex item, and an anonymous box inherits no
      `text-overflow`: the declaration on the flex root has nothing to act on,
      the item overflows its shrunk-to-fit line, and `overflow: hidden` cuts it
      mid-glyph with no ellipsis. Measured before the fix, at 360 wide, the
      longest identifier overhung the row's content box by 101.5px and was
      clipped through a letter — the row LOOKED truncated but told the reader
      nothing about it. So the visible string lives in `.option-label`, a real
      block-level flex item with `min-width: 0` so it may shrink below its
      content, and the ellipsis belongs to that element alone. The root keeps
      `overflow: hidden` as the clip boundary and no longer claims a
      `text-overflow` it cannot honour.

      The wrapper is presentational only. `role="option"`, `aria-selected`,
      the `data-slug` payload, the row height, and the accessible name are
      unchanged: an option's name is computed from its contents, and the
      contents are still the whole canonical identifier, ellipsis or not.

      MEASURED, at the real inventory's longest identifier
      (`014-autonomous-review-escalation-precedence`, 43 characters), with the
      check slot reserved on every row:
        1440, 1280, 1024, and 720 wide — popup 420px, label box 313.8px,
        0 of 50 rows ellipsized; the longest identifier fits with less than a
        pixel to spare, which is the width this list is sized for.
        360 wide — popup 238.3px, label box 192.3px, 34 of 50 rows ellipsized
        and the longest overhanging by 122px. That is more rows than the 25
        measured before the check slot existed: 16px of glyph plus a 4px gap
        come out of the label, and at 360 the label is what is left. The cost
        is paid only in the narrowest composition, and it is paid at the END
        of the string: the number and the first words survive, the truncation
        is announced by a real ellipsis rather than a severed letter, and the
        full name is in the identity strip the moment the feature is open.
    */
    .option {
      display: flex;
      align-items: center;
      gap: var(--spacingHorizontalXS);
      box-sizing: border-box;
      height: var(--chooser-row);
      padding: var(--spacingVerticalS) var(--spacingHorizontalS);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground1);
      border-radius: var(--borderRadiusMedium);
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
    }

    /*
      THE CHECK SLOT — Fluent Option's own `checkIcon`, reserved on EVERY row.
      Fluent renders that slot for every option in a selectable listbox and
      hides it with `visibility` rather than dropping it, so the labels stay on
      one column and marking a selection never re-flows the list. The same rule
      is what keeps the contract here: the row is still exactly 36px, the
      rhythm of the list is untouched, and the only thing that changes when a
      feature is selected is which check is painted. The cost is horizontal —
      16px of glyph plus a 4px gap — and it is paid identically by all 50 rows.
    */
    .option-check {
      flex: 0 0 auto;
      display: flex;
      width: var(--icon-size-16);
      height: var(--icon-size-16);
      visibility: hidden;
      color: var(--colorBrandForeground1);
    }

    .option-check svg { width: 100%; height: 100%; }

    /*
      The visible canonical identifier. In a real Fluent v9 build this is the
      Option's content slot, which is an element for exactly this reason.
    */
    .option-label {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .option:hover { background-color: var(--colorNeutralBackground1Hover); }

    /*
      SELECTED is not ACTIVE, and the list shows both at once.
        selected  the feature the window is actually showing. It carries
                  aria-selected="true", the check glyph, and the selected fill.
                  Exactly one row can have it, and only a committed selection
                  moves it.
        active    the keyboard highlight, aria-activedescendant, the brand
                  edge. It moves with every arrow key and commits nothing.
      Conflating the two is what the old code did — aria-selected followed the
      highlight — so a screen reader heard "selected" for a row nobody had
      chosen, and the row that WAS chosen was announced as unselected.
      Three independent cues carry selection, so it survives losing colour:
      the check GLYPH, the fill, and the ARIA state. None of them is the fill
      alone.
    */
    .option.is-selected { background-color: var(--colorNeutralBackground1Selected); }
    .option.is-selected .option-check { visibility: visible; }

    /*
      The active option is never colour-only: it carries a brand left edge, a
      background change, and aria-activedescendant.
    */
    .option.is-active {
      background-color: var(--colorNeutralBackground2);
      border-left: var(--strokeWidthThicker) solid var(--colorCompoundBrandStroke);
      padding-left: var(--spacingHorizontalXS);
    }

    /*
      Selected AND active is the ordinary case the instant the list opens with
      a feature already chosen. The row keeps the selected fill and gains the
      active edge; one cue never cancels the other.
    */
    .option.is-selected.is-active { background-color: var(--colorNeutralBackground1Selected); }

    /*
      The one failure this control can report: a request the host refused.
      Fluent MessageBar anatomy at the popup's own scale — an icon and one
      sentence that names BOTH features, so which one is still open is never
      left to inference. It sits above the count band and changes nothing
      below it: the band, the rows, and the 36px rhythm are untouched.
    */
    .chooser-message {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: var(--spacingHorizontalS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalXS) var(--spacingHorizontalS);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorPaletteRedForeground1);
      background-color: var(--colorPaletteRedBackground1);
      border: var(--strokeWidthThin) solid var(--colorPaletteRedBorder1);
      border-radius: var(--borderRadiusMedium);
    }

    .chooser-message[hidden] { display: none; }

    .chooser-message svg {
      width: var(--icon-size-16);
      height: var(--icon-size-16);
    }

    .chooser-empty {
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalS) var(--spacingHorizontalS);
      font-size: var(--fontSizeBase300);
      line-height: var(--lineHeightBase300);
      color: var(--colorNeutralForeground2);
    }

    .steps {
      display: grid;
      gap: var(--spacingVerticalXS);
      margin: var(--spacingVerticalNone);
      padding: var(--spacingVerticalNone) var(--spacingHorizontalNone) var(--spacingVerticalNone) var(--spacingHorizontalXL);
    }

    .steps li {
      max-width: var(--layout-measure-prose);
      font-size: var(--fontSizeBase200);
      line-height: var(--lineHeightBase200);
      color: var(--colorNeutralForeground2);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 1ms !important;
        animation-duration: 1ms !important;
      }
    }
  </style>
</head>

        progressNote: 'Progress is withheld.',
        phases: { unavailable: 'The phase breakdown is withheld rather than guessed: the file that records the phases did not read safely.' },
        activity: { unavailable: 'Recorded history is withheld: no event can be attributed while the owning source is unreadable.' },
        /*
          Withholding four fields at once would otherwise leave the column as a
          list of absences. The same composed close states them together, once,
          and names the one safe action.
        */
        notice: {
          title: 'This feature\u2019s state could not be read',
          lead: 'One feature file did not read safely, so everything derived from it is withheld rather than guessed from the rest of the file.',
          items: [
            'Stage, next step, and current phase',
            'Phase breakdown and task progress',
            'Unanswered questions and blockers',
            'Recorded history'
          ],
          after: 'Nothing is shown in place of those, because a value inferred from a file that did not read safely would not be true.',
          action: {
            label: null,
            note: 'Inspect the feature file, correct it, then use Refresh in the toolbar. The exact file is in Evidence \u2192 Source details. This window only reads project state; nothing on it can change any.'
          }
        },
        attention: {
          summary: null,
          bars: [{ intent: 'error', icon: 'i-error', title: 'Feature state could not be read', text: 'A feature file could not be read safely.', meta: 'Inspect the feature file, correct its frontmatter, then refresh. The exact file is in Evidence \u2192 Source details.' }],
          facts: []
        },
        freshness: { state: 'current', label: 'Read just now', detail: 'The read completed and reported this condition.' },
        props: [
          ['Stage', 'Unavailable'],
          ['Phase', 'Unavailable'],
          ['Questions', 'Unavailable'],
          ['Blockers', 'Unavailable'],
          ['Tasks', 'Unavailable'],
          ['Last read', 'Just now']
        ],
        work: 'Task detail unavailable',
        evidence: {
          rows: [
            ['Idea', '.dude/ideas/052-dude-canvas-ui.md — frontmatter unreadable'],
            ['Diagnostic', 'Frontmatter could not be parsed, so no field was guessed from the rest of the file.'],
            ['Specification', 'Withheld until exactly one owner reads safely']
          ],
          event: null,
          eventNote: 'No lifecycle event can be attributed while the owning source is unreadable.'
        }
      };
    };

    /*
      TRACKING MISMATCH — the bare SC-003 acceptance case, and explicitly NOT a
      blocker. The active work tracker is globally authoritative and holds no
      item for this feature, so the feature stays selected and its definition
      facts stay visible while every execution fact is withheld.
    */
    STATES.mismatch = function () {
      var p = STATES.current();
      p.identity.stage = { text: 'Defined', kind: 'outline', icon: 'i-check' };
      p.identity.trust = VERIFIED_TRUST;
      p.focal = {
        eyebrow: 'Next step',
        headline: 'Next step unavailable',
        detail: 'This feature stays selected and its definition facts stay visible.',
        unavailable: true,
        phase: null,
        why: 'This feature is not available in the active work tracker. Choose another feature, or inspect tracking for this one.',
        command: null
      };
      p.lifecycle = { steps: steps('complete', 'complete', 'unknown', 'unknown'), note: 'The current stage is unavailable while this feature is not available in the active work tracker.' };
      p.progress = null;
      p.progressNote = 'Progress is unavailable. No other feature\u2019s work is attributed here.';
      p.attention = {
        summary: null,
        bars: [
