          { intent: 'warning', icon: 'i-warning', title: 'Not available in the active work tracker', text: 'This feature is not available in the active work tracker.', meta: 'Choose another feature, or inspect tracking for this one.' },
          { intent: 'info', icon: 'i-info', title: 'Not a feature blocker', text: 'This is attention only. No blocker is recorded for this feature.' }
        ],
        facts: ['0 unanswered questions']
      };
      p.props = [
        ['Stage', 'Defined'],
        ['Phase', 'Unavailable'],
        ['Questions', '0 unanswered'],
        ['Blockers', 'None recorded'],
        ['Tasks', 'Unavailable — no other feature\u2019s work is attributed here'],
        ['Last read', 'Just now']
      ];
      p.work = 'Task detail unavailable';
      /*
        Execution facts are withheld, so the phase breakdown goes with them:
        no other feature's work may be attributed here. Definition facts stay
        visible, and recorded history is a definition fact, so the trail stays.
      */
      p.phases = { unavailable: 'The phase breakdown is unavailable while this feature is not available in the active work tracker. No other feature\u2019s work is attributed here.' };
      p.activity = ACTIVITY_LIVE;
      p.evidence = { rows: TRACKED_SOURCES, event: LATEST_EVENT, eventNote: null, phaseKeys: null, history: ACTIVITY, historyTotal: ACTIVITY_TOTAL };
      return p;
    };

    /*
      CHOOSER — no feature is selected, nothing is preselected, and no recency,
      chronology, or lifecycle-number inference is made. The list itself lives
      in the command bar; this projection describes the state and the list, and
      renders no control of its own.
    */
    STATES.chooser = function () {
      return {
        mode: 'chooser',
        identity: null,
        trust: VERIFIED_TRUST,
        stageWord: 'No feature selected',
        focal: null,
        lifecycle: { unavailable: 'No feature is selected, so there is no lifecycle to show. Opening a feature shows where it stands.' },
        progress: null,
        progressNote: null,
        /*
          Both regions are still declared, compactly, so the window composes
          the same way in every fixture and so the reason nothing is broken
          down here is stated rather than implied.
        */
        phases: { unavailable: 'No feature is selected, so there is no phase breakdown to show. Open a feature to see its phases.' },
        activity: { unavailable: 'No feature is selected, so there is no recorded history to show.' },
        notice: null,
        attention: null,
        instruction: {
          title: 'Select a feature',
          lead: 'The feature list is the Feature box in the command bar at the top of this window. It is the only place a feature is chosen.',
          steps: [
            'Click the Feature box, or Tab to it: the list opens on the first click, already showing options.',
            'Scroll the list to reach any of the ' + CHOICES.length + ' features, or type any part of a number or name to narrow it — 052 and dude both find 052-dude-canvas-ui.',
            'Arrow keys move the highlight; Home and End jump to the ends of the list.',
            'Enter opens the highlighted feature. Escape clears the search, then closes the list.'
          ],
          facts: [
            ['In the list', CHOICES.length + ' features, out of ' + IDEAS.length + ' recorded idea files'],
            ['Not in the list', (IDEAS.length - CHOICES.length) + ' resolved ideas with no active feature package'],
            ['Order', 'The order the idea files are read. Nothing is promoted by recency, number, or last use.'],
            ['Each row shows', 'The feature\u2019s canonical identifier, number and name, exactly as it is filed'],
            ['Once a feature is open', 'The same box shows that feature\u2019s identifier and still opens the whole list. The open feature is the ticked row, and what is displayed is never treated as something you typed.']
          ]
        },
        freshness: { state: 'current', label: 'Read just now', detail: 'The feature list was read completely.' },
        props: [['Features', CHOICES.length + ' available'], ['Selected', 'None'], ['Last read', 'Just now']],
        work: CHOICES.length + ' features to choose from',
        evidence: {
          rows: [
            ['Features', CHOICES.length + ' selectable, from ' + IDEAS.length + ' idea files read'],
            ['Each choice carries', 'An exact idea path, a slug, and a specification path where one is recorded'],
            ['Displayed', 'The canonical identifier, number and name, composed from the idea path. No title, stage, or task state is read for a feature that is not open.'],
            ['Submitted', 'The slug from the chosen record. The displayed identifier is never parsed back into a target.'],
            ['Paths', 'Exact idea and specification paths are shown under the selected feature\u2019s Source details.'],
            ['Selection', 'No exact target was supplied and more than one feature is active, so a chooser is shown instead of a guess.']
          ],
          event: null,
          eventNote: 'No feature is selected, so no lifecycle event is attributed.'
        }
      };
    };

    /*
      ANOTHER FEATURE SELECTED — frontmatter only.
      Its task state was never loaded, so nothing beyond title, slug, status,
      and exact paths is shown or implied.
    */
    function frontmatterProjection(f) {
      var stage = stageWord(f);
      var st = f.status === 'draft'
        ? steps('current', 'todo', 'todo', 'todo')
        : f.status === 'resolved'
          ? steps('complete', 'unknown', 'unknown', 'complete')
          : steps('complete', 'complete', 'unknown', 'unknown');
      var rows = [
        ['Idea', f.idea],
        ['Recorded status', f.status],
        ['Specification', f.spec ? f.spec : 'No specification path is recorded in this feature\u2019s frontmatter'],
        ['Tasks', 'Not loaded for this feature in this preview']
      ];
      return {
        mode: 'feature',
        identity: {
          title: f.title,
          key: featureKey(f),
          note: null,
          stage: { text: stage, kind: 'outline', icon: f.status === 'draft' ? 'i-circle' : 'i-check' },
          trust: VERIFIED_TRUST
        },
        focal: {
          eyebrow: 'Next step',
          headline: 'Next step unavailable',
          detail: null,
          unavailable: true,
          phase: null,
          why: 'Step detail for this feature was not read, so nothing is shown in its place.',
          command: null
        },
        lifecycle: { steps: st, note: 'Only the recorded status is known for this feature.' },
        progress: null,
        progressNote: 'Progress was not read for this feature.',
        phases: { unavailable: 'The phase breakdown was not read for this feature in this preview, so none is shown.' },
        activity: { unavailable: 'Recorded history was not read for this feature in this preview, so none is shown.' },
        /*
          THE COMPOSED NOT-READ CENTRE.
          Selecting a feature whose detail was never loaded used to leave the
          work column with a headline, a partial lifecycle, and a void. This
          block closes the column honestly: it names exactly what is missing,
          says why in one sentence, and offers the single safe action this
          read-only window already has — reopening the feature list. It reads
          as a finished region, not as an absence.
        */
        notice: {
          title: 'Only this feature\u2019s recorded identity was read',
          lead: 'This preview read the title, identifier, and recorded status of ' + f.title + ', and stopped there. Its own detail was never loaded.',
          items: [
            'Next step and current phase',
            'Phase breakdown and task progress',
            'Unanswered questions and blockers',
            'Recorded history'
          ],
          after: 'Nothing is shown in place of those, because inferring them from a file that was not read would not be true.',
          action: {
            label: 'Return to the feature list',
            note: 'Drops this target and reopens the list in the command bar. This window only reads project state; nothing on it can change any.'
          }
        },
        attention: {
          summary: null,
          bars: [],
          facts: ['Questions and blockers were not read for this feature']
        },
        freshness: { state: 'current', label: 'Read just now', detail: 'Recorded title, slug, status, and paths were read.' },
        props: [
          ['Stage', stage],
          ['Phase', 'Not read for this feature'],
          ['Questions', 'Not read for this feature'],
          ['Blockers', 'Not read for this feature'],
          ['Tasks', 'Not read for this feature'],
          ['Last read', 'Just now']
        ],
        work: 'Task detail not read for this feature',
        evidence: { rows: rows, event: null, eventNote: 'No lifecycle event was read for this feature.' }
      };
    }

    /* ---------------------------------------------------------------- */
    /* Rendering helpers                                                 */
    /* ---------------------------------------------------------------- */
    function esc(value) {
      return String(value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function icon(id, cls) {
      return '<svg class="' + cls + '" aria-hidden="true" focusable="false"><use href="#' + id + '"><\/use><\/svg>';
    }

    var STEP_WORD = { complete: 'Complete', current: 'Current', todo: 'Not started', unknown: 'Unavailable' };

    function stepper(list) {
      var items = list.map(function (s, i) {
        var glyph = s.state === 'complete' ? icon('i-check', 'fui-step-glyph')
          : s.state === 'unknown' ? icon('i-dash', 'fui-step-glyph')
          : String(i + 1);
        return '<li class="fui-step is-' + s.state + '"' + (s.state === 'current' ? ' aria-current="step"' : '') + '>' +
          '<span class="fui-step-badge" aria-hidden="true">' + glyph + '<\/span>' +
          '<span class="fui-step-label">' + esc(s.label) +
            '<span class="fui-step-state">' + STEP_WORD[s.state] + '<\/span>' +
          '<\/span><\/li>';
      }).join('');
      return '<ol class="fui-stepper">' + items + '<\/ol>';
    }

    function meter(p) {
      var legend =
        '<li class="is-done">' + icon('i-check', '') + '<span class="legend-count">' + p.done + '<\/span> done<\/li>' +
        '<li class="is-doing">' + icon('i-half', '') + '<span class="legend-count">' + p.doing + '<\/span> in progress<\/li>' +
        '<li class="is-blocked">' + icon('i-error', '') + '<span class="legend-count">' + p.blocked + '<\/span> blocked<\/li>' +
        '<li class="is-open">' + icon('i-circle', '') + '<span class="legend-count">' + p.open + '<\/span> open<\/li>';
      return '<div class="meter-row">' +
        '<div class="meter" aria-hidden="true">' +
          (p.done ? '<span class="meter-seg is-done" style="--seg:' + p.done + '"><\/span>' : '') +
          (p.doing ? '<span class="meter-seg is-doing" style="--seg:' + p.doing + '"><\/span>' : '') +
          (p.blocked ? '<span class="meter-seg is-blocked" style="--seg:' + p.blocked + '"><\/span>' : '') +
          (p.open ? '<span class="meter-seg is-open" style="--seg:' + p.open + '"><\/span>' : '') +
        '<\/div>' +
        '<ul class="legend">' + legend + '<\/ul>' +
      '<\/div>' +
      '<p class="caption">' + esc(p.lede) + '<\/p>';
    }

    /* ---------------------------------------------------------------- */
    /* FEATURE COMBOBOX — the one selection surface, one tab stop        */
    /* ---------------------------------------------------------------- */
    /*
      WHAT CHANGED, AND WHY — the reported selected-state defect
        The revised shell put the real Combobox in the command bar and opened
        it on the first click, which fixed the duplicate control and the
        two-click list. It then hid that control the moment a feature WAS
        selected, and the built host went the other way: it kept a field whose
        VALUE was the selected identifier and fed that same value to the
        filter. Pressing the chevron with `052-dude-canvas-ui` selected
        therefore opened a list of exactly one option — the one already
        selected — and the only way to see the other 49 was to delete a name
        the user had never typed.

        Both halves are fixed here, and they are one fix:
          - The control exists whenever there is an inventory to open, whether
            a feature is selected or not. Only the empty projection, which has
            zero features, still shows the inert chip.
          - THE SELECTED VALUE AND THE QUERY ARE TWO DIFFERENT THINGS. The
            field displays the committed identifier; the filter is driven by
            `query`, which is null until the user actually types. Opening
            filters nothing, so the first click always shows all 50 options
            with the selected one marked and scrolled into view.

      SHAPE
        Fluent v9 <Combobox freeform inlinePopup> with `selectedOptions` and a
        `value` the app controls — the same split Fluent's own filtering
        example uses, where `onOptionSelect` sets the display value and
        `onChange` sets the search string. The input is the only tabbable node;
        the listbox is navigated with aria-activedescendant, so 50 options
        never become 50 tab stops. The popup is inline in the DOM tree next to
        its own control, which is what the host embeds cleanly. No portal, no
        dialog, no focus trap, and no second copy anywhere on the page.

      EVERY OPTION IS REALLY THERE
        All 50 options are rendered into the listbox. The scroller shows five
        of them (eight on a tall window) and the rest are one scroll or one
        keystroke away. Nothing slices the list to the first rows, so the
        scrollbar, the arrow keys, End, and the filter all describe the same
        complete set of 50 — and so does opening the list on a feature that is
        already selected.

      ONE NAME ON SCREEN, ONE NAME ON THE WIRE
        A row is labelled with the canonical identifier — `052-dude-canvas-ui`
        — so the list names features the same way the rest of the window and
        the repository do, and the closed field displays that same string for
        the selected feature. The record's slug is what selection submits. The
        filter accepts either form, so the number and the name are both
        typable, and neither identity is guessed from the other.

      NOTHING IS COMMITTED THAT DID NOT HAPPEN
        A selection is committed only when the handler accepts it. A refused
        request leaves `committed` exactly where it was, puts the previous
        identifier back in the field, re-marks the previous row, and says in
        one sentence which feature is still open. An abandoned search — Escape,
        blur, an outside click — is discarded the same way. The field can never
        be left displaying a value the window is not actually showing.
    */
    var chooser = (function () {
      var ROW = 36;                       /* --chooser-row, as a number */

      var root = document.getElementById('feature-chooser');
      var identity = document.getElementById('feature-identity');
      var combobox = document.getElementById('feature-combobox');
      var input = document.getElementById('feature-input');
      var surface = document.getElementById('feature-surface');
      var scroll = document.getElementById('feature-scroll');
      var listbox = document.getElementById('feature-listbox');
      var count = document.getElementById('feature-count');
      var empty = document.getElementById('feature-empty');
      var message = document.getElementById('feature-message');

      /*
        FIVE PIECES OF STATE, AND THE FIRST TWO ARE NOT THE SAME PIECE.
          committed      the record the window is actually showing. It owns the
                         closed display value and the one row that carries
                         aria-selected. Only an accepted selection changes it.
          query          null while the user is NOT filtering — which is every
                         moment until they type — and a string once they are.
                         A null query means NO FILTER, so the list opens whole
                         even though the field is displaying a value. This one
                         distinction is the whole of the reported defect.
          active         the keyboard highlight and aria-activedescendant. It
                         starts on the committed row when there is one, and it
                         commits nothing by moving.
          selectedIndex  where `committed` sits in the CURRENT filtered list,
                         or -1 when the filter happens to exclude it. The
                         selection survives a filter that hides it.
          choices        the inventory this projection actually offers.
      */
      var choices = CHOICES.slice();
      var committed = null;
      var query = null;
      var active = -1;
      var selectedIndex = -1;
      var filtered = choices.slice();
      var reopenBlocked = false;
      var onSelect = null;

      input.placeholder = 'Choose from ' + choices.length + ' features';

      function isOpen() { return !surface.hidden; }
      function isFiltering() { return query !== null; }
      function needle() { return query === null ? '' : query.trim().toLowerCase(); }
      function committedLabel() { return committed ? featureKey(committed) : ''; }

      /* The closed field shows the committed identifier, never a leftover search. */
      function showCommitted() { input.value = committedLabel(); }

      function indexIn(list, record) {
        if (!record) { return -1; }
        for (var i = 0; i < list.length; i += 1) {
          if (list[i].slug === record.slug) { return i; }
        }
        return -1;
      }

      /*
        Selecting the displayed text on open is the other half of "the value is
        not the query": the identifier is visible, so the user can read what is
        selected, and it is highlighted, so the next character REPLACES it
        instead of appending to it. Nothing is deleted for the user, and
        nothing has to be deleted by them.
      */
      function selectAll() {
        window.setTimeout(function () {
          if (document.activeElement !== input) { return; }
          try { input.setSelectionRange(0, input.value.length); } catch (error) { /* not selectable */ }
        }, 0);
      }

      /*
        THE VISIBLE LABEL IS THE CANONICAL IDENTIFIER.
        featureKey() composes it from the number and slug that the exact idea
        path already carries — `052-dude-canvas-ui` — so the row reads as the
        thing that exists on disk. It is never the raw full path: a listbox row
        is not a file browser, and `.dude/ideas/052-dude-canvas-ui.md` would
        spend the whole row on a prefix that is identical for all 50 options.
        The semantic slug still travels with the record and is what selection
        submits; the label is identity, not payload.
        In Fluent v9 this is <Option value={choice.slug} text={featureKey(f)}>:
        `text` is the typeahead and accessible-name string, `value` is what
        onOptionSelect hands back. Nothing here reads the visible string back
        out to resolve a target.

        The identifier is emitted inside `.option-label`, not as a bare text
        node: the row is a flex container, and a bare text node there becomes
        an anonymous flex item that `text-overflow` cannot reach, so overflow
        would be cut mid-glyph instead of ellipsized. The span is
        presentational — role, aria-selected, data-slug, the 36px row, and the
        contents-computed accessible name are all unaffected. Fluent's own
        Option renders its content slot as an element for the same reason.

        The check span in front of it is Fluent's `checkIcon` slot. It is
        rendered on every row and hidden with `visibility`, so the label column
        never moves and the accessible name never changes: the span is
        aria-hidden, and an option's name is still computed from the identifier
        alone. aria-selected marks the COMMITTED row, and only that row —
        aria-activedescendant is what says where the highlight is.
      */
      function optionHtml(choice, index) {
        var on = index === active;
        var chosen = index === selectedIndex;
        return '<li class="option' + (on ? ' is-active' : '') + (chosen ? ' is-selected' : '') + '"' +
            ' id="feature-opt-' + index + '" role="option"' +
            ' aria-selected="' + (chosen ? 'true' : 'false') + '" data-index="' + index + '"' +
            ' data-slug="' + esc(choice.slug) + '">' +
          '<span class="option-check" aria-hidden="true">' + icon('i-check', '') + '<\/span>' +
          '<span class="option-label">' + esc(featureKey(choice)) + '<\/span>' +
        '<\/li>';
      }

      function paint() {
        var html = '';
        for (var i = 0; i < filtered.length; i += 1) { html += optionHtml(filtered[i], i); }
        listbox.innerHTML = html;

        empty.hidden = filtered.length !== 0;
        if (!filtered.length) { empty.textContent = 'No features match ' + JSON.stringify(query) + '.'; }
        scroll.hidden = filtered.length === 0;

        input.setAttribute('aria-activedescendant', active >= 0 ? 'feature-opt-' + active : '');
      }

      /*
        The count band describes the LIST, and — when there is one — names the
        selection separately from the search. Reading "50 features.
        052-dude-canvas-ui is selected." is the plainest possible statement
        that the displayed value did not narrow anything, and while a search is
        running "stays selected" says the same thing the other way round.
      */
      function updateCount() {
        var selected = committedLabel();
        if (!needle()) {
          count.textContent = choices.length + ' features.' +
            (selected ? ' ' + selected + ' is selected.' : '') +
            ' Scroll or type to narrow them.';
          return;
        }
        count.textContent = filtered.length + ' of ' + choices.length +
          ' features match ' + JSON.stringify(query) + '.' +
          (selected ? ' ' + selected + ' stays selected.' : '');
      }

      /*
        TYPING MATCHES BOTH FORMS OF THE SAME NAME, case-insensitively:
        the canonical identifier that is on screen (`052-dude-canvas-ui`) and
        the semantic slug inside it (`dude-canvas-ui`). So `052` narrows by
        number, `dude` narrows by word, and the exact slug still finds its one
        row. Matching the visible string alone would silently break every
        habit built on typing the slug; matching the slug alone would make the
        number on screen untypable. Substring, not prefix or fuzzy: no ranking
        is introduced, and source order survives filtering.

        An EMPTY needle is not a filter. That is why opening on a selected
        feature shows 50 rows: `query` is null, the needle is empty, and the
        committed identifier sitting in the field is display, not input.
      */
      function refilter() {
        var find = needle();
        filtered = !find ? choices.slice() : choices.filter(function (choice) {
          return featureKey(choice).toLowerCase().indexOf(find) !== -1 ||
            choice.slug.toLowerCase().indexOf(find) !== -1;
        });
        selectedIndex = indexIn(filtered, committed);
        /*
          Opening without typing starts the highlight ON the committed row, the
          way Fluent seeds activeOption from selectedOptions, so the first
          ArrowDown steps from where the user already is and the selected row
          is what gets scrolled into view. Typing starts a new search, so
          nothing is highlighted until the user moves. With nothing committed,
          nothing is highlighted either: the chooser still preselects nothing.
          A CLOSED control has no active option at all — aria-activedescendant
          must not name a row while there is no popup to point into.
        */
        active = (isOpen() && !isFiltering()) ? selectedIndex : -1;
        paint();
        updateCount();
        if (active >= 0) { ensureVisible(); } else { scroll.scrollTop = 0; }
        if (isOpen()) { syncKeysHint(); }
      }

      /*
        Every row is the same height and every row is rendered, so the exact
        arithmetic is enough and no scrollIntoView is needed — which also means
        highlighting an option, or revealing the selected one, can never scroll
        the page behind the window.
      */
      function ensureVisible() {
        var top = active * ROW;
        var bottom = top + ROW;
        var view = scroll.clientHeight;
        if (top < scroll.scrollTop) { scroll.scrollTop = top; }
        else if (bottom > scroll.scrollTop + view) { scroll.scrollTop = bottom - view; }
      }

      function setActive(index) {
        if (!filtered.length) { return; }
        if (index < 0) { index = 0; }
        if (index > filtered.length - 1) { index = filtered.length - 1; }
        active = index;
        paint();
        ensureVisible();
      }

      function move(delta) {
        if (!isOpen()) { open(); }
        if (!filtered.length) { return; }
        if (active < 0) { setActive(delta > 0 ? 0 : filtered.length - 1); return; }
        setActive(active + delta);
      }

      /* A page is however many rows are actually visible: five, or eight tall. */
      function pageSize() { return Math.max(1, Math.round(scroll.clientHeight / ROW)); }

      /*
        OPENING NEVER FILTERS. The committed identifier is displayed, not
        typed, so it is not a query: `query` is set to null, the needle is
        empty, and all 50 options are painted with the committed row marked,
        active, and scrolled into view. This is the one line the built host got
        wrong, and it is the one the review asked for.
      */
      function open() {
        if (root.hidden || isOpen()) { return; }
        surface.hidden = false;
        input.setAttribute('aria-expanded', 'true');
        query = null;
        showCommitted();
        refilter();
        syncKeysHint();
      }

      /*
        Closing discards an unfinished search rather than promoting it: the
        field goes back to the committed identifier, so a half-typed string can
        never sit in the bar looking like the feature that is open.
      */
      function close() {
        if (!isOpen()) { return; }
        surface.hidden = true;
        input.setAttribute('aria-expanded', 'false');
        query = null;
        showCommitted();
        refilter();                       /* whole list restored, nothing active */
        syncKeysHint();
      }

      function clearFailure() {
        if (message.hidden) { return; }
        message.hidden = true;
        message.innerHTML = '';
        input.removeAttribute('aria-invalid');
      }

      /*
        A REFUSED SELECTION IS NOT A SELECTION. Nothing about `committed` was
        touched, so the field is already showing the feature that is genuinely
        open; the sentence names the refused one and the kept one, the boundary
        turns, aria-invalid is set, and the list comes back with the kept row
        still marked so the next attempt starts from the truth.
      */
      function showFailure(picked) {
        var kept = committedLabel();
        var text = esc(featureKey(picked)) + ' could not be opened. ' +
          (kept ? esc(kept) + ' is still the open feature.' : 'No feature is open.');
        message.innerHTML = '<span aria-hidden="true">' + icon('i-warning', '') + '<\/span>' +
          '<span>' + text + '<\/span>';
        message.hidden = false;
        input.setAttribute('aria-invalid', 'true');
        announce(featureKey(picked) + ' could not be opened. ' +
          (kept ? kept + ' is still the open feature.' : 'No feature is open.'));
      }

      /*
        The handler answers. `false` means the host refused the request, so
        nothing was opened and nothing may look opened. Anything else is an
        acceptance, and by the time it returns the projection has already been
        replaced and setProjection has committed the new value.
      */
      function choose(index, viaKeyboard) {
        var picked = filtered[index];
        if (!picked || !onSelect) { return; }
        clearFailure();
        close();
        if (onSelect(picked, viaKeyboard) === false) {
          showFailure(picked);
          reopenBlocked = false;
          input.focus();
          open();
        }
      }

      /*
        ONE CLICK. Pointer interaction anywhere on the control — the field, the
        label side, or the expand chevron — opens the list and never toggles it
        shut, so the first click always ends with the whole list on screen.
        Escape, an outside click, and choosing are what close it.
      */
      combobox.addEventListener('mousedown', function (event) {
        if (event.target !== input) { event.preventDefault(); }
        reopenBlocked = false;
        clearFailure();
        input.focus();
        open();
        selectAll();
      });

      /* Tabbing in opens it too: focus and click behave the same way. */
      input.addEventListener('focus', function () {
        if (reopenBlocked) { return; }
        open();
        selectAll();
      });

      /*
        Focus left the control. An unfinished search is not a selection, so the
        field goes back to the committed identifier instead of sitting there
        looking like a value somebody chose.
      */
      input.addEventListener('blur', function () {
        reopenBlocked = false;
        if (isOpen()) { close(); return; }
        if (isFiltering()) { query = null; showCommitted(); refilter(); }
      });

      /*
        The user's own text always wins. open() restores the committed label by
        design, so the typed string is captured first and written back after —
        otherwise typing into a closed field would erase the character that
        opened it.
      */
      input.addEventListener('input', function () {
        var typed = input.value;
        reopenBlocked = false;
        clearFailure();
        if (!isOpen()) { open(); }
        input.value = typed;
        query = typed;
        refilter();
      });

      /* A printable key, with no modifier that would make it a shortcut. */
      function isTypingKey(event) {
        return event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey;
      }

      input.addEventListener('keydown', function (event) {
        /*
          THE FIRST KEYSTROKE STARTS A SEARCH; IT DOES NOT EDIT THE SELECTION.
          The field may be displaying a committed identifier. Typing over it —
          with the text selected or with a caret parked mid-string — clears the
          display and begins a fresh filter, so nobody has to delete 19
          characters of a name they never typed in order to search for another
          one. Backspace and Delete mean the same thing here: drop the
          displayed value and show the whole list, not chip a letter off an
          identifier that is not a query.
        */
        if (!isFiltering() && (isTypingKey(event) || event.key === 'Backspace' || event.key === 'Delete')) {
          reopenBlocked = false;
          clearFailure();
          open();
          input.value = '';
          query = '';
          if (event.key === 'Backspace' || event.key === 'Delete') {
            event.preventDefault();
            refilter();
            return;
          }
          /* A printable key falls through: the browser inserts it into the now
             empty field and the `input` handler above sets the query. */
        }

        if (event.key === 'ArrowDown') { event.preventDefault(); reopenBlocked = false; move(1); return; }
        if (event.key === 'ArrowUp') { event.preventDefault(); reopenBlocked = false; move(-1); return; }
        if (event.key === 'PageDown') { event.preventDefault(); move(pageSize()); return; }
        if (event.key === 'PageUp') { event.preventDefault(); move(-pageSize()); return; }
        if (event.key === 'Home') { event.preventDefault(); open(); setActive(0); return; }
        if (event.key === 'End') { event.preventDefault(); open(); setActive(filtered.length - 1); return; }
        if (event.key === 'Enter') {
          event.preventDefault();
          if (active < 0) {
            announce('Use the arrow keys to highlight a feature, then press Enter to open it.');
            return;
          }
          choose(active, true);
          return;
        }
        /*
          Escape has two steps, and the first one is a RESTORE, not a wipe.
            filtering  the search is discarded, the committed identifier comes
                       back into the field, the whole list comes back with that
                       row marked and highlighted, and the popup stays open.
            not        the popup closes and the selection is untouched.
          Focus stays on the control either way, and the list does not spring
          straight back open: nothing is trapped and nothing is fought over.
        */
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopPropagation();
          clearFailure();
          if (isFiltering()) {
            query = null;
            showCommitted();
            refilter();
            selectAll();
            announce(committed
              ? 'Search cleared. ' + choices.length + ' features. ' + committedLabel() + ' is still selected.'
              : 'Search cleared. ' + choices.length + ' features.');
            return;
          }
          if (isOpen()) {
            close();
            reopenBlocked = true;
            announce(committed
              ? 'Feature list closed. ' + committedLabel() + ' is still selected.'
              : 'Feature list closed.');
          }
        }
      });

      listbox.addEventListener('mousedown', function (event) {
        /* Keep focus on the single tab stop instead of blurring to the list. */
        event.preventDefault();
      });

      listbox.addEventListener('click', function (event) {
        var node = event.target.closest ? event.target.closest('[data-index]') : null;
        if (!node) { return; }
        choose(Number(node.getAttribute('data-index')), false);
      });

      document.addEventListener('click', function (event) {
        if (!isOpen()) { return; }
        /*
          A NODE THIS CONTROL ITSELF REPLACED IS NOT AN OUTSIDE CLICK.
          Choosing an option repaints the listbox, so the row that was clicked
          is already detached from the document by the time this document-level
          listener runs, and `contains` can no longer recognise it as ours.
          Without this guard the refusal path closed itself: the option handler
          reopened the list with the kept feature marked, and one event later
          the very click that caused it was mistaken for a click outside and
          closed it again — taking the failure sentence, which lives inside the
          popup, off screen with it. Measured: the refusal reported itself only
          through the live region and the red boundary, and the list the user
          was told to try again in was gone.
        */
        if (event.target && event.target.isConnected === false) { return; }
        if (root.contains(event.target)) { return; }
        close();
      });

      paint();
      updateCount();

      return {
        isOpen: isOpen,
        isFiltering: isFiltering,
        focus: function () { input.focus(); },
        open: open,
        close: close,
        contains: function (node) { return root.contains(node) || identity.contains(node); },
        onSelect: function (handler) { onSelect = handler; },
        /*
          The command bar never re-renders, so the context slot is updated here
          rather than rebuilt. The fork is INVENTORY: the control whenever the
          projection offers features to choose from — selected or not — and the
          inert chip only when it offers none at all.

          `selected` is the record the projection resolved, so the field and
          the marked row are set from the projection rather than from whatever
          the user last clicked. A search that is still in flight survives a
          background re-render; a finished one does not exist any more.
        */
        setProjection: function (inventory, selected, chipLabel) {
          var live = query;
          root.hidden = !inventory.length;
          identity.hidden = !!inventory.length;
          document.getElementById('feature-name').textContent = chipLabel;
          clearFailure();

          if (!inventory.length) {
            /*
              A projection with no choices has no list, so the mock empties it
              rather than parking 50 hidden options in the tree — which is what
              React does when the Combobox is simply not rendered.
            */
            close();
            choices = [];
            filtered = [];
            committed = null;
            query = null;
            active = -1;
            selectedIndex = -1;
            input.value = '';
            listbox.innerHTML = '';
            count.textContent = '';
            empty.hidden = true;
            return;
          }

          choices = inventory.slice();
          input.placeholder = 'Choose from ' + choices.length + ' features';
          committed = selected || null;
          query = live;
          if (!isFiltering()) { showCommitted(); }
          refilter();
        }
      };
    }());

    /* ---------------------------------------------------------------- */
    /* Work surface — breadcrumb, identity, NEXT STEP, lifecycle         */
    /* ---------------------------------------------------------------- */
    function crumbsHtml(p) {
      var leaf = p.mode === 'chooser' ? 'Choose a feature'
        : p.mode === 'empty' ? 'Nothing found'
        : (p.identity ? p.identity.title : 'Feature');
      var trail = ['Dude', 'Features', leaf, 'Now'];
      var html = trail.map(function (part, i) {
        var last = i === trail.length - 1;
        return '<li' + (last ? ' aria-current="page"' : '') + '>' +
          (i ? icon('i-chevron', '') : '') +
          '<span class="crumb-text">' + esc(part) + '<\/span>' +
        '<\/li>';
      }).join('');
      return '<div class="work-strip">' +
        '<nav aria-label="Breadcrumb"><ol class="crumbs">' + html + '<\/ol><\/nav>' +
      '<\/div>';
    }

    function identityHtml(p) {
      if (p.mode === 'chooser') {
        return '<div class="work-identity">' +
          '<h2 class="work-title" id="work-feature-title" tabindex="-1">Choose a feature<\/h2>' +
          '<span class="fui-badge fui-badge-outline">' + icon('i-search', 'fui-badge-glyph') + 'Nothing selected<\/span>' +
          '<p class="work-note">No feature was supplied and more than one is active, so nothing is selected until you choose one.<\/p>' +
        '<\/div>';
      }
      if (!p.identity) {
        return '<div class="work-identity">' +
          '<h2 class="work-title" id="work-feature-title" tabindex="-1">No features found<\/h2>' +
          '<span class="fui-badge fui-badge-outline">' + icon('i-dash', 'fui-badge-glyph') + 'Nothing to show<\/span>' +
        '<\/div>';
      }
      var id = p.identity;
      return '<div class="work-identity">' +
        '<h2 class="work-title" id="work-feature-title" tabindex="-1">' + esc(id.title) + '<\/h2>' +
        '<span class="fui-badge fui-badge-' + id.stage.kind + '">' + icon(id.stage.icon, 'fui-badge-glyph') + esc(id.stage.text) + '<\/span>' +
        '<span class="work-id">' + esc(id.key) + '<\/span>' +
        (id.note ? '<p class="work-note">' + esc(id.note) + '<\/p>' : '') +
      '<\/div>';
    }

    function focalHtml(p) {
      /*
        NO SECOND SELECTOR. The chooser projection used to render its own copy
        of the feature Combobox here, under a "Select a feature" heading, while
        the command bar carried another one. The window now states the fact —
        nothing is selected, and the list is in the command bar — and leaves
        the one control where global context belongs. Nothing in this region
        is interactive.
      */
      if (p.mode === 'chooser') { return ''; }

      var f = p.focal;
      var facts = '';
      if (f.phase) {
        facts += '<div class="focal-fact"><p class="fact-label">Current phase<\/p>' +
          '<p class="fact-value">' + esc(f.phase) + '<\/p><\/div>';
      }
      if (f.why) {
        facts += '<div class="focal-fact"><p class="fact-label">Why<\/p>' +
          '<p class="fact-value">' + esc(f.why) + '<\/p><\/div>';
      }
      var command = f.command
        ? '<div class="focal-command">' +
            '<code>' + esc(f.command.text) + '<\/code>' +
            '<button type="button" class="fui-button fui-button-secondary" data-action="copy" data-copy="' + esc(f.command.text) + '">' +
              icon('i-copy', 'fui-button-icon') + 'Copy command<\/button>' +
          '<\/div>' +
          '<p class="caption">' + esc(f.command.note) + '<\/p>'
        : '';

      return '<section class="work-region" aria-labelledby="work-next-h">' +
        '<div class="focal' + (f.unavailable ? ' is-unavailable' : '') + '">' +
          '<h3 class="focal-eyebrow" id="work-next-h">' + icon(f.unavailable ? 'i-dash' : 'i-arrow', '') + '<span>' + esc(f.eyebrow) + '<\/span><\/h3>' +
          '<p class="focal-headline">' + esc(f.headline) + '<\/p>' +
          (f.detail ? '<p class="focal-detail">' + esc(f.detail) + '<\/p>' : '') +
          command +
          (facts ? '<div class="focal-facts">' + facts + '<\/div>' : '') +
        '<\/div>' +
      '<\/section>';
    }

    function lifecycleHtml(p) {
      if (!p.lifecycle) { return ''; }
      var head = '<div class="region-head"><h3 class="region-title" id="work-life-h">Lifecycle<\/h3><\/div>';
      /* Same shared dashed treatment as Phases and Activity: a declared region
         with nothing true to show is composed, never dropped. */
      if (p.lifecycle.unavailable) {
        return '<section class="work-region" aria-labelledby="work-life-h">' + head +
          unavailableHtml(p.lifecycle.unavailable) + '<\/section>';
      }
      return '<section class="work-region" aria-labelledby="work-life-h">' + head +
        (p.lifecycle.note ? '<p class="caption">' + esc(p.lifecycle.note) + '<\/p>' : '') +
        stepper(p.lifecycle.steps) +
        (p.progress ? meter(p.progress) : '') +
        (p.progressNote ? '<p class="caption">' + esc(p.progressNote) + '<\/p>' : '') +
      '<\/section>';
    }

    /*
      The chooser state's whole centre: where the one control is, how it
      behaves, and what is actually in it. Prose, an ordered list, and
      label/value facts — no control, no option row, no second list.
      The facts exist because "why is my feature not at the top" is exactly
      what the source order does not answer on its own.
    */
    function instructionHtml(p) {
      if (!p.instruction) { return ''; }
      var facts = p.instruction.facts
        ? '<div class="focal-facts">' + p.instruction.facts.map(function (fact) {
            return '<div class="focal-fact"><p class="fact-label">' + esc(fact[0]) + '<\/p>' +
              '<p class="fact-value">' + esc(fact[1]) + '<\/p><\/div>';
          }).join('') + '<\/div>'
        : '';
      return '<section class="work-region" aria-labelledby="work-how-h">' +
        '<div class="region-head"><h3 class="region-title" id="work-how-h">' + esc(p.instruction.title) + '<\/h3><\/div>' +
        (p.instruction.lead ? '<p class="work-note">' + esc(p.instruction.lead) + '<\/p>' : '') +
        '<ol class="steps">' + p.instruction.steps.map(function (s) {
          return '<li>' + esc(s) + '<\/li>';
        }).join('') + '<\/ol>' +
        facts +
      '<\/section>';
    }

    /*
      One shared body for a region that has nothing true to show. It is a
      composed block, never an empty container: dashed edge, em-dash glyph,
      and the reason written out.
    */
    function unavailableHtml(reason) {
      return '<div class="region-unavailable">' + icon('i-dash', '') +
        '<p>' + esc(reason) + '<\/p><\/div>';
    }

    /*
      PHASES. A summary, not a board. Each row carries a marker glyph, the
      plain source-backed phase label, a decorative distribution bar, and the
      counts in words. Exact headings stay in Source details. The current phase
      is carried by four independent cues, so the row survives losing colour.
    */
    function phasesHtml(p) {
      if (!p.phases) { return ''; }
      var head = '<div class="region-head"><h3 class="region-title" id="work-phases-h">Phases<\/h3><\/div>';
      if (p.phases.unavailable) {
        return '<section class="work-region" aria-labelledby="work-phases-h">' + head +
          unavailableHtml(p.phases.unavailable) + '<\/section>';
      }

      var rows = p.phases.rows.map(function (ph) {
        var blocked = ph.blocked || 0;
        var total = ph.done + ph.doing + blocked + ph.open;
        var glyph = ph.state === 'done' ? 'i-check' : ph.state === 'current' ? 'i-half' : 'i-circle';
        var count = '<span class="phase-count-strong">' + ph.done + ' of ' + total + '<\/span> done' +
          (ph.doing ? ' \u00b7 ' + ph.doing + ' in progress' : '') +
          (blocked ? ' \u00b7 ' + blocked + ' blocked' : '');
        return '<li class="phase-row is-' + ph.state + '"' + (ph.state === 'current' ? ' aria-current="step"' : '') + '>' +
          '<span class="phase-mark" aria-hidden="true">' + icon(glyph, '') + '<\/span>' +
          '<p class="phase-name">' + esc(ph.name) +
            (ph.state === 'current' ? '<span class="fui-badge fui-badge-brand phase-now">Current phase<\/span>' : '') +
          '<\/p>' +
          '<span class="phase-dist" aria-hidden="true">' +
            (ph.done ? '<span class="phase-seg is-done" style="--seg:' + ph.done + '"><\/span>' : '') +
            (ph.doing ? '<span class="phase-seg is-doing" style="--seg:' + ph.doing + '"><\/span>' : '') +
            (blocked ? '<span class="phase-seg is-blocked" style="--seg:' + blocked + '"><\/span>' : '') +
            (ph.open ? '<span class="phase-seg is-open" style="--seg:' + ph.open + '"><\/span>' : '') +
          '<\/span>' +
          '<p class="phase-count">' + count + '<\/p>' +
        '<\/li>';
      }).join('');

      return '<section class="work-region" aria-labelledby="work-phases-h">' + head +
        '<ol class="phases">' + rows + '<\/ol>' +
        (p.phases.note ? '<div class="region-foot"><p class="caption">' + esc(p.phases.note) + '<\/p><\/div>' : '') +
      '<\/section>';
    }

    /*
      ACTIVITY. A real ordered list, newest first, with a spine. Summaries are
      written for reading; the untruncated recorded text of each one is under
      Evidence -> Source details, together with the total recorded count.
    */
    function activityHtml(p) {
      if (!p.activity) { return ''; }
      var head = '<div class="region-head"><h3 class="region-title" id="work-activity-h">Activity<\/h3>' +
        '<span class="caption">Most recent first<\/span><\/div>';
      if (p.activity.unavailable) {
        return '<section class="work-region" aria-labelledby="work-activity-h">' + head +
          unavailableHtml(p.activity.unavailable) + '<\/section>';
      }

      var items = p.activity.entries.map(function (e) {
        return '<li>' +
          '<span class="trail-node" aria-hidden="true"><\/span>' +
          '<p class="trail-date"><time datetime="' + esc(e.date) + '">' + esc(e.dateText) + '<\/time><\/p>' +
          '<p class="trail-text">' + esc(e.text) + '<\/p>' +
        '<\/li>';
      }).join('');

      return '<section class="work-region" aria-labelledby="work-activity-h">' + head +
        '<ol class="trail">' + items + '<\/ol>' +
        '<div class="region-foot"><p class="caption">' +
          esc('Showing the ' + p.activity.entries.length + ' most recent of ' + p.activity.total +
            ' recorded events. The full text of every event is in Evidence \u2192 Source details.') +
          (p.activity.note ? ' ' + esc(p.activity.note) : '') +
        '<\/p><\/div>' +
      '<\/section>';
    }

    /*
      The composed centre for a feature whose detail was never read. Bounded,
      centred, content-sized, and read-only: the one action it offers reopens
      the feature list that already lives in the command bar.
    */
    function noticeHtml(p) {
      if (!p.notice) { return ''; }
      var n = p.notice;
      return '<section class="work-region is-notice" aria-labelledby="work-notice-h">' +
        '<div class="notice">' +
          '<h3 class="notice-head" id="work-notice-h">' + icon('i-info', '') + '<span>' + esc(n.title) + '<\/span><\/h3>' +
          '<p>' + esc(n.lead) + '<\/p>' +
          '<ul class="notice-list">' + n.items.map(function (item) {
            return '<li>' + icon('i-dash', '') + '<span>' + esc(item) + '<\/span><\/li>';
          }).join('') + '<\/ul>' +
          '<p>' + esc(n.after) + '<\/p>' +
          (n.action.label
            ? '<div class="notice-action">' +
                '<button type="button" class="fui-button fui-button-secondary" data-action="choose">' +
                  icon('i-search', 'fui-button-icon') + esc(n.action.label) +
                '<\/button>' +
              '<\/div>'
            : '') +
          '<p class="caption">' + esc(n.action.note) + '<\/p>' +
        '<\/div>' +
      '<\/section>';
    }

    /*
      Reading order is deliberate. Next step stays the headline and the
      lifecycle stays directly under it; Phases and Activity sit BELOW both, so
      depth never outranks the one thing the user came here to read.
    */
    function workHtml(p) {
      return crumbsHtml(p) + identityHtml(p) + focalHtml(p) + instructionHtml(p) +
        lifecycleHtml(p) + phasesHtml(p) + activityHtml(p) + noticeHtml(p);
    }

    /* ---------------------------------------------------------------- */
    /* Details dock — attention, freshness, properties, surfaces, source */
    /* ---------------------------------------------------------------- */
    function attentionHtml(p) {
      if (!p.attention) { return ''; }
      var a = p.attention;
      var body = '';
      if (a.summary) {
        body += '<p class="status-summary">' + icon('i-check', '') + esc(a.summary) + '<\/p>';
      }
      if (a.bars.length) {
        body += '<div class="attention">' + a.bars.map(function (bar) {
          var metas = bar.meta == null ? [] : (Object.prototype.toString.call(bar.meta) === '[object Array]' ? bar.meta : [bar.meta]);
          return '<div class="fui-messagebar fui-messagebar-' + bar.intent + '">' +
            '<span class="fui-messagebar-icon">' + icon(bar.icon, 'fui-icon') + '<\/span>' +
            '<div><p class="fui-messagebar-title">' + esc(bar.title) + '<\/p>' +
            '<p class="fui-messagebar-text">' + esc(bar.text) + '<\/p>' +
            metas.map(function (m) { return '<p class="fui-messagebar-meta">' + esc(m) + '<\/p>'; }).join('') +
            '<\/div><\/div>';
        }).join('') + '<\/div>';
      }
      if (a.facts.length) {
        body += '<ul class="facts">' + a.facts.map(function (fact) {
          return '<li>' + icon('i-check', '') + esc(fact) + '<\/li>';
        }).join('') + '<\/ul>';
      }
      if (!body) { return ''; }
      return '<section class="dock-section" aria-labelledby="dock-attention-h">' +
        '<h3 class="region-title" id="dock-attention-h">Attention<\/h3>' + body +
      '<\/section>';
    }

    var SURFACES = [
      ['Now', 'Open', true],
      ['Work', 'Later', false],
      ['Artifacts', 'Later', false],
      ['Review', 'Later', false],
      ['Memory', 'Later', false],
      ['Team', 'Later', false]
    ];

    function dockHtml(p) {
      var fresh = p.freshness;
      var out = '<h2 class="u-visually-hidden">Details<\/h2>';

      out += attentionHtml(p);

      out += '<section class="dock-section" aria-labelledby="dock-fresh-h">' +
        '<h3 class="region-title" id="dock-fresh-h">Freshness<\/h3>' +
        '<p class="status-summary' + (fresh.state === 'failed' ? ' is-failed' : '') + '">' +
          icon(fresh.state === 'failed' ? 'i-warning' : 'i-clock', '') +
          '<span id="dock-fresh-label">' + esc(fresh.label) + '<\/span>' +
        '<\/p>' +
        '<p class="caption" id="dock-fresh-detail">' + esc(fresh.detail) + '<\/p>' +
        '<p class="caption">Refresh is in the toolbar at the top of the window.<\/p>' +
      '<\/section>';

      if (p.props && p.props.length) {
        out += '<section class="dock-section" aria-labelledby="dock-props-h">' +
          '<h3 class="region-title" id="dock-props-h">Properties<\/h3>' +
          '<dl class="props">' + p.props.map(function (row) {
            return '<dt>' + esc(row[0]) + '<\/dt><dd>' + esc(row[1]) + '<\/dd>';
          }).join('') + '<\/dl>' +
        '<\/section>';
      }

      out += '<section class="dock-section" aria-labelledby="dock-surfaces-h">' +
        '<h3 class="region-title" id="dock-surfaces-h">Surfaces<\/h3>' +
        '<ul class="surfaces">' + SURFACES.map(function (s) {
          return '<li' + (s[2] ? ' class="is-open"' : '') + '>' +
            icon(s[2] ? 'i-focus' : 'i-clock', '') + esc(s[0]) +
            '<span class="surface-when">' + esc(s[1]) + '<\/span><\/li>';
        }).join('') + '<\/ul>' +
        '<p class="caption">Now is the only surface in this cycle. The others arrive later and cannot be opened yet.<\/p>' +
      '<\/section>';

      var rows = p.evidence.rows.map(function (row) {
        return '<dt>' + esc(row[0]) + '<\/dt><dd>' + esc(row[1]) + '<\/dd>';
      }).join('');

      /*
        Everything the projection deliberately keeps out of primary
        orientation lands here, one disclosure away: exact task keys per
        phase, and the untruncated recorded text of every event the Activity
        trail summarises.
      */
      var keys = p.evidence.phaseKeys
        ? '<p class="evidence-label">Task keys by phase<\/p>' +
          '<dl class="source-list">' + p.evidence.phaseKeys.map(function (row) {
            return '<dt>' + esc(row[0]) + '<\/dt><dd>' + esc(row[1]) + '<\/dd>';
          }).join('') + '<\/dl>'
        : '';

      var history = p.evidence.history
        ? '<p class="evidence-label">Recorded events — full text<\/p>' +
          '<ol class="source-events">' + p.evidence.history.map(function (e) {
            return '<li><span class="event-date">' + esc(e.date) + ' UTC<\/span> ' + esc(e.full) + '<\/li>';
          }).join('') + '<\/ol>' +
          '<p class="caption">' + esc(p.evidence.history.length + ' most recent of ' + p.evidence.historyTotal +
            ' recorded events, verbatim from .dude/ideas/052-dude-canvas-ui.md — Coordinator Log.') + '<\/p>'
        : '';

      out += '<section class="dock-section" aria-labelledby="dock-evidence-h">' +
        '<h3 class="region-title" id="dock-evidence-h">Evidence<\/h3>' +
        '<details class="fui-accordion">' +
          '<summary class="fui-accordion-header">' + icon('i-chevron', 'fui-chevron') + 'Source details<\/summary>' +
          '<div class="evidence-body">' +
            '<dl class="source-list">' + rows + '<\/dl>' +
            keys +
            (p.evidence.event
              ? '<div class="event"><p class="event-text">' + esc(p.evidence.event.text) + '<\/p>' +
                '<p class="event-source">' + esc(p.evidence.event.source) + '<\/p><\/div>'
              : '<p class="caption">' + esc(p.evidence.eventNote) + '<\/p>') +
            history +
          '<\/div>' +
        '<\/details>' +
      '<\/section>';

      return out;
    }

    /* ---------------------------------------------------------------- */
    /* Status bar — ambient window furniture, no interactive targets      */
    /* ---------------------------------------------------------------- */
    /*
      Plain language only: this strip is primary orientation, so no lane name,
      task key, path, or classification code may appear here.
    */
    function trustOf(p) {
      if (p.identity) { return p.identity.trust; }
      return p.trust || VERIFIED_TRUST;
    }

    function stageOf(p) {
      if (p.identity) { return p.identity.stage.text; }
      return p.stageWord || 'Unavailable';
    }

    function keysHint() {
      if (!chooser.isOpen()) { return '<kbd>Tab<\/kbd> moves · <kbd>Enter<\/kbd> activates'; }
      /*
        Escape's first step depends on whether a search is running, so the hint
        says which one it is rather than describing both and leaving the reader
        to work out where they are.
      */
      return '<kbd>\u2191<\/kbd> <kbd>\u2193<\/kbd> move · <kbd>Enter<\/kbd> open · ' +
        (chooser.isFiltering()
          ? '<kbd>Esc<\/kbd> clears the search'
          : '<kbd>Esc<\/kbd> closes');
    }

    function statusHtml(p) {
      var trust = trustOf(p);
      var trustClass = trust.kind === 'ok' ? 'is-ok' : trust.kind === 'caution' ? 'is-caution' : 'is-error';
      var trustIcon = trust.kind === 'ok' ? 'i-check' : trust.kind === 'caution' ? 'i-clock' : 'i-error';
      var fresh = p.freshness;

      return '<span class="st-seg">' + icon('i-focus', '') + '<span class="st-strong">' + esc(stageOf(p)) + '<\/span><\/span>' +
        '<span class="st-seg">' + icon('i-mark', '') + '<span>' + esc(p.work || 'Task detail unavailable') + '<\/span><\/span>' +
        '<span class="st-seg st-keys st-push" id="status-keys">' + icon('i-keyboard', '') + '<span>' + keysHint() + '<\/span><\/span>' +
        '<span class="st-seg' + (fresh.state === 'failed' ? ' is-caution' : '') + '">' +
          icon(fresh.state === 'failed' ? 'i-warning' : 'i-clock', '') +
          '<span id="status-fresh">' + esc(fresh.label) + '<\/span><\/span>' +
        '<span class="st-seg ' + trustClass + '">' + icon(trustIcon, '') + '<span>' + esc(trust.text) + '<\/span><\/span>';
    }

    /* ---------------------------------------------------------------- */
    /* Application state                                                 */
    /* ---------------------------------------------------------------- */
    var STATE_LABEL = {
      current: 'Current',
      chooser: 'Chooser',
      blocked: 'Blocked',
      stale: 'Stale',
      empty: 'Empty',
      malformed: 'Malformed',
      mismatch: 'Tracking mismatch'
    };

    var stateId = 'current';
    var selectedNumber = SELECTED;
    var busy = false;
    /* Prototype-only: makes the host refuse the next selection. See the drawer. */
    var selectionFails = false;

    function projection() {
      if (stateId === 'chooser') { return STATES.chooser(); }
      if (stateId === 'empty') { return STATES.empty(); }
      if (selectedNumber !== SELECTED) {
        var f = ideaByNumber(selectedNumber);
        if (f) { return frontmatterProjection(f); }
      }
      return STATES[stateId]();
    }

    function announce(message) {
      document.getElementById('live-region').textContent = message;
    }

    /*
      WHAT THE COMMAND-BAR CONTROL IS OFFERED, PER PROJECTION.
      A projection that found features carries them all, whether or not one of
      them is already open — that is the point of the revision: opening a
      feature must not consume the inventory that let you open it. Only the
      empty projection, which found nothing at all, has an empty inventory, and
      it is the only one that falls back to the inert chip.
    */
    function inventoryFor(p) {
      return p.mode === 'empty' ? [] : CHOICES;
    }

    /*
      WHICH ROW IS THE SELECTED ONE. The projection's identity key is the
      canonical identifier, the same string the option labels are built from,
      so the marked row is resolved from the projection rather than remembered
      from the last click. A projection with no identity — the chooser — has no
      selected row, and nothing is marked or preselected.
    */
    function selectedChoice(p) {
      if (p.mode === 'chooser' || !p.identity) { return null; }
      for (var i = 0; i < CHOICES.length; i += 1) {
        if (featureKey(CHOICES[i]) === p.identity.key) { return CHOICES[i]; }
      }
      return null;
    }

    /*
      One render replaces the three document regions — work, dock, status —
      and never the window chrome. That is the application-shell idea made
      literal: the title bar, the activity rail, and the focused control inside
      them survive every update.
    */
    function render() {
      var p = projection();
      var hadContextFocus = chooser.contains(document.activeElement);

      document.getElementById('work').innerHTML = workHtml(p);
      document.getElementById('dock').innerHTML = dockHtml(p);
      document.getElementById('status').innerHTML = statusHtml(p);

      /*
        The context slot follows the projection, and only the projection. The
        fork is INVENTORY, not selection: the Combobox whenever there are real
        choices to open — with the selected feature displayed and marked when
        one is open — and the inert identity chip only when the projection
        carries no features at all. No disabled control is left in the bar
        pretending to be a way in, and no selection is left without a way out.
      */
      chooser.setProjection(inventoryFor(p), selectedChoice(p), p.mode === 'empty'
        ? 'No feature available'
        : (p.identity ? p.identity.title : 'No feature selected'));
      if (hadContextFocus && !chooser.contains(document.activeElement)) {
        moveFocus(document.getElementById('work-feature-title'), keyboardIntent);
      }

      document.getElementById('proto-now').textContent =
        'Fixture: ' + STATE_LABEL[stateId] +
        (stateId !== 'chooser' && selectedNumber && selectedNumber !== SELECTED ? ' · feature ' + selectedNumber : '');
    }

    function syncKeysHint() {
      var host = document.getElementById('status-keys');
      if (!host) { return; }
      host.innerHTML = icon('i-keyboard', '') + '<span>' + keysHint() + '<\/span>';
    }

    /*
      SELECTION SUBMITS THE SEMANTIC SLUG. The row displays the canonical
      identifier, but the request that leaves this control carries `slug`,
      which is the field a `choose` record actually sends and the only one the
      host resolves against. The picked record is passed by reference, so the
      slug is never re-derived by parsing the visible label — there is one
      identity, no fallback, and no ambiguity between the two forms.

      THE HANDLER ANSWERS, AND THE ANSWER IS LOAD-BEARING.
        false  the request was refused. Nothing is committed, nothing is
               rendered, the selector still holds the feature that is genuinely
               open, and the control says so. A refusal must never leave the
               window looking as though the refused feature were open.
        true   the projection is replaced, the list closes, and focus lands on
               the heading of the feature that was just opened — not back on a
               control the user has finished with. The announcement names the
               canonical identifier, because that is what the user just read on
               the row, and the same string is now displayed in the bar.
    */
    function selectFeature(choice, viaKeyboard) {
      if (!choice) { return false; }
      var f = ideaBySlug(choice.slug);
      if (!f) { return false; }
      /*
        The one modelled refusal. A real host can fail here — a feature file
        that moved between the read and the click, a package whose exact owner
        no longer resolves — and the prototype drawer is the only way to reach
        that path in a page with no host behind it. The refusal is returned,
        not announced here: the control knows both the refused feature and the
        one it kept, so it is the honest place to say which is which.
      */
      if (selectionFails) { return false; }
      selectedNumber = f.n;
      /* Fixtures other than Current describe 052 only. */
      if (stateId === 'chooser' || (f.n !== SELECTED && stateId !== 'current')) {
        stateId = 'current';
        syncRadios();
      }
      render();
      moveFocus(document.getElementById('work-feature-title'), viaKeyboard || keyboardIntent);
      announce('Opened ' + featureKey(f) + '.');
      return true;
    }

    /* ---------------------------------------------------------------- */
    /* Focus continuity across DOM replacement                           */
    /* ---------------------------------------------------------------- */
    /*
      Reused from fluent-responsive-workspace.html. Every update replaces the
      work, dock, and status regions, which destroys whatever node had focus
      inside them and drops focus to <body>. Focus intent is captured before
      the update and restored to the equivalent node afterwards.

      Two rules keep this honest:
        - focus is only MOVED when the user's own action replaced the node they
          were using; background updates never steal it;
        - the ring is only made visible when the action was keyboard-driven.
    */
    var keyboardIntent = false;
    document.addEventListener('keydown', function () { keyboardIntent = true; }, true);
    document.addEventListener('mousedown', function () { keyboardIntent = false; }, true);
    document.addEventListener('touchstart', function () { keyboardIntent = false; }, true);

    function moveFocus(node, visible) {
      if (!node || node.disabled) { return false; }
      node.focus();
      if (document.activeElement !== node) { return false; }
      if (visible) {
        node.setAttribute('data-proto-focus', 'visible');
        var drop = function () {
          node.removeAttribute('data-proto-focus');
          node.removeEventListener('blur', drop);
        };
        node.addEventListener('blur', drop);
      }
      return true;
    }

    /* ---------------------------------------------------------------- */
    /* Activity rail                                                     */
    /* ---------------------------------------------------------------- */
    /*
      Only Now is enabled, and it is already the open surface, so activating it
      re-reads nothing and claims nothing: it re-renders the same projection
      and says so. The other five rail items are inert `disabled` buttons and
      have no handler at all.
    */
    document.getElementById('rail-now').addEventListener('click', function () {
      render();
      announce('Now is already the open surface.');
    });

    /* ---------------------------------------------------------------- */
    /* Prototype drawer                                                  */
    /* ---------------------------------------------------------------- */
    var protoToggle = document.getElementById('proto-toggle');
    var protoPanel = document.getElementById('proto-panel');

    function setDrawer(open) {
      protoPanel.hidden = !open;
      protoToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    protoToggle.addEventListener('click', function () {
      setDrawer(protoToggle.getAttribute('aria-expanded') !== 'true');
    });

    /* ---------------------------------------------------------------- */
    /* Theme (prototype control)                                         */
    /* ---------------------------------------------------------------- */
    var themeSwitch = document.getElementById('theme-switch');
    var themeStateLabel = document.getElementById('theme-state');
    var hostDarkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var themeChosenExplicitly = false;

    function queryTheme() {
      return document.documentElement.getAttribute('data-proto-theme');
    }

    function effectiveDark() {
      var forced = queryTheme();
      if (forced) { return forced === 'dark'; }
      return !!(hostDarkQuery && hostDarkQuery.matches);
    }

    /* Switch state only: the .theme-system rule is still painting the theme. */
    function syncThemeControl(dark) {
      themeSwitch.setAttribute('aria-checked', dark ? 'true' : 'false');
      themeStateLabel.textContent = dark ? 'Dark' : 'Light';
    }

    /* An explicit choice pins the theme for this page lifetime only. */
    function applyExplicitTheme(dark) {
      themeChosenExplicitly = true;
      ['app', 'proto-bar'].forEach(function (id) {
        var node = document.getElementById(id);
        node.classList.remove('theme-system');
        node.classList.toggle('theme-dark', dark);
        node.classList.toggle('theme-light', !dark);
      });
      syncThemeControl(dark);
    }

    themeSwitch.addEventListener('click', function () {
      var dark = themeSwitch.getAttribute('aria-checked') !== 'true';
      applyExplicitTheme(dark);
      announce(dark ? 'Dark theme.' : 'Light theme.');
    });

    if (hostDarkQuery) {
      var followHost = function () {
        document.documentElement.classList.toggle('proto-host-dark', hostDarkQuery.matches);
        if (!themeChosenExplicitly && !queryTheme()) { syncThemeControl(hostDarkQuery.matches); }
      };
      if (hostDarkQuery.addEventListener) {
        hostDarkQuery.addEventListener('change', followHost);
      } else if (hostDarkQuery.addListener) {
        hostDarkQuery.addListener(followHost);
      }
    }

    /* ---------------------------------------------------------------- */
    /* State radio group (prototype control)                             */
    /* ---------------------------------------------------------------- */
    var radios = Array.prototype.slice.call(document.querySelectorAll('#state-group [role="radio"]'));

    function syncRadios() {
      radios.forEach(function (r) {
        var on = r.getAttribute('data-state') === stateId;
        r.setAttribute('aria-checked', on ? 'true' : 'false');
        r.tabIndex = on ? 0 : -1;
      });
    }

    function selectState(next, focusIt) {
      stateId = next;
      selectedNumber = next === 'chooser' ? null : SELECTED;
      syncRadios();
      render();
      if (focusIt) {
        radios.filter(function (r) { return r.getAttribute('data-state') === stateId; })[0].focus();
      }
    }

    radios.forEach(function (radio, index) {
      radio.addEventListener('click', function () { selectState(radio.getAttribute('data-state'), false); });
      radio.addEventListener('keydown', function (event) {
        var delta = event.key === 'ArrowRight' || event.key === 'ArrowDown' ? 1
          : event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -1 : 0;
        if (!delta) { return; }
        event.preventDefault();
        var next = radios[(index + delta + radios.length) % radios.length];
        selectState(next.getAttribute('data-state'), true);
      });
    });

    /* ---------------------------------------------------------------- */
    /* The one feature control is wired to the one selection handler      */
    /* ---------------------------------------------------------------- */
    /*
      Open, close, filter, keyboard, and outside-click all live inside the
      Combobox above. Nothing else in the window opens a feature list, because
      there is nothing else to open.
    */
    chooser.onSelect(function (choice, viaKeyboard) { return selectFeature(choice, viaKeyboard); });

    /* ---------------------------------------------------------------- */
    /* Selection outcome (prototype control)                             */
    /* ---------------------------------------------------------------- */
    /*
      Not part of Dude, and not a product setting. It exists so the refusal
      path can be reviewed in the same window as the success path: with it on,
      every request is refused, the selector keeps the feature that is actually
      open, and the popup says which request failed and which feature stands.
    */
    var selectSwitch = document.getElementById('select-switch');
    var selectStateLabel = document.getElementById('select-state');

    function syncSelectionControl() {
      selectSwitch.setAttribute('aria-checked', selectionFails ? 'true' : 'false');
      selectStateLabel.textContent = selectionFails ? 'Fails' : 'Succeeds';
    }

    selectSwitch.addEventListener('click', function () {
      selectionFails = !selectionFails;
      syncSelectionControl();
      announce(selectionFails
        ? 'Prototype: selection requests will be refused.'
        : 'Prototype: selection requests will succeed.');
    });

    /* ---------------------------------------------------------------- */
    /* Product controls: Refresh and copy                                */
    /* ---------------------------------------------------------------- */
    /*
      Refresh lives in the command bar, the way a desktop tool window keeps its
      refresh affordance in chrome rather than in the document. The button
      therefore survives the render, but the freshness readouts it updates do
      not, so the same capture-and-restore rule still applies.
    */
    function refresh() {
      if (busy) { return; }
      busy = true;
      var button = document.getElementById('refresh-button');
      /*
        The button stays focusable while busy (aria-disabled, not disabled), so
        the keyboard user is not thrown out of their own action mid-read.
      */
      var hadFocus = document.activeElement === button;
      var showRing = hadFocus && keyboardIntent;
      button.setAttribute('aria-disabled', 'true');
      button.setAttribute('aria-busy', 'true');
      var freshLabel = document.getElementById('dock-fresh-label');
      var freshDetail = document.getElementById('dock-fresh-detail');
      var statusFresh = document.getElementById('status-fresh');
      if (freshLabel) { freshLabel.textContent = 'Reading sources\u2026'; }
      if (freshDetail) { freshDetail.textContent = 'The visible view stays in place until one complete read succeeds.'; }
      if (statusFresh) { statusFresh.textContent = 'Reading sources\u2026'; }
      announce('Reading sources.');

      window.setTimeout(function () {
        busy = false;
        var swapped = stateId === 'stale';
        if (swapped) {
          /* A successful refresh swaps exactly one complete projection. */
          stateId = 'current';
          syncRadios();
        }
        render();
        var rebuilt = document.getElementById('refresh-button');
        rebuilt.removeAttribute('aria-disabled');
        rebuilt.removeAttribute('aria-busy');
        if (hadFocus) { moveFocus(rebuilt, showRing); }
        announce(swapped
          ? 'Read just now. One complete view replaced the preserved one.'
          : 'Read just now.');
      }, 900);
    }

    function copyText(text, button) {
      var done = function (ok) {
        button.lastChild.nodeValue = ok ? 'Copied' : 'Copy failed';
        announce(ok ? 'Copied ' + text : 'Copy failed. Select the command text instead.');
        window.setTimeout(function () {
          if (button.isConnected) { button.lastChild.nodeValue = 'Copy command'; }
        }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
        return;
      }
      try {
        var area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        done(document.execCommand('copy'));
        document.body.removeChild(area);
      } catch (error) {
        done(false);
      }
    }

    document.addEventListener('click', function (event) {
      var action = event.target.closest ? event.target.closest('[data-action]') : null;
      if (!action) { return; }
      if (action.getAttribute('aria-disabled') === 'true') { return; }
      if (action.getAttribute('data-action') === 'refresh') { refresh(); }
      if (action.getAttribute('data-action') === 'copy') { copyText(action.getAttribute('data-copy'), action); }
      /*
        The one safe action offered by the not-read notice. It selects nothing
        and reads nothing new: it hands focus to the one control in the command
        bar and opens its list, with the feature that is currently open still
        displayed in the field and still marked in the list. It is a way BACK
        to the single selector, never a second one, and it no longer throws the
        current selection away to get there — the list opens whole either way,
        so there is nothing to gain by clearing it.
        The chooser's own outside-click handler would close a list opened from
        inside the document, so this is deferred past that handler.
      */
      if (action.getAttribute('data-action') === 'choose') {
        window.setTimeout(function () {
          chooser.focus();
          chooser.open();
          announce('Feature list opened. ' + CHOICES.length + ' features. Scroll it, or type to narrow it.');
        }, 0);
      }
    });

    /* ---------------------------------------------------------------- */
    /* Boot — query parameters, then first render                        */
    /* ---------------------------------------------------------------- */
    (function boot() {
      var params;
      try { params = new URLSearchParams(window.location.search); } catch (error) { params = null; }
      if (params) {
        var wanted = params.get('state');
        if (wanted && STATES[wanted]) {
          stateId = wanted;
          selectedNumber = wanted === 'chooser' ? null : SELECTED;
        }
        if (params.get('controls') === 'open') { setDrawer(true); }
        if (params.get('select') === 'fail') { selectionFails = true; }
      }
      syncRadios();
      syncSelectionControl();
      /* Host preference is the first-load default; the CSS already painted it. */
      syncThemeControl(effectiveDark());
      render();
    }());
  }());
  </script>
</body>
</html>
