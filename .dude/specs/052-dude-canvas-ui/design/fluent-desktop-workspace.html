  <!--
    Inline empty-data icon. The browser otherwise requests /favicon.ico and logs
    a 404. This declaration is a data URL, so it keeps the prototype's
    external-resource-free constraint intact: nothing is fetched.

  <link rel="icon" href="data:,">
  <script>
    /*
      PRE-PAINT RESOLUTION — host colour scheme and query-parameter overrides.
      Reused verbatim in behaviour from fluent-responsive-workspace.html.

      A real build reads the host's theme and hands FluentProvider either
      webLightTheme or webDarkTheme. The prototype does the same thing with the
      only signal a standalone page has: prefers-color-scheme. The class is set
      on <html> here, in <head>, so the token block below resolves the correct
      theme in the first style pass instead of flashing light.

        ?state=current|chooser|blocked|stale|empty|malformed|mismatch
        ?theme=light|dark
        ?controls=open|closed

      ?theme is applied here, before first paint, for the same reason. Nothing
      is persisted: there is no storage and no cookie.
    */
    (function () {
      try {
        var query = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (query && query.matches) {
          document.documentElement.classList.add('proto-host-dark');
        }
      } catch (error) {
        /* No matchMedia: the light default in the token block stands. */
      }
      try {
        var theme = new URLSearchParams(window.location.search).get('theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-proto-theme', theme);
        }
      } catch (error) {
        /* No URLSearchParams: the host preference stands. */
      }
    }());
  </script>

    WHAT THIS IS
      The canonical approved preview for the read-only I1 "Now" capability and
      the exact preview_path recorded in spec.md. It is an APPLICATION WINDOW:
      persistent chrome at the top and the bottom, docked regions with real
      edges between them, small type, tight rhythm, rules instead of gaps, and
      one elevated surface only where Fluent semantics justify it.

      No network, no CDN, no webfont, no fetch, no build step, no logo.
      Every icon is inline SVG. Segoe UI is requested first and falls back to
      the platform UI font, exactly as FluentProvider behaves off Windows.

    WHAT IT IS NOT
      Not Needs You. Not Sharpie/Review. Not a dashboard. Not a command list.
      Nothing here mutates Dude state, sends a message, runs a command,
      answers a question, approves, or stops work.

    --------------------------------------------------------------------------
    REVISION 2026-09-04d — the selected feature, and the list you can still open
    --------------------------------------------------------------------------
    REPORTED, in the built host, with `052-dude-canvas-ui` open: pressing the
    chevron produced a list of ONE row — the feature already open — and the
    only way to see the other 49 was to delete a 19-character name the user had
    never typed. Two decisions caused it, and they are fixed as one:

      1. THE SLOT FORKED ON SELECTION INSTEAD OF ON INVENTORY. A projection
         with a feature open swapped the control for the inert identity chip,
         so the window could show a feature but not change which one.
         NOW: the fork is INVENTORY. Chooser mode and selected-feature mode are
         THE SAME command-bar Combobox; only the empty projection, which found
         no features at all, still takes the chip.

      2. THE DISPLAYED VALUE WAS ALSO THE QUERY. The field held the selected
         identifier and that same string was fed to the filter, so opening
         filtered to the one row already chosen.
         NOW: SELECTED VALUE AND QUERY ARE TWO PIECES OF STATE. `committed`
         owns the closed display value and the one row carrying aria-selected.
         `query` is null until the user actually types. A null query is NO
         filter, so the first click — on the chevron, the field, or the label
         side — always opens all 50 with the committed row marked, made active,
         and scrolled into view, while the field goes on displaying it.

    THE CONTRACT THIS REVISION ADDS
      - Closed, selected mode displays the canonical identifier and nothing
        else. Closed, chooser mode is empty with the total-based placeholder.
      - One click opens. It never toggles shut, so a first click cannot end
        with the list hidden.
      - Opening selects the displayed text, so the next character REPLACES the
        identifier instead of appending to it; Backspace and Delete drop the
        display and show the whole list rather than chipping a letter off a
        name that is not a query. Nothing has to be deleted by the user.
      - Filtering matches the canonical identifier OR the slug, so `052`,
        `dude`, and `dude-canvas-ui` all find the same row. Source order
        survives; nothing is ranked.
      - ESCAPE HAS TWO STEPS. With a filter running it RESTORES: the committed
        identifier returns to the field, the whole list returns with that row
        marked, highlighted, and revealed, and the popup stays open. Pressing
        it again closes and preserves the selection. Focus stays on the one
        control either way.
      - An abandoned search — Escape, blur, an outside click, Tab away — is
        discarded, never promoted: the field can never sit in the bar showing
        a value the window is not actually showing.
      - A REFUSED SELECTION IS NOT A SELECTION. `committed` is untouched, the
        previous identifier is put back, the previous row is re-marked, the
        list comes back open, and one sentence names both the refused feature
        and the one that is still open. It can never look committed to the
        refused value.
      - A SUCCESSFUL SELECTION submits the record's semantic slug, closes the
        list, updates the canonical label in the bar and the identity strip,
        and lands focus on the opened feature's heading.

    THE SELECTED ROW IS MARKED WITH REAL FLUENT OPTION SEMANTICS, AND THE ROW
    DOES NOT GROW. Fluent's Option renders a `checkIcon` slot for every option
    in a selectable listbox and hides it with `visibility`, so marking one row
    never re-flows the list. That is exactly what `.option-check` does here:
    16px of reserved glyph plus a 4px gap on all 50 rows, the row height still
    exactly 36px, the label column still one column. Three independent cues
    carry selection — the brand check GLYPH, the neutral selected FILL, and
    `aria-selected` — so it survives losing colour, and the fill is never the
    only one. SELECTED is not ACTIVE: aria-selected marks the committed row and
    only ever moves on a commit, while aria-activedescendant carries the
    keyboard highlight and commits nothing.

    ONE BEHAVIOURAL DEFECT WAS FOUND BY THE HEADLESS SCRIPT AND FIXED HERE.
    Choosing an option repaints the listbox, so the clicked row is detached
    from the document before the page-level outside-click listener runs, and
    `root.contains(target)` no longer recognised it as ours. A refused pointer
    selection therefore reopened the list inside the option handler and had it
    closed again one event later by the very click that caused it — taking the
    failure sentence, which lives inside the popup, off screen with it. The
    listener now ignores a target the control itself detached. The keyboard
    refusal path was never affected, which is what made it worth catching.

    WHERE THE STRUCTURE COMES FROM — lifecycle tools, not their branding
    --------------------------------------------------------------------------
    Each convention below is borrowed for a reason, and none of these products
    is cloned. Colour, type, spacing, radius, and stroke are Fluent 2 only.

      VS Code / Visual Studio / JetBrains
        - The narrow left ACTIVITY RAIL of icon targets that names the
          long-term surfaces of the product rather than the current page.
        - The BREADCRUMB strip directly above the work surface.
        - The persistent bottom STATUS BAR carrying ambient state. This is the
          signature move here: freshness and "verified" stop being a card in
          the reading order and become window furniture that is simply always
          true at the bottom edge.
        - Tool windows DOCK against an edge; they do not float as cards.

      Azure DevOps work item
        - The header strip that carries identity, state, and the key fields
          before any detail: feature title, stage pill, identifier.
        - A right-hand PROPERTIES column of label/value pairs, so "what is true
          about this item" is separated from "what to do next".
        - The HISTORY tab: a dated trail of what was recorded against the item.
          Adapted here as ACTIVITY, and the reason a tall window has something
          honest to put in its lower half.
        - Iteration progress as a per-phase SUMMARY rather than a task list.
          Adapted here as PHASES.

      Jira issue view
        - Status pill beside identity at the top, primary detail on the left,
          properties on the right, supporting history last.
        - Epic progress as counts per child grouping, never as a percentage.

      VS Code Timeline
        - History as a vertical trail with a spine, newest first, dated, and
          read-only.

      Linear
        - Density: 12px captions, 20px focal headline, 4-8px rhythm, quiet
          chrome, high information ratio, keyboard hints kept in view.

      GitHub Desktop
        - The prominent CURRENT-CONTEXT control in the title bar. Changing
          context is a first-class piece of chrome, not a link buried in the
          page. Adapted, not copied: GitHub Desktop's control is a button that
          opens a panel, and this window instead puts the real control in the
          bar, because the panel had nothing to add.

      Outlook / Teams
        - The rail -> list -> reading-pane instinct, adapted honestly: I1 Now
          has no list of items to read, so the middle pane is the work surface
          and the third pane is the details dock.

    --------------------------------------------------------------------------
    SHELL ARCHITECTURE
    --------------------------------------------------------------------------
      body (flex column, min-height 100dvh)
        prototype drawer          collapsed, outside the product
        .shell (flex column, flex:1)
          header  role=banner     44px title/command bar, sticky top
          .shell-body             rail | work | dock
            nav     role=navigation   activity rail, 48px, icon-only
            main                      breadcrumb, identity strip, NEXT STEP,
                                      lifecycle + progress, PHASES, ACTIVITY,
                                      and, where detail is missing, one
                                      composed explanation block
            aside   role=complementary  attention, freshness, properties,
                                      evidence
          footer  role=contentinfo  26px status bar, sticky bottom

      READING ORDER INSIDE THE WORK SURFACE
        Next step is the headline and keeps the only elevated surface and the
        only large type. The lifecycle sits directly under it. Phases and
        Activity sit BELOW both: they add depth, and depth must never outrank
        the one thing the user opened the window to read.

      WHY THE WORK COLUMN IS SPLIT IN TWO
        .shell-work is the window SLOT and paints the neutral window surface;
        .work-body is the DOCUMENT inside it, paints Background1, and sizes to
        its own content. Short content therefore ends on a rule with plain
        window background beneath it, exactly as an editor pane behaves. No
        card is stretched, and no empty bordered region is produced.

      The shell composes with MEDIA queries, because the shell is the window
      and its thresholds really are about the window. Regions inside it use
      CONTAINER queries, because those thresholds are about how much room the
      region actually got. One MEDIA query is keyed to viewport HEIGHT rather
      than width: at >= 1000px tall the command-bar feature list shows eight
      rows instead of five, because a tall window can spare the room.

        >= 1080px   three docked regions: rail | work | dock.
                    Derivation: 48 rail + 1 rule + 640 work floor + 1 rule
                    + 300 dock floor + 2x16 work padding = 1038 honest fit.
                    1080 is taken for slack, so the dock lands at its 320px
                    preferred width instead of its 300px floor.

        720-1079    rail | work, and the dock moves BELOW the work surface,
                    still inside the shell, where its sections flow into
                    repeat(auto-fit, minmax(260px, 1fr)) columns.
                    Derivation: 48 rail + 1 rule + 640 work floor + 32
                    padding = 721 honest fit; 720 is the threshold and the
                    work column simply starts one pixel under its comfortable
                    floor at the boundary itself.

        < 720       one column. The activity rail becomes a horizontal strip
                    under the title bar with the same targets, names, and
                    disabled semantics. The status bar stays.

      No max-width shell anywhere. Prose is bounded by --layout-measure-prose
      (68ch) and the focal headline by --layout-measure-headline (36ch).

    --------------------------------------------------------------------------
    HONEST FUTURE SURFACES
    --------------------------------------------------------------------------
    The rail names six long-term surfaces. Exactly one, Now, exists in this
    cycle. The other five are real `disabled` <button>s: they are out of the
    tab order, they cannot be clicked, and their accessible name ends with
    "arrives in a later cycle". Because WCAG 1.4.11 exempts inactive controls,
    a disabled control is the one place a low-contrast boundary would be
    permitted — so it is deliberately NOT the only cue here. Each one carries:
      1. a DASHED boundary (shape, not colour),
      2. a small clock badge in the corner (shape, not colour),
      3. the words "arrives in a later cycle" in its accessible name and in
         its native tooltip,
      4. a visible "Surfaces" list in the details dock, at every width, that
         names all six and says in words which one is open now.
    Showing the architecture without faking the capability is the point.

    DENSITY vs AA — the one real tension, and how it was resolved.
      A dense desktop status bar wants to be ~22px tall and to carry clickable
      segments, the way VS Code's does. A clickable segment inside a 22-26px
      strip cannot reach the 24x24 minimum target size of WCAG 2.2 SC 2.5.8
      without either growing the bar or overflowing it. AA wins: the status bar
      here carries NO interactive targets at all. It is ambient text only, and
      every action it might have hosted (Refresh, the feature chooser) lives in
      the 44px command bar where a 32px target fits honestly.
      The same rule settled two smaller cases: rail targets are 32x32 inside a
      48px rail rather than 24x24 inside a 32px rail, and command-bar buttons
      are 28px minimum rather than the 24px the density wanted.

    Also:
      - No meaning by colour alone. Lifecycle complete = check glyph; current =
        numeral in a filled ring + aria-current="step" + the word "Current";
        not started = hollow numeral; unavailable = dashed ring + em-dash +
        "Unavailable". Progress segments pair a unique glyph with the words
        done / in progress / open. Status-bar segments pair an icon with the
        literal words. MessageBars pair an outlined icon with full text.
        The current PHASE carries four independent cues — a 3px inset accent
        edge, a half-filled marker glyph, the words "Current phase" in a chip,
        and aria-current="step" — so it survives losing colour entirely. Each
        phase's distribution bar is aria-hidden and always paired with its
        count in words. An unavailable region is dashed edge + em-dash + the
        reason written out.
      - Every interactive target is >= 24x24 CSS px. Measured: the not-read
        notice's "Return to the feature list" button is 28px minimum height
        like every other in-window button; the feature Combobox is 32px; and a
        36px chooser option clears SC 2.5.8 by 12px even at one-line density.
      - A chooser option's accessible name is its canonical identifier, read
        as the row's own text: `052-dude-canvas-ui`, the same string a sighted
        user sees and the same one the identity strip shows once it is open.
        No visually hidden alternative name is substituted, so what is heard,
        what is read, and what is typed to find it are one string.
      - The SELECTED row is announced as selected and shown as selected, and
        neither depends on the other. `aria-selected="true"` is on the
        committed row and only that row; the visible cues are the brand check
        glyph and the neutral selected fill. Measured on that row: label
        13.02:1 light / 11.73:1 dark (needs 4.5:1) and check glyph 4.52:1 /
        4.18:1 against the fill (needs 3:1). The fill alone is 1.19:1 / 1.24:1
        against the popup, so it is a supporting cue and never the cue — losing
        colour entirely leaves the glyph and the ARIA state intact.
      - The keyboard highlight is aria-activedescendant plus a brand left edge
        and a background change, so ACTIVE and SELECTED are distinguishable
        from each other and both survive on the same row when the list opens
        on the feature that is already open. A closed control names no active
        descendant at all.
      - Focus is 2px --colorStrokeFocus2 at 2px offset, never removed. The
        feature Combobox carries two indicators, the way Fluent's own Combobox

        drawn on the field root, so it wraps the control rather than the bare
        text node inside it.
      - Landmarks: region (prototype drawer), banner (command bar), navigation
        (activity rail), main (Now), complementary (details dock), contentinfo
        (status bar). One h1, h2 per region, h3 per section — Phases and
        Activity are h3 siblings of Next step and Lifecycle, in that order.
      - Phases and Activity are real <ol> lists, not decorative divs, so they
        are announced with their item counts.
      - aria-live="polite" announces refresh, chooser result counts, selection,
        surface changes, copy results, and the notice action returning to the
        feature list. In the one control it also announces the two Escape
        steps — "Search cleared. 50 features. 052-dude-canvas-ui is still
        selected." and then "Feature list closed. 052-dude-canvas-ui is still
        selected." — and a refusal, which names the feature that could not be
        opened and the one that is still open.
      - Measured contrast of every new text node, light and dark, across the

        current-phase accent, the trail node, the dashed unavailable edge —
        measure 5.18:1 to 6.48:1 (needs 3:1).

      - 200% browser zoom halves the CSS viewport, so the shell simply steps
        down one composition; nothing is lost.

    WHAT PHASES AND ACTIVITY ARE NOT
      Neither is the deferred Work surface. There is no per-task row, no
      expander that reveals an individual actionable task, no task key, and no
      run, claim, start, assign, answer, approve, stop, or mutate affordance
      anywhere in either region. Phases is a progress summary and Activity is a
      dated read of what was already recorded.

    FOCUS ACROSS RERENDER
      Work, dock, and status content are replaced wholesale on every update, so
      a focused node inside them is destroyed. Focus intent is captured before
      the update and restored afterwards: selecting a feature closes the list
      and lands on the selected feature's heading; Escape keeps focus on the
      Combobox that owns the list, restoring the committed value on the first
      press and closing on the second; a refused selection returns focus to the
      same control with the list reopened; and Refresh returns to the Refresh
      button. Focus never falls to <body>, and it is never taken for a
      background change the user did not ask for. Tab always leaves — the list
      is a popup, not a trap. The command bar and the
      activity rail are deliberately NOT replaced, which is itself part of the
      application-shell idea: window chrome persists, documents change. That
      is also why feature selection lives in the bar — it is the one control
      that must survive every rerender it causes.
