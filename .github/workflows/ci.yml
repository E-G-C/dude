name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    name: validate (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # The committed dev bundle under .github/ must match src/ (build-dev output).
      - name: Dev-bundle drift check
        run: |
          visible_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$visible_status" ]; then
            echo "::error::Checkout has tracked or untracked changes before build-dev"
            printf '%s\n' "$visible_status"
            exit 1
          fi

          ignored_status="$(git status --porcelain --ignored --untracked-files=all -- src .github .dude)"
          if [[ "$ignored_status" == *$'!! '* ]]; then
            echo "::error::Checkout has ignored entries under src, .github, or .dude before build-dev"
            printf '%s\n' "$ignored_status"
            exit 1
          fi

          node scripts/build-dev.mjs

          visible_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$visible_status" ]; then
            echo "::error::build-dev changed tracked or untracked files; regenerate and commit the dev bundle"
            printf '%s\n' "$visible_status"
            exit 1
          fi

          ignored_status="$(git status --porcelain --ignored --untracked-files=all -- src .github .dude)"
          if [[ "$ignored_status" == *$'!! '* ]]; then
            echo "::error::build-dev left ignored entries under src, .github, or .dude"
            printf '%s\n' "$ignored_status"
            exit 1
          fi

      # Dependency-free ESM: no install step. Pass test files explicitly because
      # bare `node --test` discovery does not recurse this tree reliably.
      - name: Unit tests
        run: find . -type d \( -name node_modules -o -name dist \) -prune -o -type f -name '*.test.mjs' -print0 | xargs -0 node --test

      - name: Bundle lint
        run: node .github/skills/dude-lint/lint.mjs .

      - name: Pack source verify
        run: node .github/skills/dude-compose/compose.mjs verify

      # The product core lives in src/; build the release bundle and lint it.
      - name: Product build + lint
        run: |
          node scripts/build-release.mjs --out dist
          node .github/skills/dude-lint/lint.mjs dist

  canvas-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install scoped canvas build dependencies
        run: npm ci --prefix scripts/dude-canvas-ui

      # Test committed assets before any workspace build.
      - name: Required canvas build and browser acceptance
        env:
          DUDE_CANVAS_BROWSER_REQUIRED: '1'
          DUDE_CANVAS_ARTIFACTS_DIR: ${{ runner.temp }}/canvas-browser
        run: |
          DUDE_CANVAS_BROWSER="$(command -v google-chrome)"
          test -x "$DUDE_CANVAS_BROWSER"
          export DUDE_CANVAS_BROWSER
          "$DUDE_CANVAS_BROWSER" --version
          node --test --test-reporter=tap scripts/dude-canvas-ui/build.test.mjs scripts/dude-canvas-ui/browser.test.mjs

      - name: Retain canvas evidence, including partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canvas-browser-evidence
          path: ${{ runner.temp }}/canvas-browser/
          if-no-files-found: warn
